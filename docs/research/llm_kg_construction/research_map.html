<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KnowAct · LLM KG Construction Research Map</title>
  <style>
    :root{--bg:#f4f1e8;--panel:#fffdf7;--ink:#1f2a2b;--muted:#64706e;--line:#d7d2c4;--accent:#b84a32;--accent2:#246b68;--shadow:0 12px 36px #35413d14}
    [data-theme="dark"]{--bg:#17201f;--panel:#202b29;--ink:#eef1e8;--muted:#aeb9b4;--line:#3a4945;--accent:#f18a6e;--accent2:#70c7bd;--shadow:0 12px 36px #0005}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    header{padding:34px clamp(20px,5vw,72px) 18px;border-bottom:1px solid var(--line)} h1{font:700 clamp(28px,4vw,52px)/1.04 Georgia,serif;margin:0 0 12px;max-width:980px} header p{max-width:900px;color:var(--muted);font-size:17px}
    .toolbar{display:grid;grid-template-columns:minmax(180px,2fr) 1fr 1fr auto auto;gap:10px;margin-top:20px} input,select,button{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--panel);color:var(--ink)} button{cursor:pointer;font-weight:650} button:hover{border-color:var(--accent)}
    main{padding:24px clamp(20px,5vw,72px) 56px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.metric,.panel,.card{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px}.metric{padding:16px}.metric b{display:block;font:700 28px Georgia,serif;color:var(--accent)}.metric span{color:var(--muted)}
    .layout{display:grid;grid-template-columns:minmax(0,1.8fr) 8px minmax(280px,.9fr);align-items:start}.left{min-width:0}.panel{padding:18px;margin-bottom:18px}.panel h2{font:700 23px Georgia,serif;margin:0 0 12px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}.card{padding:15px;cursor:pointer;transition:.15s}.card:hover,.card.active{transform:translateY(-2px);border-color:var(--accent)}.tag{display:inline-block;padding:3px 7px;border-radius:999px;background:color-mix(in srgb,var(--accent2) 14%,transparent);color:var(--accent2);font-size:12px;margin-right:5px}.card h3{font-size:16px;margin:9px 0 7px}.card p{margin:0;color:var(--muted);font-size:13px}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
    #detail-resizer{cursor:col-resize;background:transparent;min-height:700px}#detail-resizer:hover{background:var(--accent)}aside{position:sticky;top:12px;min-width:0}.detail{padding:18px}.detail h2{font:700 24px Georgia,serif;margin-top:0}.detail h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:18px 0 4px}.detail p{margin:0;color:var(--muted)}.detail a{color:var(--accent2)}
    #relationship-graph{width:100%;height:390px;border:1px solid var(--line);border-radius:10px;background:color-mix(in srgb,var(--panel) 75%,var(--bg))}.edge{stroke:var(--line);stroke-width:1.5}.node{cursor:grab}.node circle{fill:var(--panel);stroke:var(--accent2);stroke-width:2}.node text{fill:var(--ink);font-size:11px;pointer-events:none}.node.core circle{stroke:var(--accent);stroke-width:3}.legend{color:var(--muted);font-size:12px;margin-top:7px}.empty{padding:28px;color:var(--muted);text-align:center;border:1px dashed var(--line);border-radius:10px}
    @media(max-width:900px){.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.summary{grid-template-columns:1fr 1fr}.layout{display:block}#detail-resizer{display:none}aside{position:static;margin-top:18px}}
  </style>
</head>
<body>
<header>
  <h1>可靠的 LLM 知识图谱构建：KnowAct 研究地图</h1>
  <p>13 篇核心工作被映射到一个证据优先的诊断图谱工作流。结论不是“更多 agent 更好”，而是每个角色都必须形成可验证的决策边界。</p>
  <div class="toolbar">
    <input id="search" type="search" placeholder="搜索论文、方法、局限或启发…">
    <select id="phase"><option value="">全部阶段</option></select>
    <select id="sort"><option value="id">按研究脉络</option><option value="year-desc">按年份：新到旧</option><option value="year-asc">按年份：旧到新</option><option value="title">按标题</option></select>
    <button id="theme">深色模式</button><button id="export">导出 JSON</button>
  </div>
</header>
<main>
  <section class="summary"><div class="metric"><b>13</b><span>核心工作</span></div><div class="metric"><b>9</b><span>EDGA 阶段</span></div><div class="metric"><b>3</b><span>证据类别</span></div><div class="metric"><b>0</b><span>允许的静默损坏</span></div></section>
  <div class="layout"><div class="left">
    <section class="panel"><h2>方法关系图</h2><svg id="relationship-graph" role="img" aria-label="论文与 KnowAct 方法组件的关系图"></svg><div class="legend">拖动节点调整布局；橙色节点是 EDGA 方法组件，绿色节点是论文。</div></section>
    <section class="panel"><h2>论文与可迁移机制</h2><div id="cards" class="cards"></div></section>
  </div><div id="detail-resizer" title="拖动调整详情栏宽度"></div><aside><section class="panel detail" id="detail-content"><h2>如何阅读</h2><p>选择论文查看其问题、核心方法、证据、局限与对 KnowAct 的具体启发。</p></section></aside></div>
</main>
<script id="paper-reports-json" type="application/json">
{"reports":[
{"id":"P001","title":"Extract, Define, Canonicalize","year":2024,"venue":"EMNLP","phase":"Extraction / schema / fusion","url":"https://aclanthology.org/2024.emnlp-main.548/","sections":{"problem":"大 schema 或没有既定 schema 时，直接抽取难以扩展。","gap":"把整个 schema 放入 prompt 会形成上下文瓶颈。","coreIdea":"先开放抽取，再定义关系，最后 canonicalize。","method":"Extract–Define–Canonicalize，并检索当前文本相关的 schema。","evidence":"在三个 KGC benchmark 上进行实验。","limitation":"对象是事实三元组，不是可诊断教育概念。","inspiration":"KnowAct 先局部发现概念，再显式全局归一化。"}},
{"id":"P002","title":"SPIRES / OntoGPT","year":2024,"venue":"Bioinformatics","phase":"Schema / extraction","url":"https://doi.org/10.1093/bioinformatics/btae104","sections":{"problem":"自由文本输出难以验证并与领域本体对齐。","gap":"prompt-only 抽取缺少类型契约。","coreIdea":"用 LinkML schema 驱动递归抽取和本体 grounding。","method":"schema-guided structured prompting。","evidence":"展示了生物医学领域的结构化抽取。","limitation":"结构有效不等于语义或教学有效。","inspiration":"每阶段使用可机器验证契约，并另做语义验证。"}},
{"id":"P003","title":"PiVe","year":2024,"venue":"Findings of ACL","phase":"Verification","url":"https://aclanthology.org/2024.findings-acl.400/","sections":{"problem":"LLM 容易遗漏或破坏图结构。","gap":"生成器缺少细粒度结构反馈。","coreIdea":"独立 verifier 提供纠错指令。","method":"生成—验证—迭代修正。","evidence":"三个图生成数据集上持续提升。","limitation":"没有覆盖 KnowAct 的全部语义错误。","inspiration":"使用明确错误分类与有界重试。"}},
{"id":"P004","title":"SAC-KG","year":2024,"venue":"ACL","phase":"Extraction / verification","url":"https://aclanthology.org/2024.acl-long.238/","sections":{"problem":"领域 KG 需要在规模化时保持精度。","gap":"人工不可扩展，朴素生成会传播错误。","coreIdea":"Generator、Verifier、Pruner 分工。","method":"以实体为中心迭代扩图。","evidence":"报告百万节点规模及抽样精度。","limitation":"召回率难确定，任务也不同于教材图。","inspiration":"保留 propose–verify，但补 coverage 与 quarantine。"}},
{"id":"P005","title":"KGGen","year":2025,"venue":"NeurIPS","phase":"Extraction / fusion","url":"https://proceedings.neurips.cc/paper_files/paper/2025/hash/2b368455e832d2b1a60bcad8c4c6481f-Abstract-Conference.html","sections":{"problem":"别名使自动 KG 稀疏而重复。","gap":"已有抽取器的实体和关系冗余。","coreIdea":"实体/关系分步抽取并迭代聚类。","method":"LLM 抽取、entity resolution 与 MINE benchmark。","evidence":"报告更简洁且信息保留较好的图。","limitation":"实体简洁不等于诊断粒度正确。","inspiration":"检索合并候选，显式判定 keep/alias/merge/split。"}},
{"id":"P006","title":"KARMA","year":2025,"venue":"NeurIPS","phase":"End to end","url":"https://proceedings.neurips.cc/paper_files/paper/2025/hash/517f9b9c227b9dd51dba4560f37165ed-Abstract-Conference.html","sections":{"problem":"科学 KG 需要跨文档抽取、融合、冲突与溯源。","gap":"单阶段方法难覆盖全生命周期。","coreIdea":"多个专门角色协作。","method":"九 agent 科学文献流水线。","evidence":"报告 PubMed 大规模构建与冲突下降。","limitation":"没有证明九个 agent 是必要原因。","inspiration":"只有形成可检验边界时才拆角色。"}},
{"id":"P007","title":"GraphJudge","year":2025,"venue":"EMNLP","phase":"Verification","url":"https://aclanthology.org/2025.emnlp-main.554/","sections":{"problem":"噪声、领域知识和幻觉降低 KG 精度。","gap":"直接抽取缺少可靠质量门。","coreIdea":"entity-centric 去噪与训练过的 graph judge。","method":"去噪、抽取、三元组判别。","evidence":"两个通用和一个领域数据集。","limitation":"二元过滤会损失覆盖且继承 judge 偏差。","inspiration":"测校准并使用 typed repair。"}},
{"id":"P008","title":"GraphRefine","year":2026,"venue":"ACL","phase":"Repair","url":"https://aclanthology.org/2026.acl-long.1353/","sections":{"problem":"生成三元组存在事实和表达不一致。","gap":"只删除会丢失可修复信息。","coreIdea":"按错误类型选择删除、编辑或重写。","method":"人类错误 taxonomy 与训练后的 refiner。","evidence":"跨生成抽取器报告多维改进。","limitation":"未覆盖 rubric 与图级教学有效性。","inspiration":"KEEP/FIX/REWRITE/DELETE/QUARANTINE，且重写需独立批准。"}},
{"id":"P009","title":"GenIE","year":2022,"venue":"NAACL","phase":"Extraction","url":"https://aclanthology.org/2022.naacl-main.342/","sections":{"problem":"自回归抽取会生成 schema 外对象。","gap":"非约束解码不能保证合法输出。","coreIdea":"用实体和关系 trie 约束生成。","method":"端到端 closed information extraction。","evidence":"在标准数据集上验证。","limitation":"固定 schema 不适合初始概念发现。","inspiration":"开放发现后对图结构施加硬约束。"}},
{"id":"P010","title":"GoLLIE","year":2024,"venue":"ICLR","phase":"Guidelines / extraction","url":"https://openreview.net/forum?id=Y3wpuxd7u9","sections":{"problem":"IE 对新 schema 和细微标签泛化差。","gap":"标签名称不足以表达标注决策。","coreIdea":"用详细自然语言 guideline 条件化抽取。","method":"代码式 schema 描述与标注说明。","evidence":"跨多个 IE 数据集评估。","limitation":"遵循 guideline 不保证来源或本体有效。","inspiration":"为每类边写正例、近似反例和边界规则。"}},
{"id":"P011","title":"ACE","year":2024,"venue":"JEDM","phase":"Educational KG","url":"https://jedm.educationaldatamining.org/index.php/JEDM/article/view/737","sections":{"problem":"专家无法判断所有先修概念对。","gap":"二次方配对使教育 KG 审查昂贵。","coreIdea":"为专家排序候选对并利用图推理。","method":"embedding 打分、迭代专家标注、动态更新。","evidence":"报告图质量、审查成本与学习结果实验。","limitation":"假定概念已给定，先修定义需重新对齐。","inspiration":"风险排序审查，但区分直接边与推导边。"}},
{"id":"P012","title":"Evidence-Centered Design","year":2003,"venue":"ETS","phase":"Assessment design","url":"https://www.ets.org/research/policy_research_reports/publications/report/2003/hsgs.html","sections":{"problem":"测评需要从观察到能力主张的明确论证。","gap":"任务与评分常缺少一致 evidence model。","coreIdea":"协调 student、evidence、task models。","method":"主张—观察—任务的评估设计框架。","evidence":"基础性评估设计理论与应用框架。","limitation":"不是 text-to-KG 算法。","inspiration":"把 rubric 和诊断题作为测量工具单独验证。"}},
{"id":"P013","title":"Competency Questions","year":1995,"venue":"IFIP","phase":"Ontology design","url":"https://doi.org/10.1007/978-0-387-34847-6_3","sections":{"problem":"用途不显式时，本体难以定界和评估。","gap":"表示会在没有可测试要求时膨胀。","coreIdea":"先定义本体必须回答的问题。","method":"用 competency questions 驱动公理与充分性检查。","evidence":"本体工程的基础方法。","limitation":"问题质量仍依赖领域专家。","inspiration":"在 LLM 抽取前冻结 KnowAct 图的用途。"}}
]}
  </script>
<script>
  const researchData=JSON.parse(document.getElementById('paper-reports-json').textContent);
  const papers=researchData.reports; let selected=null;
  const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const phases=[...new Set(papers.map(p=>p.phase))].sort(); phases.forEach(p=>$('#phase').insertAdjacentHTML('beforeend',`<option>${esc(p)}</option>`));
  function filtered(){const q=$('#search').value.toLowerCase(),ph=$('#phase').value;let a=papers.filter(p=>(!ph||p.phase===ph)&&JSON.stringify(p).toLowerCase().includes(q));const s=$('#sort').value;if(s==='year-desc')a.sort((x,y)=>y.year-x.year);if(s==='year-asc')a.sort((x,y)=>x.year-y.year);if(s==='title')a.sort((x,y)=>x.title.localeCompare(y.title));return a}
  function render(){const a=filtered();$('#cards').innerHTML=a.length?a.map(p=>`<article class="card ${selected===p.id?'active':''}" data-id="${p.id}"><div class="meta"><span>${p.id} · ${p.year}</span><span>${esc(p.venue)}</span></div><h3>${esc(p.title)}</h3><span class="tag">${esc(p.phase)}</span><p>${esc(p.sections.inspiration)}</p></article>`).join(''):'<div class="empty">没有匹配论文</div>';document.querySelectorAll('.card').forEach(c=>c.onclick=()=>show(c.dataset.id))}
  function show(id){selected=id;const p=papers.find(x=>x.id===id),s=p.sections;$('#detail-content').innerHTML=`<div class="meta"><span>${p.id} · ${p.year}</span><span>${esc(p.venue)}</span></div><h2>${esc(p.title)}</h2><a href="${p.url}" target="_blank" rel="noreferrer">打开原论文 ↗</a>${[['研究问题',s.problem],['现有缺口',s.gap],['核心思想',s.coreIdea],['方法',s.method],['证据',s.evidence],['局限',s.limitation],['KnowAct 启发',s.inspiration]].map(x=>`<h3>${x[0]}</h3><p>${esc(x[1])}</p>`).join('')}`;render()}
  ['search','phase','sort'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',render));
  $('#theme').onclick=()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'':'dark';$('#theme').textContent=d.dataset.theme==='dark'?'浅色模式':'深色模式'};
  $('#export').onclick=()=>{const blob=new Blob([JSON.stringify(researchData,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='knowact-kg-research-map.json';a.click();URL.revokeObjectURL(a.href)};
  const components=[{id:'C1',label:'Specification'},{id:'C2',label:'Extraction'},{id:'C3',label:'Canonicalize'},{id:'C4',label:'Verify / Repair'},{id:'C5',label:'Rubric / Expert'}];
  const links=[['P013','C1'],['P010','C1'],['P012','C5'],['P011','C5'],['P001','C2'],['P001','C3'],['P002','C1'],['P002','C2'],['P003','C4'],['P004','C2'],['P004','C4'],['P005','C2'],['P005','C3'],['P006','C4'],['P007','C4'],['P008','C4'],['P009','C2']];
  const svg=$('#relationship-graph'),NS='http://www.w3.org/2000/svg';let W=900,H=390;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);const nodes=[...components,...papers.map(p=>({id:p.id,label:p.id}))];const pos={};components.forEach((n,i)=>pos[n.id]={x:95+i*175,y:70});papers.forEach((p,i)=>pos[p.id]={x:65+(i%7)*128,y:210+Math.floor(i/7)*105});
  function moveNode(id,x,y,g){pos[id]={x,y};g.setAttribute('transform',`translate(${x} ${y})`);svg.querySelectorAll('.edge').forEach(l=>{if(l.dataset.a===id){l.setAttribute('x1',x);l.setAttribute('y1',y)}if(l.dataset.b===id){l.setAttribute('x2',x);l.setAttribute('y2',y)}})}
  function draw(){svg.innerHTML='';links.forEach(([a,b])=>{const l=document.createElementNS(NS,'line');l.setAttribute('class','edge');l.dataset.a=a;l.dataset.b=b;l.setAttribute('x1',pos[a].x);l.setAttribute('y1',pos[a].y);l.setAttribute('x2',pos[b].x);l.setAttribute('y2',pos[b].y);svg.appendChild(l)});nodes.forEach(n=>{const g=document.createElementNS(NS,'g');g.setAttribute('class','node '+(n.id[0]==='C'?'core':''));g.setAttribute('transform',`translate(${pos[n.id].x} ${pos[n.id].y})`);g.dataset.id=n.id;const c=document.createElementNS(NS,'circle');c.setAttribute('r',n.id[0]==='C'?32:22);const t=document.createElementNS(NS,'text');t.setAttribute('text-anchor','middle');t.setAttribute('dy','.35em');t.textContent=n.label;g.append(c,t);svg.appendChild(g);g.onpointerdown=e=>{g.setPointerCapture(e.pointerId);g.onpointermove=m=>{const r=svg.getBoundingClientRect();moveNode(n.id,(m.clientX-r.left)*W/r.width,(m.clientY-r.top)*H/r.height,g)};g.onpointerup=()=>g.onpointermove=null;if(n.id[0]==='P')show(n.id)}})}
  let drag=false;$('#detail-resizer').onpointerdown=e=>{drag=true;e.target.setPointerCapture(e.pointerId)};$('#detail-resizer').onpointermove=e=>{if(!drag)return;const layout=document.querySelector('.layout'),r=layout.getBoundingClientRect(),right=Math.max(280,Math.min(620,r.right-e.clientX));layout.style.gridTemplateColumns=`minmax(0,1fr) 8px ${right}px`};$('#detail-resizer').onpointerup=()=>drag=false;
  render();draw();
</script>
</body>
</html>
