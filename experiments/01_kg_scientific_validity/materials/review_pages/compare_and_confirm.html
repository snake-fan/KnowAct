entives."}],"diagnostic_goal":"Diagnose whether the learner understands social preferences as individual motives such as altruism, fairness, inequality aversion, and reciprocity, and understands how controlled experimental games such as the ultimatum game reveal how rules and incentives affect social behavior.","levels":{"L0":"Does not distinguish social preferences from selfish preferences, social norms, or personality labels. Cannot explain why controlled experimental games are used to study behavior in social interactions.","L1":"Can recall examples such as altruism, fairness, reciprocity, or the ultimatum game, but cannot explain how these motives affect choices or how experiments control rules and incentives.","L2":"Can give a basic explanation that people may care about fairness or others' outcomes, not only their own payoff, and that experiments observe choices. Still confuses group norms with individual preferences or treats experimental behavior as fixed personality rather than behavior under particular rules.","L3":"Can distinguish social norms as group-level expectations from individual social preferences as personal motives that may be influenced by norms. Can explain that controlled behavioural experiments observe choices under common rules, incentives, and treatments, and can describe the ultimatum game as a tool for studying social preferences.","L4":"Can apply the framework to interpret new experimental-game results, explaining how altruism, fairness or inequality aversion, and reciprocity may influence behavior, sometimes in opposite directions. Can explain why changing rules or incentives, such as adding competition, may change responder and proposer behavior.","L5":"Can critically analyze experimental evidence about social preferences, generate plausible interpretations and counterexamples, and teach why observed choices depend jointly on preferences, social norms, rules, incentives, and treatments rather than on a single fixed motive."},"diagnostic_signals":["Names relevant social preferences such as altruism, fairness, inequality aversion, and reciprocity.","Explains that social preferences influence individual choices in social interactions alongside self-interest.","Distinguishes social norms as group-level expectations from individual preferences as what people want to do, while noting norms may influence preferences.","Describes controlled behavioural experiments as observing behavior under common rules, incentives, and treatments.","Identifies the ultimatum game as a one-shot game used to study social preferences.","Explains that adding competition can change incentives, including making responders less likely to reject low offers.","Avoids interpreting experimental choices as direct evidence of fixed personality traits without considering rules and incentives.","Recognizes that different social preferences can work in opposite directions."],"simulator_behavior":"When answering about this node, responses should vary from listing motives or games to interpreting experimental behavior through social preferences, norms, controlled rules, incentives, and treatment changes such as competition."}],"edges":[{"id":"edge_production_function_prerequisite_for_average_product_marginal_product_and_diminishing_marginal_product","source":"production_function","target":"average_product_marginal_product_and_diminishing_marginal_product","type":"prerequisite_for","rationale":"Average product, marginal product, and diminishing marginal product are measures derived from how output changes with input levels along a production function.","weight":0.95,"curation_confidence":0.95},{"id":"edge_average_product_marginal_product_and_diminishing_marginal_product_prerequisite_for_malthusian_trap_and_subsistence_equilibrium","source":"average_product_marginal_product_and_diminishing_marginal_product","target":"malthusian_trap_and_subsistence_equilibrium","type":"prerequisite_for","rationale":"The Malthusian trap mechanism depends on population growth lowering average product and income per person, so understanding product measures is needed to explain the feedback cycle stably.","weight":0.85,"curation_confidence":0.86},{"id":"edge_technological_progress_and_the_permanent_technological_revolution_supports_malthusian_trap_and_subsistence_equilibrium","source":"technological_progress_and_the_permanent_technological_revolution","target":"malthusian_trap_and_subsistence_equilibrium","type":"supports","rationale":"Technological progress helps explain the Malthusian model's case where productivity improvements initially raise income per person before population growth returns living standards to subsistence.","weight":0.72,"curation_confidence":0.8},{"id":"edge_technological_progress_and_the_permanent_technological_revolution_prerequisite_for_escape_from_malthusian_stagnation","source":"technological_progress_and_the_permanent_technological_revolution","target":"escape_from_malthusian_stagnation","type":"prerequisite_for","rationale":"Escape from Malthusian stagnation is defined by sustained technological improvement offsetting diminishing average product, so technological progress is central to stable understanding of the escape mechanism.","weight":0.95,"curation_confidence":0.94},{"id":"edge_escape_from_malthusian_stagnation_contrasts_with_malthusian_trap_and_subsistence_equilibrium","source":"escape_from_malthusian_stagnation","target":"malthusian_trap_and_subsistence_equilibrium","type":"contrasts_with","rationale":"The Malthusian trap returns living standards to subsistence after population growth, whereas escape is the contrasting regime in which population and real wages rise together.","weight":0.92,"curation_confidence":0.93},{"id":"edge_general_purpose_technologies_and_the_industrial_revolution_supports_escape_from_malthusian_stagnation","source":"general_purpose_technologies_and_the_industrial_revolution","target":"escape_from_malthusian_stagnation","type":"supports","rationale":"General-purpose technologies and the Industrial Revolution provide a broad technological and organizational transformation that helps explain how sustained production improvements can support escape from stagnation.","weight":0.72,"curation_confidence":0.76},{"id":"edge_feasible_set_feasible_frontier_and_budget_constraint_prerequisite_for_marginal_rate_of_transformation_and_opportunity_cost","source":"feasible_set_feasible_frontier_and_budget_constraint","target":"marginal_rate_of_transformation_and_opportunity_cost","type":"prerequisite_for","rationale":"The marginal rate of transformation is the trade-off along a feasible frontier or budget constraint, so the constraint representation is needed to interpret the MRT as an opportunity cost.","weight":0.9,"curation_confidence":0.92},{"id":"edge_feasible_set_feasible_frontier_and_budget_constraint_contrasts_with_preferences_indifference_curves_and_marginal_rate_of_substitution","source":"feasible_set_feasible_frontier_and_budget_constraint","target":"preferences_indifference_curves_and_marginal_rate_of_substitution","type":"contrasts_with","rationale":"Feasible sets and budget constraints describe available combinations under constraints, while preferences and indifference curves describe rankings and willingness to trade among combinations.","weight":0.82,"curation_confidence":0.88},{"id":"edge_feasible_set_feasible_frontier_and_budget_constraint_prerequisite_for_interior_optimum_where_mrs_equals_mrt","source":"feasible_set_feasible_frontier_and_budget_constraint","target":"interior_optimum_where_mrs_equals_mrt","type":"prerequisite_for","rationale":"An interior constrained optimum is identified on a feasible frontier or budget constraint, so understanding feasible choices and frontiers is required before applying the tangency condition.","weight":0.93,"curation_confidence":0.94},{"id":"edge_preferences_indifference_curves_and_marginal_rate_of_substitution_prerequisite_for_interior_optimum_where_mrs_equals_mrt","source":"preferences_indifference_curves_and_marginal_rate_of_substitution","target":"interior_optimum_where_mrs_equals_mrt","type":"prerequisite_for","rationale":"The interior optimum condition equates MRS with MRT, so understanding preferences, indifference curves, and willingness to trade is required to interpret the preference side of the tangency.","weight":0.96,"curation_confidence":0.96},{"id":"edge_marginal_rate_of_transformation_and_opportunity_cost_prerequisite_for_interior_optimum_where_mrs_equals_mrt","source":"marginal_rate_of_transformation_and_opportunity_cost","target":"interior_optimum_where_mrs_equals_mrt","type":"prerequisite_for","rationale":"The interior optimum condition equates MRS with MRT, so understanding the feasible opportunity-cost trade-off is required to interpret the constraint side of the tangency.","weight":0.96,"curation_confidence":0.96},{"id":"edge_economic_models_and_ceteris_paribus_reasoning_prerequisite_for_income_and_substitution_effects","source":"economic_models_and_ceteris_paribus_reasoning","target":"income_and_substitution_effects","type":"prerequisite_for","rationale":"Income and substitution effects decompose a choice change by holding selected influences constant, which depends on ceteris paribus reasoning about prices, opportunity costs, and utility levels.","weight":0.82,"curation_confidence":0.85},{"id":"edge_feasible_set_feasible_frontier_and_budget_constraint_prerequisite_for_income_and_substitution_effects","source":"feasible_set_feasible_frontier_and_budget_constraint","target":"income_and_substitution_effects","type":"prerequisite_for","rationale":"Income and substitution effects are explained through shifts or changes in budget constraints and attainable combinations, so understanding feasible frontiers is needed to interpret the decomposition.","weight":0.86,"curation_confidence":0.88},{"id":"edge_preferences_indifference_curves_and_marginal_rate_of_substitution_prerequisite_for_income_and_substitution_effects","source":"preferences_indifference_curves_and_marginal_rate_of_substitution","target":"income_and_substitution_effects","type":"prerequisite_for","rationale":"The substitution effect is defined while holding the new utility level fixed, and the decomposition of choice changes requires preference and indifference-curve reasoning.","weight":0.84,"curation_confidence":0.86},{"id":"edge_marginal_rate_of_transformation_and_opportunity_cost_prerequisite_for_income_and_substitution_effects","source":"marginal_rate_of_transformation_and_opportunity_cost","target":"income_and_substitution_effects","type":"prerequisite_for","rationale":"The substitution effect isolates changes caused by altered price or opportunity cost, such as a wage changing the cost of free time, which requires understanding MRT and opportunity cost.","weight":0.85,"curation_confidence":0.88},{"id":"edge_strategic_interaction_and_game_models_prerequisite_for_social_dilemmas_dominant_strategies_and_prisoners_dilemmas","source":"strategic_interaction_and_game_models","target":"social_dilemmas_dominant_strategies_and_prisoners_dilemmas","type":"prerequisite_for","rationale":"Prisoners' dilemmas and dominant-strategy reasoning are game-model concepts that require identifying players, strategies, information, and payoffs in a strategic interaction.","weight":0.94,"curation_confidence":0.95},{"id":"edge_strategic_interaction_and_game_models_prerequisite_for_nash_equilibrium","source":"strategic_interaction_and_game_models","target":"nash_equilibrium","type":"prerequisite_for","rationale":"Nash equilibrium is a strategy profile in a game, so understanding strategic interaction and the components of a game model is required before applying mutual best-response reasoning.","weight":0.95,"curation_confidence":0.96},{"id":"edge_strategic_interaction_and_game_models_prerequisite_for_social_preferences_and_experimental_games","source":"strategic_interaction_and_game_models","target":"social_preferences_and_experimental_games","type":"prerequisite_for","rationale":"Experimental games such as the ultimatum game study behavior by specifying players, rules, strategies, information, and payoffs, which builds on the structure of game models.","weight":0.78,"curation_confidence":0.82},{"id":"edge_public_goods_free_riding_and_cooperation_supports_social_dilemmas_dominant_strategies_and_prisoners_dilemmas","source":"public_goods_free_riding_and_cooperation","target":"social_dilemmas_dominant_strategies_and_prisoners_dilemmas","type":"supports","rationale":"Public-goods free riding illustrates how individually attractive noncontribution can undermine a feasible cooperative outcome, strengthening the explanation of social dilemmas.","weight":0.78,"curation_confidence":0.84},{"id":"edge_social_preferences_and_experimental_games_supports_public_goods_free_riding_and_cooperation","source":"social_preferences_and_experimental_games","target":"public_goods_free_riding_and_cooperation","type":"supports","rationale":"Social preferences such as altruism, fairness, and reciprocity help explain why people may cooperate or contribute in social interactions despite free-riding incentives.","weight":0.74,"curation_confidence":0.8}]},{"schema_version":"knowact.kg_review_package.v1","review_input_kind":"candidate_graph","graph":{"domain":"ISLP","candidate_run_id":"20260730T085835823437Z","review_package_id":"ISLP:20260730T085835823437Z","graph_fingerprint":"sha256:47afce365d793586e5dd71efa0503f60e14c90f343f4069083f49fdfe9a55e44","node_count":21,"edge_count":29,"representative_task_count":50,"artifact_binding":{"domain":"ISLP","candidate_run_id":"20260730T085835823437Z","candidate_nodes":{"repository_path":"benchmark/domains/ISLP/candidate_graphs/20260730T085835823437Z/candidate_nodes.json","sha256":"108710afc4b888161005a5d0b3b3a1b8aa559b95f0d8383e8883b05f21f3de09"},"candidate_edges":{"repository_path":"benchmark/domains/ISLP/candidate_graphs/20260730T085835823437Z/candidate_edges.json","sha256":"8db65526091bc2c3de62bb177b5aa41aaa8fbc7bba8be748450bf4ca3071f916"},"source_metadata":{"repository_path":"storage/source_materials/ISLP/metadata.json","sha256":"26ee6ee509bed61cca93880e95328092412d3740f57f9ab6c0ff2898bd81a9e3"},"source_content_sha256":"f41927934e0f921654013caeffe29430bf5aae2d6cf4a2216bd54e94d4daf374"}},"source":{"source_id":"ISLP","title":"An Introduction to Statistical Learning: Statistical Learning Foundations","citation":"James, Witten, Hastie, Tibshirani, and Taylor, An Introduction to Statistical Learning with Applications in Python, Chapters 2-3.","storage_uri":"storage/source_materials/ISLP/experiment_scope.md","content_sha256":"f41927934e0f921654013caeffe29430bf5aae2d6cf4a2216bd54e94d4daf374"},"scope":{"aspect_name":"Statistical learning and linear regression foundations","aspect_description":"Diagnosable concepts from ISLP Chapter 2 sections 2.1-2.2 and Chapter 3 sections 3.1-3.5: statistical-learning objectives, model assessment, flexibility and generalization, and simple and multiple linear-regression formulation, inference, and diagnosis.","review_scope_summary":"这张图谱聚焦《An Introduction to Statistical Learning》第 2 章相关小节与第 3 章的统计学习和线性回归基础，覆盖预测与推断目标、模型灵活性与泛化、训练误差和测试误差、偏差—方差权衡，以及简单和多元线性回归的建模、系数解释、统计推断与诊断。评审重点是这些知识是否足以支持对学习者概念理解、方法选择和回归结果解释能力的区分。","representative_tasks":["Identify predictors, response, the unknown function, and the error term in a new statistical-learning scenario.","Explain the difference between predicting an outcome and inferring how predictors relate to the outcome.","Separate reducible error from irreducible error and explain which component modeling can address.","Decide whether a stated scientific goal calls primarily for prediction, inference, or both.","Compare parametric and non-parametric approaches in terms of assumptions, flexibility, and data requirements.","Explain how a two-stage parametric method first assumes a functional form and then estimates parameters.","Diagnose underfitting and overfitting from training and test performance.","Explain why lower training error does not guarantee better test performance.","Relate model flexibility to interpretability without claiming that one is always preferable.","Choose an appropriate flexibility level for a small noisy data set and justify the trade-off.","Distinguish supervised learning from unsupervised learning using the availability and role of a response variable.","Distinguish regression from classification by the nature of the response rather than the algorithm name.","Select a loss measure appropriate for a quantitative-response prediction problem.","Compute and interpret mean squared error on training data and on held-out test data.","Explain why test error is the relevant quantity for generalization even when only training data are used to fit the model.","Describe the typical U-shaped relationship between flexibility and expected test error.","Decompose expected test error conceptually into variance, squared bias, and irreducible error.","Predict how increasing flexibility generally affects bias and variance.","Explain why the lowest achievable test error can remain positive even for the true function.","Use the bias-variance trade-off to compare two candidate models with different complexity.","Explain the role of K-nearest neighbors as a flexible method without treating its local averaging rule as linear regression.","Predict how changing K in K-nearest neighbors affects flexibility, bias, and variance.","Explain the population linear-regression model and distinguish its coefficients from their sample estimates.","Interpret the intercept and slope in a simple linear regression within the units and support of the data.","Write the least-squares objective for simple linear regression and explain what it minimizes.","Distinguish a residual from the unobserved error term in the population model.","Use a fitted regression equation to make a prediction and state the limits of extrapolation.","Explain what the residual standard error estimates and what a large value implies.","Interpret R-squared as a proportion of response variability explained by the fitted linear model.","Explain why a high R-squared does not by itself establish causation or good out-of-sample performance.","Distinguish correlation from R-squared in simple linear regression and explain their relationship.","Formulate a multiple linear-regression model with several predictors.","Interpret one multiple-regression coefficient while holding the other included predictors fixed.","Explain why separate simple regressions can disagree with one multiple regression when predictors are correlated.","Use an F-test question to distinguish evidence for at least one association from evidence about a specific predictor.","State the null and alternative hypotheses for testing one regression coefficient.","Interpret a standard error and confidence interval for a regression coefficient.","Explain what a small p-value does and does not establish in a regression analysis.","Distinguish a confidence interval for a mean response from a prediction interval for a new observation.","Explain why a prediction interval is wider than a confidence interval at the same predictor values.","Diagnose non-linearity from a residual plot and state why a linear term may be inadequate.","Diagnose heteroscedasticity from residual behavior and explain which model assumption it challenges.","Identify a potential outlier using residual information without confusing it with high leverage.","Identify a high-leverage observation from unusual predictor values and explain its possible influence.","Explain how an influential observation combines residual size and leverage.","Diagnose collinearity and explain why it inflates uncertainty in individual coefficient estimates.","Distinguish interaction effects from additive effects in a regression model.","Interpret an interaction coefficient by explaining how one predictor changes the effect of another.","Represent a qualitative predictor with indicator variables while identifying the reference category.","Critique a regression conclusion by checking objective, assumptions, diagnostics, uncertainty, and generalization evidence together."],"excluded_topics":["Python lab procedures, package APIs, and environment setup","End-of-chapter coding exercises and dataset-specific implementation details","Classification methods beyond the Chapter 2 regression-versus-classification distinction","Resampling, cross-validation, and bootstrap methods from later chapters","Regularization, subset selection, and dimension reduction","Nonlinear regression methods beyond diagnosing non-linearity","Tree methods, support vector machines, deep learning, survival analysis, and unsupervised learning","Formal matrix derivations and proof-oriented asymptotic theory","Causal claims not supported by the selected chapters","Advanced model-selection criteria not developed in the selected scope"],"target_node_count":20,"max_node_count":24},"nodes":[{"id":"statistical_learning_function_model","name":"Statistical Learning Function Model","type":"concept","definition":"A statistical learning problem represents a response Y as depending on predictors X through a fixed but unknown function f plus a random error term, with f capturing the systematic information X provides about Y.","source_locators":[{"source_id":"ISLP","locator":"Chapter 2, Section 2.1, pages 15-17","note":"Introduces predictors, response, Y = f(X) + error, and estimating f from data."}],"diagnostic_goal":"Diagnose whether the learner understands the basic statistical learning setup in which a response is modeled as a systematic function of predictors plus random error, and what role the unknown function f plays.","levels":{"L0":"Does not recognize the statistical learning model as relating predictors to a response; may treat Y, X, f, and error as unrelated terms or confuse the model with a deterministic formula with no uncertainty.","L1":"Can recall that Y is modeled using X and an unknown f, sometimes writing Y = f(X) plus error, but mainly repeats notation without explaining the roles of systematic information and random error.","L2":"Can explain that f captures the part of the response that is systematically related to the predictors and that an error term accounts for unexplained randomness, but may have unclear boundaries between f, the fitted estimate of f, and the random error.","L3":"Can distinguish predictors X, response Y, the fixed but unknown function f, and the random error term; can explain why data are used to estimate f and why the model does not imply perfect prediction.","L4":"Can apply the model to a new setting by identifying plausible predictors and response, describing what f would represent, and explaining what remains in the error term without treating all residual variation as learnable from X.","L5":"Can reflect on the modeling assumption by explaining how f abstracts the systematic information in X, how estimation differs from the true unknown function, and how examples or counterexamples would change what belongs in X, f, or the error term."},"diagnostic_signals":["Correctly identifies X as predictors and Y as the response in an example.","Explains f as systematic information about Y provided by X rather than as random noise or the observed data themselves.","Mentions that f is fixed but unknown and must be estimated from data.","Recognizes that the error term represents variation not captured by X through f.","Incorrectly claims the model guarantees exact prediction of Y from X.","Confuses the true function f with a particular fitted model without noting estimation."],"simulator_behavior":"Answers should reveal whether the respondent can parse and use the X, Y, f, and error components of the statistical learning model, including the distinction between systematic dependence and random unexplained variation."},{"id":"prediction_versus_inference_objectives","name":"Prediction Versus Inference Objectives","type":"concept","definition":"Prediction uses an estimated function to estimate a response accurately for available inputs, often treating the fitted function as a black box, while inference seeks to understand which predictors are associated with the response and the form of those relationships.","source_locators":[{"source_id":"ISLP","locator":"Chapter 2, Section 2.1.1, pages 17-20","note":"Contrasts prediction and inference as reasons to estimate f."}],"diagnostic_goal":"Diagnose whether the learner can distinguish prediction and inference as different objectives for estimating f in statistical learning.","levels":{"L0":"Does not distinguish prediction from inference; may use the terms interchangeably or describe both only as making a model.","L1":"Can recall that prediction and inference are two reasons to estimate f, but gives memorized labels with little explanation of how their goals differ.","L2":"Can state that prediction aims to estimate the response accurately while inference aims to understand relationships between predictors and the response, but may blur the distinction in examples or overemphasize only one aspect.","L3":"Can compare the objectives structurally: prediction may treat the fitted function as a black box for accurate Y estimates, while inference asks which predictors are associated with Y and what form the relationships take.","L4":"Can decide in new scenarios whether prediction, inference, or both are primary, and can explain how that objective would affect what one values in estimating f.","L5":"Can critique ambiguous cases and design examples where a method useful for prediction is not ideal for inference or where understanding predictor-response relationships matters more than response accuracy."},"diagnostic_signals":["States that prediction focuses on accurate response estimates for available inputs.","States that inference focuses on understanding which predictors are associated with the response.","Mentions the form or nature of predictor-response relationships as part of inference.","Recognizes that prediction can use f as a black box, while inference requires interpretability about relationships.","Incorrectly defines inference as predicting future observations only.","Incorrectly assumes the same modeling choice is always best for both prediction and inference."],"simulator_behavior":"Answers should display whether the respondent prioritizes accuracy of estimated responses, understanding of predictor-response associations, or both, and whether they can keep those objectives distinct."},{"id":"reducible_and_irreducible_prediction_error","name":"Reducible and Irreducible Prediction Error","type":"concept","definition":"Prediction error has a reducible component from imperfect estimation of f, which modeling can potentially improve, and an irreducible component from the random error term that cannot be predicted using X.","source_locators":[{"source_id":"ISLP","locator":"Chapter 2, Section 2.1.1, pages 17-18","note":"Explains error components in prediction accuracy."}],"diagnostic_goal":"Diagnose whether the learner understands the decomposition of prediction error into a reducible part from imperfect estimation of f and an irreducible part from random error not predictable from X.","levels":{"L0":"Does not recognize that prediction error has different sources; may believe all prediction error is due to a bad model or that perfect prediction is always possible with enough effort.","L1":"Can recall the terms reducible error and irreducible error but cannot reliably explain what causes each component.","L2":"Can explain that reducible error can be improved by better estimating f and irreducible error comes from random error, but may not clearly connect irreducible error to information not available in X.","L3":"Can distinguish the two components in context: errors from estimating f imperfectly are potentially reducible, while variability from the error term remains even if f were known exactly.","L4":"Can apply the distinction to evaluate model improvements, explaining why a better fitted function can reduce some prediction error but cannot remove the irreducible component.","L5":"Can reason reflectively about limits of prediction, using examples or counterexamples to show how adding or changing predictors might alter what is systematic while random error still imposes a lower bound."},"diagnostic_signals":["Identifies imperfect estimation of f as a source of reducible prediction error.","Identifies the random error term as the source of irreducible prediction error.","Explains that irreducible error cannot be predicted using the available X.","Avoids claiming that a sufficiently flexible method can eliminate all prediction error.","Can reason that even the true f would not make predictions perfectly accurate when random error is present.","Confuses irreducible error with training error or with errors caused only by poor parameter estimation."],"simulator_behavior":"Answers should reveal whether the respondent can separate model-improvable prediction error from unavoidable variation due to the error term and reason about the limits this imposes on prediction accuracy."},{"id":"parametric_versus_non_parametric_methods","name":"Parametric Versus Non-Parametric Methods","type":"concept","definition":"Parametric methods estimate f by first assuming a functional form and then estimating a finite set of parameters, while non-parametric methods avoid explicit functional-form assumptions and seek a data-driven fit that typically requires many observations.","source_locators":[{"source_id":"ISLP","locator":"Chapter 2, Section 2.1.2, pages 20-21","note":"Describes the two-step model-based approach for parametric methods."},{"source_id":"ISLP","locator":"Chapter 2, Section 2.1.2, pages 22-23","note":"Contrasts non-parametric methods with parametric assumptions and notes data requirements."}],"diagnostic_goal":"Diagnose whether the learner can compare parametric and non-parametric approaches to estimating f in terms of functional-form assumptions, parameter estimation, flexibility, and data requirements.","levels":{"L0":"Does not distinguish parametric from non-parametric methods; may define them by unrelated properties or assume both work the same way.","L1":"Can recall that parametric methods assume a form and non-parametric methods do not, but gives only labels and may not mention parameters or data requirements.","L2":"Can explain that parametric methods choose a functional form and estimate parameters, while non-parametric methods fit f more directly from data without explicit functional-form assumptions, but may oversimplify the trade-offs.","L3":"Can compare the two approaches: parametric methods reduce the estimation problem to finitely many parameters under an assumed form, whereas non-parametric methods are more flexible but typically require many observations.","L4":"Can decide which approach is more appropriate in a new situation based on assumptions about f, available sample size, and the need for flexibility versus a simpler model-based structure.","L5":"Can critique the consequences of functional-form assumptions and data-driven flexibility, constructing examples where a parametric assumption helps or misleads and where a non-parametric approach needs more data to work well."},"diagnostic_signals":["Describes the two-step parametric approach: assume a functional form, then estimate parameters.","States that non-parametric methods avoid explicit assumptions about the functional form of f.","Mentions that non-parametric methods typically need many observations.","Recognizes that parametric assumptions can simplify estimation but may be wrong.","Avoids equating non-parametric with having no parameters in any practical sense unless tied to the provided concept of no explicit functional-form assumption.","Incorrectly classifies methods solely by whether the response is quantitative or qualitative."],"simulator_behavior":"Answers should show whether the respondent understands the assumption-and-parameter structure of parametric methods and the flexible, data-demanding nature of non-parametric methods."},{"id":"model_flexibility_interpretability_and_overfitting","name":"Model Flexibility, Interpretability, and Overfitting","type":"concept","definition":"Model flexibility is the range of shapes a method can produce for f; higher flexibility can improve fit but often reduces interpretability and can overfit by following noise rather than the underlying relationship.","source_locators":[{"source_id":"ISLP","locator":"Chapter 2, Sections 2.1.2-2.1.3, pages 21-25","note":"Links flexibility, interpretability, and overfitting."}],"diagnostic_goal":"Diagnose whether the learner understands model flexibility as the range of shapes a method can fit for f and can reason about its trade-offs with interpretability and overfitting.","levels":{"L0":"Does not understand model flexibility or treats more flexibility as automatically better with no trade-offs.","L1":"Can recall that more flexible methods can be less interpretable or may overfit, but cannot explain why.","L2":"Can explain that flexibility means a method can fit more possible shapes for f and that high flexibility may fit data closely, but may give incomplete explanations of interpretability loss or overfitting.","L3":"Can relate flexibility, interpretability, and overfitting: as flexibility increases, the fitted relationship may become harder to understand and may follow noise rather than the underlying relationship.","L4":"Can apply the trade-off in new modeling situations, deciding when flexibility is useful for capturing complex relationships and when simpler, more interpretable approaches may be preferable.","L5":"Can critique flexible modeling choices by generating examples where additional flexibility improves fit, examples where it overfits noise, and explanations of how the prediction versus inference objective changes the desired balance."},"diagnostic_signals":["Defines flexibility as the range or complexity of shapes a method can produce for f.","Explains that increasing flexibility often decreases interpretability.","Identifies overfitting as following noise rather than the underlying relationship.","Recognizes that better fit to observed data is not always better generalization.","Connects interpretability concerns especially to understanding f for inference.","Incorrectly claims low interpretability and overfitting are the same thing."],"simulator_behavior":"Answers should reveal whether the respondent can reason about flexibility as a modeling capacity and articulate its consequences for fit, interpretability, and the risk of fitting noise."},{"id":"supervised_versus_unsupervised_learning","name":"Supervised Versus Unsupervised Learning","type":"concept","definition":"Supervised learning uses observations that include both predictor measurements and an associated response, whereas unsupervised learning observes predictor measurements without a response and seeks relationships among variables or observations.","source_locators":[{"source_id":"ISLP","locator":"Chapter 2, Section 2.1.4, pages 25-26","note":"Distinguishes learning settings by the presence or absence of a response."}],"diagnostic_goal":"Diagnose whether the learner can distinguish supervised and unsupervised learning by the presence or absence of an associated response measurement for each observation.","levels":{"L0":"Does not distinguish supervised from unsupervised learning; may confuse the terms with whether a human is present or whether the algorithm is given instructions.","L1":"Can recall that supervised learning has a response and unsupervised learning does not, but gives only a memorized distinction with little ability to apply it.","L2":"Can explain that supervised learning uses observations with predictors and an associated response, while unsupervised learning uses predictor measurements without a response, but may struggle with borderline examples.","L3":"Can classify examples based on whether each observation includes a response measurement and can explain that unsupervised learning seeks relationships among variables or observations rather than predicting a provided response.","L4":"Can apply the distinction to new datasets or study goals, identifying what would need to be measured for a problem to be supervised and what kinds of relationships might be explored without a response.","L5":"Can critique ambiguous descriptions and construct examples showing how the same predictor data could be used in a supervised setting if responses are available or an unsupervised setting if they are not."},"diagnostic_signals":["Identifies the presence of an associated response measurement as the key feature of supervised learning.","Identifies absence of a response measurement as the key feature of unsupervised learning.","Explains that unsupervised analysis seeks relationships among variables or observations.","Classifies a dataset by whether observations include both predictors and responses.","Incorrectly bases the distinction on whether labels are numeric or categorical rather than whether a response exists.","Incorrectly describes unsupervised learning as supervised learning with hidden answers."],"simulator_behavior":"Answers should show whether the respondent uses the availability of response measurements, rather than algorithm names or human involvement, to distinguish supervised from unsupervised learning."},{"id":"regression_versus_classification_problems","name":"Regression Versus Classification Problems","type":"concept","definition":"Regression problems have a quantitative response, while classification problems have a qualitative response taking values in classes or categories; the response type is the basis for the distinction.","source_locators":[{"source_id":"ISLP","locator":"Chapter 2, Section 2.1.5, page 27","note":"Defines regression and classification by response type."}],"diagnostic_goal":"Diagnose whether the learner can distinguish regression and classification problems by the type of response variable rather than by algorithm name or predictor type.","levels":{"L0":"Does not distinguish regression from classification or bases the distinction on unrelated features such as model complexity or number of predictors.","L1":"Can recall that regression involves quantitative responses and classification involves qualitative responses, but may not apply the distinction consistently.","L2":"Can explain that regression predicts a numerical response while classification predicts a class or category, but may be uncertain when algorithm names or predictors seem to suggest otherwise.","L3":"Can classify problems by response type and explicitly state that the response, not the algorithm name or predictor type, determines whether the problem is regression or classification.","L4":"Can apply the distinction to new examples, including cases with mixed predictor types, and justify the classification by identifying the nature of the response.","L5":"Can construct and analyze borderline examples, such as categorical outcomes encoded with numbers or quantitative outcomes grouped into classes, while preserving the response-type basis of the distinction."},"diagnostic_signals":["Identifies quantitative response as the basis for regression.","Identifies qualitative class or category response as the basis for classification.","States that predictor type does not determine whether a problem is regression or classification.","Recognizes that numeric codes for categories do not by themselves make a problem regression.","Correctly classifies example tasks by examining the response variable.","Incorrectly classifies a problem by the name of a method rather than the response type."],"simulator_behavior":"Answers should reveal whether the respondent consistently bases regression-versus-classification judgments on whether the response is quantitative or qualitative."},{"id":"training_mse_and_test_mse","name":"Training MSE and Test MSE","type":"concept","definition":"Mean squared error measures how close predicted quantitative responses are to observed responses; training MSE is computed on data used to fit the model, while test MSE measures prediction accuracy on previously unseen observations and is the relevant target for generalization.","source_locators":[{"source_id":"ISLP","locator":"Chapter 2, Section 2.2.1, pages 28-31","note":"Defines MSE and contrasts training and test error."}],"diagnostic_goal":"Diagnose whether the learner understands mean squared error for quantitative prediction and the distinction between training MSE and test MSE as measures of fit versus generalization.","levels":{"L0":"Does not recognize MSE as a prediction error measure or cannot distinguish errors computed on training data from errors on unseen data.","L1":"Can recall that MSE measures prediction error and that test MSE is important, but cannot explain the calculation or why training and test MSE differ.","L2":"Can explain that MSE averages squared differences between predicted and observed quantitative responses and that training MSE is computed on fitted data while test MSE is computed on new observations, but may still assume low training MSE guarantees good prediction.","L3":"Can interpret training and test MSE separately, explaining that low training MSE shows fit to the data used to train the model while low test MSE is the relevant target for generalization to unseen observations.","L4":"Can apply the distinction when comparing models, selecting or favoring a method based on test MSE rather than training MSE and explaining why overfitting can make training MSE misleading.","L5":"Can reason reflectively about model evaluation by constructing examples where training MSE decreases while test MSE does not, and by explaining why generalization performance is judged using previously unseen observations."},"diagnostic_signals":["Describes MSE as squared prediction errors averaged over observations for quantitative responses.","Distinguishes data used to fit the model from previously unseen observations.","States that test MSE, not training MSE alone, is the relevant target for generalization.","Recognizes that low training MSE need not imply low test MSE.","Connects misleadingly low training MSE to overfitting when appropriate.","Incorrectly claims the best method is always the one with the lowest training MSE."],"simulator_behavior":"Answers should reveal whether the respondent can compute or interpret MSE conceptually and prioritize test MSE over training MSE when discussing prediction accuracy on new observations."},{"id":"bias_variance_trade_off","name":"Bias-Variance Trade-Off","type":"concept","definition":"Expected test MSE can be decomposed into variance, squared bias, and irreducible error; increasing flexibility generally lowers bias but raises variance, so good test performance requires balancing both.","source_locators":[{"source_id":"ISLP","locator":"Chapter 2, Section 2.2.2, pages 31-34","note":"Explains variance, bias, irreducible error, and their relationship to flexibility."}],"diagnostic_goal":"Diagnose whether the learner understands expected test error as involving variance, squared bias, and irreducible error, and can reason about how model flexibility affects bias and variance when seeking good test performance.","levels":{"L0":"Cannot identify the bias-variance trade-off or treats test error as depending on only one vague factor such as model accuracy, without recognizing bias, variance, or irreducible error.","L1":"Can recall the terms bias, variance, and irreducible error, or state that there is a trade-off, but gives memorized or one-sided explanations and may not connect them to test MSE.","L2":"Can explain that test error includes bias and variance components and that more flexible models often reduce bias but increase variance, but handles only simple cases and may ignore irreducible error or confuse training error with test error.","L3":"Can distinguish variance, squared bias, and irreducible error; relate flexibility to underfitting and overfitting; and explain why good test performance requires low variance as well as low squared bias, while recognizing common mistakes such as choosing the most flexible model automatically.","L4":"Can apply the trade-off to new model-comparison situations by predicting how changing flexibility is likely to affect test MSE components and by selecting or justifying a balance rather than optimizing training fit alone.","L5":"Can critique and teach the decomposition, generate examples and counterexamples involving different flexibility levels, and reflect on the limits of reducing test error because irreducible error remains even when bias and variance are managed."},"diagnostic_signals":["Mentions all three components: variance, squared bias, and irreducible error.","Explains that increasing flexibility generally lowers bias and raises variance rather than improving all aspects of performance.","Distinguishes training error from expected test MSE when discussing model choice.","Recognizes that irreducible error cannot be eliminated by choosing a different statistical learning method.","Identifies overfitting as high variance from excessive flexibility and underfitting as high bias from insufficient flexibility.","Avoids claiming that the best model is always the most complex or always the simplest."],"simulator_behavior":"Answers should reveal how the simulated learner decomposes test error, reasons about flexibility, and balances bias against variance; lower-knowledge responses may rely on isolated terms or confuse test performance with training fit."},{"id":"k_nearest_neighbors_flexibility","name":"K-Nearest Neighbors Flexibility","type":"concept","definition":"K-nearest neighbors predicts from nearby training observations, using local voting for classification or local averaging for regression; the choice of K controls flexibility, bias, and variance, with smaller K producing more flexible fits.","source_locators":[{"source_id":"ISLP","locator":"Chapter 2, Section 2.2.3, pages 36-39","note":"Describes KNN classification and the effect of K on flexibility, bias, and variance."},{"source_id":"ISLP","locator":"Experiment Scope: Statistical Learning Foundations (part 2), Section 3.5, pp.111-115","note":"Describes KNN regression by averaging responses of the closest training observations."}],"diagnostic_goal":"Diagnose whether the learner understands how K-nearest neighbors makes local predictions and how the choice of K controls flexibility, smoothness, bias, and variance in classification and regression settings.","levels":{"L0":"Cannot describe K-nearest neighbors as using nearby training observations, or confuses K with an unrelated model parameter without linking it to prediction behavior.","L1":"Can recall that KNN uses the K nearest observations and may mention voting or averaging, but cannot explain how changing K affects the fitted method.","L2":"Can explain that KNN predicts from local neighbors using voting for classification or averaging for regression, and that small K is more flexible, but may give incomplete or inconsistent bias-variance consequences.","L3":"Can relate K to flexibility, smoothness, bias, and variance: smaller K produces more local and variable fits, while larger K produces smoother, less flexible fits; can distinguish classification voting from regression averaging.","L4":"Can apply KNN flexibility reasoning to new examples by predicting the effect of increasing or decreasing K on decision boundaries or regression fits and on likely bias and variance.","L5":"Can critique K choices, teach the local-neighbor mechanism across regression and classification, and generate examples where very small or very large K creates predictable overfitting or oversmoothing behavior."},"diagnostic_signals":["Describes prediction as based on nearby training observations rather than a fitted global equation.","Correctly distinguishes local voting for classification from local averaging for regression.","States that smaller K gives a more flexible, less smooth fit.","Connects small K with lower bias but higher variance and large K with higher bias but lower variance.","Recognizes that the choice of K can drastically affect the KNN classifier or regression estimate.","Avoids reversing the flexibility relationship by saying larger K is more flexible."],"simulator_behavior":"Answers should show whether the simulated learner can explain KNN's local prediction mechanism and reason about how K changes flexibility, bias, and variance; weaker responses may recite nearest-neighbor language without controlling-direction understanding."},{"id":"simple_linear_regression_and_least_squares_fitting","name":"Simple Linear Regression and Least Squares Fitting","type":"concept","definition":"Simple linear regression predicts a quantitative response from one predictor using an approximately linear relationship with an intercept and slope, estimated from data by choosing coefficients that minimize the residual sum of squares.","source_locators":[{"source_id":"ISLP","locator":"Chapter 3, Sections 3.1-3.1.1, pages 70-72","note":"Defines simple linear regression, residuals, and least squares RSS minimization."}],"diagnostic_goal":"Diagnose whether the learner understands simple linear regression as a one-predictor linear model with an intercept and slope estimated by least squares through residual sum of squares minimization.","levels":{"L0":"Cannot identify simple linear regression as a linear relationship between one predictor and a quantitative response, or confuses it with unrelated regression or classification ideas.","L1":"Can recall terms such as intercept, slope, residual, or least squares, but cannot connect them into the model or fitting procedure.","L2":"Can state that simple linear regression predicts a response from one predictor using a line and that least squares chooses coefficients, but may give weak interpretations of the coefficients or residuals.","L3":"Can formulate the model conceptually with intercept and slope, interpret the slope and intercept in context, define residuals as observed minus fitted values, and explain that least squares minimizes the residual sum of squares.","L4":"Can apply the model to new data descriptions by identifying response and predictor, explaining fitted values and residuals, and reasoning about how least-squares coefficients are chosen to make residuals small overall.","L5":"Can teach and critique least-squares fitting, generate examples showing how slope, intercept, fitted values, and residuals interact, and explain limitations of assuming an approximately linear relationship."},"diagnostic_signals":["Identifies that there is one predictor and one quantitative response.","Interprets the intercept and slope as parts of an approximately linear prediction rule.","Defines residuals as discrepancies between observed responses and fitted values.","States that least squares chooses beta_hat_0 and beta_hat_1 to minimize RSS.","Avoids saying least squares minimizes individual errors one at a time rather than the sum of squared residuals.","Recognizes that the fitted line is estimated from data, not known in advance."],"simulator_behavior":"Answers should expose whether the simulated learner can connect the simple linear model, coefficient interpretation, residuals, and RSS minimization; low-knowledge behavior may list terms without explaining the fitting objective."},{"id":"regression_coefficient_uncertainty_and_hypothesis_tests","name":"Regression Coefficient Uncertainty and Hypothesis Tests","type":"concept","definition":"Regression coefficient uncertainty is quantified with standard errors, confidence intervals, test statistics, and p-values, which are used to assess whether a coefficient or a set of coefficients provides evidence of association with the response.","source_locators":[{"source_id":"ISLP","locator":"Experiment Scope: Statistical Learning Foundations (part 2), Section 3.1, pp.75-76","note":"Introduces standard errors for estimated regression coefficients."},{"source_id":"ISLP","locator":"Experiment Scope: Statistical Learning Foundations (part 2), Sections 3.1.2 and 3.2.2, pp.76-86","note":"Describes t-tests, p-values, and multiple-regression F-tests."}],"diagnostic_goal":"Diagnose whether the learner understands how standard errors, confidence intervals, test statistics, p-values, and F-tests quantify uncertainty and evidence for regression coefficient associations with the response.","levels":{"L0":"Cannot explain uncertainty in regression coefficients or treats estimated coefficients as exact facts without sampling variability or hypothesis testing.","L1":"Can recall terms such as standard error, p-value, confidence interval, t-test, or F-test, but gives little correct interpretation of what they assess.","L2":"Can explain that standard errors measure uncertainty in coefficient estimates and that p-values are used in tests about coefficients, but may confuse p-values with effect size or mix up single-coefficient and overall tests.","L3":"Can interpret standard errors for beta_hat estimates, describe tests of H_0 statements about coefficients, use test statistics and p-values as evidence against null hypotheses, and distinguish individual coefficient t-tests from an overall multiple-regression F-test.","L4":"Can apply coefficient-uncertainty ideas to new regression output by interpreting confidence intervals, deciding whether a coefficient or set of coefficients shows evidence of association, and explaining the role of standard errors in the test.","L5":"Can critique hypothesis-test interpretations, teach the relationship among estimates, standard errors, confidence intervals, test statistics, and p-values, and generate examples contrasting individual coefficient evidence with overall model evidence."},"diagnostic_signals":["States that beta_hat coefficients are estimates that may differ from true beta coefficients.","Explains standard error as quantifying uncertainty or variability in an estimated coefficient.","Frames hypothesis tests in terms of H_0 statements about coefficients, such as no association.","Interprets smaller p-values as stronger evidence against the null rather than as the probability the null is true.","Distinguishes a t-test for a single coefficient from an F-test for a set of coefficients or the overall regression.","Uses confidence intervals as uncertainty ranges for coefficient values rather than as prediction intervals for new responses."],"simulator_behavior":"Answers should reveal how the simulated learner interprets regression output uncertainty and hypothesis-test evidence; weaker behavior may quote p-value or standard-error terminology without linking it to coefficient uncertainty or null hypotheses."},{"id":"residual_standard_error","name":"Residual Standard Error","type":"concept","definition":"Residual standard error is an estimate of the standard deviation of the model error term and measures the typical absolute lack of fit between responses and the regression line or plane.","source_locators":[{"source_id":"ISLP","locator":"Experiment Scope: Statistical Learning Foundations (part 2), Section 3.1.3, pp.77-79","note":"Presents RSE as a model-accuracy quantity in response units."}],"diagnostic_goal":"Diagnose whether the learner understands residual standard error as an estimate of the standard deviation of the model error term and as the typical response-scale lack of fit around a regression line or plane.","levels":{"L0":"Cannot identify residual standard error or confuses it with unrelated quantities such as a coefficient, p-value, or explained proportion.","L1":"Can recall the term residual standard error or say it measures error, but cannot specify what error or how to interpret its scale.","L2":"Can explain that RSE is related to typical residual size or model fit, but may not connect it to the model error term standard deviation or response units.","L3":"Can interpret RSE as the typical amount responses deviate from the regression line or plane, in response units, and as an estimate of the standard deviation of the error term.","L4":"Can apply RSE to compare or describe regression fit in new contexts, explaining what a given RSE means for typical absolute lack of fit while avoiding scale-free interpretations.","L5":"Can teach and critique RSE as a model-accuracy quantity, distinguish it from relative measures such as R-squared, and generate examples showing why response-unit scale matters for interpretation."},"diagnostic_signals":["Describes RSE as typical deviation of responses from the regression fit.","Mentions that RSE estimates the standard deviation of the model error term.","Interprets RSE in the units of the response variable.","Avoids interpreting RSE as a proportion of explained variability.","Distinguishes RSE from residuals themselves and from coefficient standard errors.","Recognizes that smaller RSE means less typical lack of fit on the response scale, all else equal."],"simulator_behavior":"Answers should show whether the simulated learner interprets RSE as response-scale typical lack of fit and error-term variability; lower-knowledge responses may treat it as a generic accuracy score or confuse it with R-squared."},{"id":"r_squared_statistic","name":"R-squared Statistic","type":"concept","definition":"R-squared is a scale-free proportion measuring how much variability in the response is explained by the regression model, with values near 1 indicating more explained variability and values near 0 indicating little explained variability.","source_locators":[{"source_id":"ISLP","locator":"Experiment Scope: Statistical Learning Foundations (part 2), Section 3.1.3, pp.78-80","note":"Defines R-squared using TSS and RSS and relates it to squared correlation in simple regression."}],"diagnostic_goal":"Diagnose whether the learner understands R-squared as a scale-free proportion of response variability explained by a regression model, and can distinguish it from RSE and correlation.","levels":{"L0":"Cannot identify R-squared or confuses it with residual standard error, a coefficient estimate, or a p-value.","L1":"Can recall that R-squared is a number between 0 and 1 or that higher is better, but cannot explain variability explained by the model.","L2":"Can state that R-squared measures how much variation in the response is explained, but may be vague about scale-free interpretation or confuse it with correlation or response-unit error.","L3":"Can interpret R-squared as the proportion of variability in Y explained using the regression predictors, relate high and low values to explained variability, and distinguish it from RSE and from correlation in simple regression.","L4":"Can apply R-squared to new regression summaries by explaining what a given value means, comparing explained variability across models cautiously, and recognizing that it is not measured in response units.","L5":"Can teach and critique R-squared, explain its relationship to TSS and RSS and to squared correlation in simple regression, and generate examples where a high or low R-squared has clear interpretation but does not by itself settle all model-quality questions."},"diagnostic_signals":["Interprets R-squared as the proportion of variability in the response explained by the model.","Recognizes that values near 1 indicate more explained variability and values near 0 indicate little explained variability.","States or implies that R-squared is scale-free rather than in response units.","Distinguishes R-squared from RSE, which measures typical error in response units.","Notes the relationship to squared correlation in simple regression when relevant without treating R-squared as the raw correlation.","Avoids interpreting R-squared as the probability the model is correct or as a hypothesis-test p-value."],"simulator_behavior":"Answers should reveal whether the simulated learner understands R-squared as explained response variability and can separate it from response-scale error and correlation; weaker responses may only say higher is better."},{"id":"multiple_linear_regression_coefficient_interpretation","name":"Multiple Linear Regression Coefficient Interpretation","type":"concept","definition":"In multiple linear regression, each predictor has its own slope coefficient, interpreted as the average association between that predictor and the response while holding the other included predictors fixed.","source_locators":[{"source_id":"ISLP","locator":"Experiment Scope: Statistical Learning Foundations (part 2), Section 3.2, pp.80-83","note":"Motivates one model with multiple predictors and adjusted coefficient interpretation."}],"diagnostic_goal":"Diagnose whether the learner understands multiple linear regression coefficient interpretation as the association between one predictor and the response while holding other included predictors fixed, and how this differs from separate simple regressions.","levels":{"L0":"Cannot identify multiple linear regression as using more than one predictor or interprets coefficients without regard to other variables in the model.","L1":"Can recall that multiple regression has several predictors and coefficients, but cannot explain what an individual slope means when other predictors are included.","L2":"Can state that each predictor has its own coefficient and that other variables are controlled or held fixed, but may not clearly distinguish this from separate simple regressions.","L3":"Can interpret a slope coefficient as the average association between that predictor and the response while holding all other included predictors fixed, and explain why this adjusted interpretation can differ from a simple regression coefficient.","L4":"Can apply the holding-fixed interpretation to new model statements, correctly interpreting coefficients in context and avoiding causal or marginal interpretations not supported by the regression form.","L5":"Can teach and critique adjusted coefficient interpretations, generate examples where simple and multiple regression coefficients differ due to included predictors, and explain the boundaries of the holding-other-predictors-fixed statement."},"diagnostic_signals":["States that multiple linear regression includes multiple predictors in one model.","Interprets each slope while holding all other included predictors fixed.","Contrasts adjusted multiple-regression coefficients with coefficients from separate simple regressions.","Avoids interpreting a coefficient as the total or unconditional effect of changing a predictor without regard to other predictors.","Recognizes that each predictor has its own slope coefficient in the model.","Uses response and predictor context when explaining what a one-unit predictor change means."],"simulator_behavior":"Answers should expose whether the simulated learner uses the holding-other-predictors-fixed interpretation for coefficients; low-knowledge behavior may treat coefficients as simple bivariate associations regardless of the model."},{"id":"confidence_intervals_versus_prediction_intervals","name":"Confidence Intervals Versus Prediction Intervals","type":"concept","definition":"A confidence interval quantifies uncertainty about an average response or population regression function value, whereas a prediction interval quantifies uncertainty for a particular new response and is wider because it also includes individual-error variation.","source_locators":[{"source_id":"ISLP","locator":"Experiment Scope: Statistical Learning Foundations (part 2), Section 3.2.2, pp.89-90","note":"Distinguishes uncertainty for f(X) from uncertainty for an individual Y."}],"diagnostic_goal":"Diagnose whether the learner can distinguish confidence intervals for average response or population regression function values from prediction intervals for particular new responses, including why prediction intervals are wider.","levels":{"L0":"Cannot distinguish confidence intervals from prediction intervals or treats all regression intervals as the same kind of uncertainty statement.","L1":"Can recall the terms confidence interval and prediction interval, or that one is wider, but cannot correctly say what each interval is for.","L2":"Can state that confidence intervals concern an average response and prediction intervals concern a new observation, but may not explain the additional individual-error variation that makes prediction intervals wider.","L3":"Can distinguish uncertainty about the mean response or population regression function from uncertainty about a particular new response, and explain that prediction intervals are wider because they include both estimation uncertainty and individual-error variation.","L4":"Can apply the distinction to new regression questions by choosing the appropriate interval for estimating an average versus predicting an individual and justifying the relative widths.","L5":"Can teach and critique the distinction, generate examples where using the wrong interval changes the interpretation, and explain the conceptual sources of uncertainty for each interval without collapsing them into one category."},"diagnostic_signals":["Identifies a confidence interval as addressing an average response or population regression function value.","Identifies a prediction interval as addressing a particular new response.","States that prediction intervals are wider than confidence intervals for the same setting.","Explains that prediction intervals include individual-error variation in addition to uncertainty about the fitted mean.","Avoids using a confidence interval when the question asks about a single future observation.","Avoids saying the two intervals differ only by confidence level or terminology."],"simulator_behavior":"Answers should reveal whether the simulated learner chooses and interprets intervals based on mean-response versus individual-response uncertainty; weaker responses may remember that prediction intervals are wider without explaining why."},{"id":"qualitative_predictors_and_dummy_variables","name":"Qualitative Predictors and Dummy Variables","type":"concept","definition":"Qualitative predictors are incorporated into linear regression by coding their levels with numerical dummy variables, with one level serving as the baseline when there are more than two levels.","source_locators":[{"source_id":"ISLP","locator":"Experiment Scope: Statistical Learning Foundations (part 2), Section 3.3.1, pp.91-94","note":"Shows two-level and multi-level qualitative predictor coding and baseline interpretation."}],"diagnostic_goal":"Diagnose whether the learner understands how qualitative predictors are represented in linear regression using dummy variables, including the need for a baseline level and the interpretation consequences of using one fewer dummy variable than the number of levels.","levels":{"L0":"Cannot recognize how categorical predictors enter a linear regression model, or treats category labels as if they can be used directly as ordinary numerical magnitudes without coding.","L1":"Can recall that qualitative predictors use dummy or indicator variables, but cannot reliably explain why one level is omitted as a baseline or how many dummy variables are needed.","L2":"Can explain in simple terms that category levels are coded with numerical indicators and that a two-level variable can be represented by a dummy variable, but may be unclear about multi-level variables or baseline interpretation.","L3":"Can correctly state that a qualitative predictor with k levels is represented by k minus 1 dummy variables, identify the omitted reference category, and interpret coefficients as differences relative to that baseline in a linear regression model.","L4":"Can apply dummy-variable coding to new two-level and multi-level categorical predictors, choose or identify a baseline, write the corresponding model structure, and interpret fitted coefficients without confusing category effects with continuous slopes.","L5":"Can flexibly explain and critique dummy-variable coding choices, teach how baseline selection changes coefficient interpretation but not the represented categorical information, and construct examples or counterexamples showing why using one dummy per level with an intercept is redundant."},"diagnostic_signals":["Correctly states that there is one fewer dummy variable than the number of category levels when an intercept and baseline are used.","Identifies the omitted category as the reference or baseline level for interpreting coefficients.","Interprets dummy-variable coefficients as differences from the baseline rather than as standalone numerical scores for categories.","Distinguishes coding a qualitative predictor from treating category labels as continuous numeric values.","Handles both two-level and multi-level qualitative predictors without adding a dummy for every level in an intercept model.","Shows boundary errors such as saying all category levels require separate dummy variables regardless of baseline or failing to explain what the baseline means."],"simulator_behavior":"When answering about this node, responses should reflect the simulated level of understanding of dummy-variable coding, baseline/reference categories, and coefficient interpretation for qualitative predictors, with lower states confusing categorical coding or omitting baseline logic and higher states applying the k minus 1 rule and interpreting coefficients accurately."},{"id":"interaction_effects_and_the_additive_assumption","name":"Interaction Effects and the Additive Assumption","type":"concept","definition":"An interaction effect occurs when the association between one predictor and the response depends on the value of another predictor, relaxing the additive assumption of the standard linear model.","source_locators":[{"source_id":"ISLP","locator":"Experiment Scope: Statistical Learning Foundations (part 2), Section 3.3.2, pp.94-98","note":"Explains interaction terms as products of predictors and their interpretation."}],"diagnostic_goal":"Diagnose whether the learner understands interaction effects in linear regression as violations of the additive assumption, where the association between one predictor and the response changes depending on another predictor.","levels":{"L0":"Cannot identify an interaction effect and may describe predictors only as separate unrelated inputs or confuse interaction with ordinary correlation among predictors.","L1":"Can recall the term interaction or product term, but cannot explain how it changes the meaning of predictor effects or how it differs from a purely additive model.","L2":"Can give a basic explanation that two predictors may work together in a model, but may still describe their effects as mostly separate or fail to state that one predictor's association with the response depends on the other's value.","L3":"Can distinguish an additive linear model from a model with an interaction term and explain that the effect or slope associated with one predictor is no longer constant across values of the other predictor.","L4":"Can interpret interaction terms in new regression settings, including recognizing when a product term relaxes additivity and explaining how the predicted response changes for different values or levels of the interacting predictor.","L5":"Can critique and teach interaction modeling by constructing examples where an additive model is inadequate, explaining the conditional nature of main effects in the presence of an interaction, and designing counterexamples where apparent joint predictor presence is not a true interaction."},"diagnostic_signals":["States that an interaction means the association between one predictor and the response depends on another predictor.","Contrasts interaction models with additive models in which predictor contributions are simply added and effects remain constant with respect to the other predictor.","Recognizes product terms as a common way to represent interactions in linear regression.","Interprets changing slopes or changing predictor effects as evidence of interaction rather than merely stronger main effects.","Avoids the misconception that interaction just means two predictors are both included in the model.","Can explain how the meaning of a coefficient changes when an interaction term is present."],"simulator_behavior":"When answering about this node, responses should reveal whether the simulated knowledge state treats predictor effects as additive and constant or understands interactions as conditional effects represented by terms such as products of predictors."},{"id":"residual_plot_diagnosis_of_non_linearity","name":"Residual Plot Diagnosis of Non-linearity","type":"concept","definition":"A residual plot is a graphical diagnostic that checks whether residuals show systematic patterns; clear patterns such as a U-shape can indicate that a linear relationship is inadequate.","source_locators":[{"source_id":"ISLP","locator":"Experiment Scope: Statistical Learning Foundations (part 2), Section 3.3.3, pp.100-101","note":"Uses residual plots to detect non-linearity and motivate transformations."}],"diagnostic_goal":"Diagnose whether the learner understands how residual plots are used to detect systematic patterns indicating that a linear relationship may be inadequate, especially non-linearity such as a U-shaped residual pattern.","levels":{"L0":"Cannot connect residual plots to model checking and may treat any residual plot as automatically confirming the fitted model or ignore residuals entirely.","L1":"Can recall that residual plots are diagnostic plots, but cannot explain what pattern or lack of pattern means for assessing a linear model.","L2":"Can say that residuals should not show obvious patterns and that patterns may indicate a problem, but gives only vague interpretations and may not connect a curved or U-shaped pattern to non-linearity.","L3":"Can interpret a residual plot by identifying systematic structure, such as a U-shape, as evidence that a simple linear relationship may not adequately capture the predictor-response relationship.","L4":"Can apply residual-plot reasoning to new cases, distinguishing random scatter from systematic patterns and recommending that the linear specification may need a transformation or nonlinear term when patterns persist.","L5":"Can critically explain the diagnostic role and limits of residual plots, construct examples of residual patterns produced by non-linearity, and teach why residual structure undermines the adequacy of a simple linear term without treating every isolated residual as a model failure."},"diagnostic_signals":["Looks for systematic patterns in residuals rather than focusing only on individual large residuals.","Identifies curved or U-shaped residual patterns as signs that a linear relationship may be inadequate.","Distinguishes random scatter around zero from structured residual behavior.","Connects residual patterns to possible problems with the linear model specification.","Mentions transformations or nonlinear terms as motivated by residual evidence when appropriate.","Shows misconceptions such as saying residual plots are only for finding outliers or that any nonzero residual invalidates the model."],"simulator_behavior":"When answering about this node, responses should reflect the simulated ability to use residual plots as diagnostics for non-linearity, with weaker states giving vague or incorrect plot interpretations and stronger states distinguishing random scatter from systematic patterns that motivate model revision."},{"id":"outliers_and_high_leverage_observations","name":"Outliers and High-Leverage Observations","type":"concept","definition":"An outlier has an unusual response value relative to the model prediction, while a high-leverage observation has unusual predictor values and may strongly affect the fitted regression line or plane.","source_locators":[{"source_id":"ISLP","locator":"Experiment Scope: Statistical Learning Foundations (part 2), Section 3.3.3, pp.103-106","note":"Distinguishes response outliers from unusual predictor configurations and leverage."}],"diagnostic_goal":"Diagnose whether the learner can distinguish outliers from high-leverage observations in regression, using response unusualness relative to the fitted model for outliers and unusual predictor values for leverage, including their potential influence on the fitted line or plane.","levels":{"L0":"Cannot distinguish unusual observations in regression and may use outlier and high leverage interchangeably without reference to response residuals or predictor values.","L1":"Can recall the terms outlier and leverage, but cannot reliably say which concerns unusual response values and which concerns unusual predictor values.","L2":"Can give a basic distinction between unusual responses and unusual predictor values, but may not connect outliers to residuals or high leverage to possible strong influence on the fitted regression.","L3":"Can explain that an outlier has an unusual response relative to the model prediction, while a high-leverage observation has unusual predictor values, and can keep these concepts distinct in simple regression examples.","L4":"Can apply the distinction in new diagnostic scenarios, using residual information to identify response outliers and predictor configurations to identify leverage points, while reasoning about how high leverage may affect the fitted line or plane.","L5":"Can teach and critique regression diagnostics involving unusual observations, construct cases where a point is an outlier but not high leverage or high leverage but not a response outlier, and explain why influence depends on more than response unusualness alone."},"diagnostic_signals":["Defines an outlier in terms of an unusual response value given the predictor values or fitted prediction.","Defines high leverage in terms of unusual predictor values or predictor configurations.","Does not collapse leverage and outlier status into the same concept.","Uses residual information as evidence for outlier detection.","Recognizes that high-leverage observations can strongly affect the fitted regression line or plane.","Can reason through cases where a point has high leverage without a large residual, or a large residual without unusual predictor values."],"simulator_behavior":"When answering about this node, responses should reflect the simulated ability to separate response unusualness from predictor unusualness, with lower states conflating outliers and leverage and higher states using residuals and predictor values to diagnose each."},{"id":"collinearity_and_variance_inflation","name":"Collinearity and Variance Inflation","type":"concept","definition":"Collinearity occurs when predictors are closely related, making it difficult to separate their individual associations with the response and inflating uncertainty in coefficient estimates; VIF is used to assess this problem.","source_locators":[{"source_id":"ISLP","locator":"Experiment Scope: Statistical Learning Foundations (part 2), Section 3.3.3, pp.106-109","note":"Explains effects of collinearity on standard errors, t-statistics, and predictor importance."}],"diagnostic_goal":"Diagnose whether the learner understands collinearity among predictors, why it makes individual regression coefficient effects hard to separate, how it inflates uncertainty in coefficient estimates, and how correlation matrices or VIF can be used to assess it.","levels":{"L0":"Cannot recognize collinearity as a predictor-relationship problem and may confuse it with model fit, response correlation, or unrelated data noise.","L1":"Can recall that collinearity involves related predictors or that VIF is associa
