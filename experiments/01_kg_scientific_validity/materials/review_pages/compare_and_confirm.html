curately track saving and restoring CPU and kernel context for resumption."},{"id":"scheduling_turnaround_time_and_response_time","name":"Scheduling Turnaround Time and Response Time","type":"concept","definition":"Turnaround time measures completion time minus arrival time, while response time measures the time from a job's arrival until its first scheduled execution.","source_locators":[{"source_id":"OSTEP","locator":"Experiment Scope: Operating Systems Foundations (part 2), Chapter 7, Sections 7.2 and 7.6","note":"Defines the core scheduling metrics for batch and interactive workloads."}],"diagnostic_goal":"Diagnose whether the user can distinguish and compute scheduling turnaround time and response time from job arrival, first scheduled execution, and completion times.","levels":{"L0":"Cannot identify turnaround time or response time, or confuses both with unrelated quantities such as total CPU burst length regardless of arrival or first run time.","L1":"Can recall the names of the two metrics or one formula fragment, but often swaps them or cannot apply them to a job timeline.","L2":"Can explain that turnaround concerns completion and response concerns first scheduling, and may compute simple cases, but may still make boundary errors with arrival time or with jobs that wait before first running.","L3":"Can state and use the definitions: turnaround time is completion time minus arrival time, while response time is first scheduled execution time minus arrival time; can explain why response time is important for interactive time-shared systems.","L4":"Can apply both metrics across new schedules with multiple arrivals, waiting periods, and preemption, correctly identifying completion and first-run times and comparing how policies affect batch versus interactive goals.","L5":"Can critique and teach the distinction between completion-oriented and first-response-oriented scheduling metrics, generate schedules that separate the two, and explain why optimizing one metric may not optimize the other."},"diagnostic_signals":["Correctly defines turnaround time as completion time minus arrival time.","Correctly defines response time as time from arrival until first scheduled execution.","Uses first run time, not completion time, when computing response time.","Uses arrival time as the baseline for both metrics.","Can explain that turnaround was introduced as a performance metric and response time matters for interactive time-shared systems.","Common misconception: computes response time as completion time minus arrival time.","Common misconception: ignores arrival time and uses only service or run duration."],"simulator_behavior":"When answering, reflect the user state by varying whether responses swap the metrics, recite formulas without applying them, or accurately compute and interpret turnaround and response times from scheduling timelines."},{"id":"fifo_scheduling_and_convoy_effect","name":"FIFO Scheduling and Convoy Effect","type":"concept","definition":"FIFO scheduling runs jobs in arrival order; if a long job precedes short jobs, the short jobs can wait behind it and experience the convoy effect and poor turnaround time.","source_locators":[{"source_id":"OSTEP","locator":"Experiment Scope: Operating Systems Foundations (part 2), Chapter 7, Section 7.3","note":"Introduces FIFO and its convoy-effect weakness."}],"diagnostic_goal":"Diagnose whether the user understands FIFO scheduling by arrival order and how a long job ahead of short jobs can create the convoy effect and poor turnaround time.","levels":{"L0":"Does not recognize FIFO scheduling or believes it selects jobs by shortest length, priority, or response needs rather than arrival order.","L1":"Can recall that FIFO means first-in-first-out or arrival order, but cannot explain the convoy effect or its impact on waiting and turnaround.","L2":"Can explain that FIFO runs jobs in arrival order and that short jobs may wait behind a long job, but may not clearly connect this to poor turnaround time or the convoy-effect pattern.","L3":"Can describe FIFO as simple non-reordering by arrival order and explain the convoy effect: relatively short jobs queue behind a heavyweight resource consumer, causing unnecessary waiting and poor turnaround when job lengths differ.","L4":"Can apply the concept to scheduling examples by constructing FIFO order, calculating or comparing waiting and turnaround effects, and identifying when a long leading job will produce a convoy effect.","L5":"Can critique FIFO's simplicity versus its weakness under mixed job lengths, teach the convoy effect with examples and counterexamples, and reason about why alternative policies may improve turnaround in such cases."},"diagnostic_signals":["States that FIFO runs jobs in the order they arrive.","Identifies a long or heavyweight job at the front as the cause of short jobs waiting behind it.","Uses the term or concept of convoy effect for short jobs queued behind a long resource consumer.","Connects the convoy effect to poor waiting time or turnaround time for short jobs.","Can trace a simple FIFO schedule without reordering by job length.","Common misconception: says FIFO automatically gives good turnaround because it is fair by arrival order.","Common misconception: describes FIFO as selecting the shortest job first."],"simulator_behavior":"When answering, reflect the user state by varying whether responses only name arrival order, miss the convoy effect, or accurately explain and apply how long leading jobs degrade turnaround for short jobs."},{"id":"shortest_job_scheduling_policies","name":"Shortest-Job Scheduling Policies","type":"concept","definition":"SJF chooses the shortest known job in a non-preemptive setting, while STCF preempts when appropriate by always choosing the job with the least remaining time.","source_locators":[{"source_id":"OSTEP","locator":"Experiment Scope: Operating Systems Foundations (part 2), Chapter 7, Sections 7.4 and 7.5","note":"Covers SJF and its preemptive STCF variant."}],"diagnostic_goal":"Diagnose whether the user understands the relationship between SJF and STCF, including non-preemptive shortest-job choice versus preemptive least-remaining-time choice.","levels":{"L0":"Does not recognize SJF or STCF, or confuses them with FIFO, round-robin, or priority scheduling without reference to job length or remaining time.","L1":"Can recall that shortest-job policies choose short jobs, but cannot distinguish SJF from STCF or explain preemption.","L2":"Can explain that SJF chooses the shortest known job and STCF is related to shortest remaining time, but may be unclear about non-preemptive versus preemptive behavior or how later arrivals affect the decision.","L3":"Can describe SJF as choosing the shortest known job in a non-preemptive setting and STCF as adding preemption by always choosing the job with the least remaining time, especially when new jobs arrive after the current job has started.","L4":"Can apply SJF and STCF to scheduling timelines, deciding whether a running job continues or is preempted when a new job arrives, and comparing resulting turnaround behavior under simultaneous and staggered arrivals.","L5":"Can critique and teach why SJF optimizes turnaround under simultaneous arrivals while STCF extends the idea to later arrivals via remaining-time comparisons, and can generate examples where SJF and STCF make the same or different choices."},"diagnostic_signals":["Identifies SJF as selecting the shortest known job in a non-preemptive setting.","Identifies STCF as the preemptive form of SJF.","States that STCF chooses the job with the least remaining time to completion.","Correctly handles a later-arriving short job by considering whether it should preempt the current job under STCF.","Recognizes the simultaneous-arrival condition under which SJF is presented as optimizing turnaround.","Common misconception: says SJF always preempts when a shorter job arrives.","Common misconception: says STCF compares original job length rather than remaining time."],"simulator_behavior":"When answering, reflect the user state by varying whether responses only mention short jobs, blur preemption, or accurately distinguish SJF from STCF and apply remaining-time comparisons."},{"id":"multi_level_feedback_queue_scheduling","name":"Multi-Level Feedback Queue Scheduling","type":"concept","definition":"MLFQ uses multiple priority queues and feedback from observed behavior to favor interactive jobs while still making progress on long-running CPU-intensive jobs when future job lengths are not known.","source_locators":[{"source_id":"OSTEP","locator":"Experiment Scope: Operating Systems Foundations (part 2), Chapter 8, Sections 8.1-8.6","note":"Introduces MLFQ goals and core rules."}],"diagnostic_goal":"Diagnose whether the user understands how MLFQ uses multiple priority queues and feedback from observed job behavior to favor interactive jobs while still allowing long CPU-intensive jobs to progress when future lengths are unknown.","levels":{"L0":"Does not recognize MLFQ or treats it as a single fixed queue with no priorities, feedback, demotion, or starvation prevention.","L1":"Can recall that MLFQ has multiple queues or priorities, but cannot explain how feedback from job behavior changes priority or how it serves interactive and long-running jobs.","L2":"Can explain that MLFQ uses several priority queues and adjusts jobs based on behavior, but may only partially describe rules such as new jobs starting high, demotion after using time allotment, round-robin within a queue, or priority boosts.","L3":"Can describe the core MLFQ rules: higher-priority queues run first, jobs at the same priority use round-robin, new jobs begin at high priority, jobs that consume their time allotment are demoted, and periodic boosts help avoid starvation while favoring interactive jobs.","L4":"Can apply MLFQ to scheduling scenarios by tracking job movement among queues, predicting how interactive versus CPU-intensive behavior affects priority, applying round-robin within a queue, and explaining how boosts allow long jobs to make progress.","L5":"Can critique and teach MLFQ as an adaptive scheduling policy for unknown future job lengths, generate examples showing both its responsiveness and starvation risks, and reason about how feedback, demotion, and boosts balance interactive performance with progress for long-running jobs."},"diagnostic_signals":["Mentions multiple priority queues rather than a single queue.","Explains that feedback from observed behavior determines or changes a job's priority.","States that higher-priority jobs run before lower-priority jobs and that same-priority jobs use round-robin.","States that new jobs start at high priority.","Explains demotion after a job uses its time allotment, especially for CPU-intensive behavior.","Mentions periodic priority boosts as a way to avoid starvation of low-priority long-running jobs.","Connects the policy to favoring interactive jobs while still making progress on CPU-intensive jobs when future job lengths are unknown.","Common misconception: says MLFQ requires knowing all job lengths in advance."],"simulator_behavior":"When answering, reflect the user state by varying whether responses merely name multiple queues, omit feedback and boosts, or accurately track priority rules, demotion, round-robin behavior, and starvation avoidance in MLFQ."}],"edges":[{"id":"edge_operating_system_virtualization_prerequisite_for_limited_direct_execution","source":"operating_system_virtualization","target":"limited_direct_execution","type":"prerequisite_for","rationale":"Limited direct execution is introduced as a CPU-virtualization technique, so understanding OS virtualization as transforming physical resources into virtual abstractions is needed to understand what limited direct execution is trying to accomplish.","weight":0.88,"curation_confidence":0.9},{"id":"edge_operating_system_virtualization_supports_operating_system_as_resource_manager","source":"operating_system_virtualization","target":"operating_system_as_resource_manager","type":"supports","rationale":"Virtualizing resources helps explain why multiple programs can share physical CPU, memory, and disk resources, which in turn motivates the OS role of allocating those shared resources.","weight":0.74,"curation_confidence":0.82},{"id":"edge_operating_system_as_standard_interface_provider_prerequisite_for_system_call_trap_and_return_from_trap","source":"operating_system_as_standard_interface_provider","target":"system_call_trap_and_return_from_trap","type":"prerequisite_for","rationale":"System-call trap mechanics explain how applications cross the OS interface to request services, so the notion of system calls as OS-provided interfaces is a prerequisite for stable understanding of the trap-and-return mechanism.","weight":0.86,"curation_confidence":0.9},{"id":"edge_user_mode_and_kernel_mode_prerequisite_for_system_call_trap_and_return_from_trap","source":"user_mode_and_kernel_mode","target":"system_call_trap_and_return_from_trap","type":"prerequisite_for","rationale":"A system call trap raises privilege to kernel mode and return-from-trap lowers privilege back to user mode, so the user/kernel privilege distinction is required to understand the mechanism accurately.","weight":0.95,"curation_confidence":0.96},{"id":"edge_user_mode_and_kernel_mode_prerequisite_for_limited_direct_execution","source":"user_mode_and_kernel_mode","target":"limited_direct_execution","type":"prerequisite_for","rationale":"Limited direct execution depends on running application code directly while restricting privileged operations; the user-mode and kernel-mode distinction is the core privilege boundary that makes those limits meaningful.","weight":0.9,"curation_confidence":0.94},{"id":"edge_system_call_trap_and_return_from_trap_supports_limited_direct_execution","source":"system_call_trap_and_return_from_trap","target":"limited_direct_execution","type":"supports","rationale":"Trap-mediated system calls explain how limited direct execution can let user programs run directly while still providing controlled entry into the kernel for privileged OS services.","weight":0.82,"curation_confidence":0.88},{"id":"edge_timer_interrupt_for_preemptive_control_supports_limited_direct_execution","source":"timer_interrupt_for_preemptive_control","target":"limited_direct_execution","type":"supports","rationale":"Timer interrupts explain how the OS regains control from directly executing programs without their cooperation, which supports the control side of limited direct execution.","weight":0.84,"curation_confidence":0.9},{"id":"edge_trap_table_controlled_kernel_entry_supports_system_call_trap_and_return_from_trap","source":"trap_table_controlled_kernel_entry","target":"system_call_trap_and_return_from_trap","type":"supports","rationale":"The trap table explains how trap events are dispatched to approved kernel handlers rather than arbitrary user-selected destinations, strengthening the controlled-entry account of system-call traps.","weight":0.78,"curation_confidence":0.86},{"id":"edge_timer_interrupt_for_preemptive_control_supports_context_switch","source":"timer_interrupt_for_preemptive_control","target":"context_switch","type":"supports","rationale":"A timer interrupt can return control to the OS and create the opportunity for the scheduler to switch away from the current process, making it a specific trigger that supports preemptive context switching.","weight":0.72,"curation_confidence":0.8},{"id":"edge_process_abstraction_prerequisite_for_process_machine_state","source":"process_abstraction","target":"process_machine_state","type":"prerequisite_for","rationale":"Process machine state is the execution state of a process, so understanding a process as a running-program abstraction is necessary before its memory, register, and I/O state can be interpreted correctly.","weight":0.9,"curation_confidence":0.94},{"id":"edge_process_abstraction_prerequisite_for_process_creation_and_loading","source":"process_abstraction","target":"process_creation_and_loading","type":"prerequisite_for","rationale":"Process creation is the transformation of an executable into a running process, so the distinction between an inactive program and the process abstraction is required to understand creation and loading.","weight":0.9,"curation_confidence":0.93},{"id":"edge_process_abstraction_prerequisite_for_process_states_and_transitions","source":"process_abstraction","target":"process_states_and_transitions","type":"prerequisite_for","rationale":"Running, ready, and blocked are states of a process, so understanding what a process is is necessary for stable understanding of the state model and its transitions.","weight":0.86,"curation_confidence":0.91},{"id":"edge_process_abstraction_prerequisite_for_process_list_and_process_control_block","source":"process_abstraction","target":"process_list_and_process_control_block","type":"prerequisite_for","rationale":"Process lists and process control blocks are OS data structures for tracking processes, so the process abstraction is needed to understand what those structures describe and manage.","weight":0.84,"curation_confidence":0.88},{"id":"edge_process_machine_state_prerequisite_for_context_switch","source":"process_machine_state","target":"context_switch","type":"prerequisite_for","rationale":"A context switch saves and restores process execution state, so understanding the relevant machine state such as registers, program counter, and I/O-related state is required to understand what is being preserved.","weight":0.93,"curation_confidence":0.95},{"id":"edge_process_list_and_process_control_block_supports_context_switch","source":"process_list_and_process_control_block","target":"context_switch","type":"supports","rationale":"Process control blocks store saved context and per-process metadata, which explains where the OS can keep the state needed to stop and later resume processes during context switches.","weight":0.82,"curation_confidence":0.88},{"id":"edge_context_switch_supports_mechanism_and_policy_separation","source":"context_switch","target":"mechanism_and_policy_separation","type":"supports","rationale":"Context switching is a concrete example of an OS mechanism: it is the low-level machinery that carries out a switch after a scheduling policy decides which process should run.","weight":0.8,"curation_confidence":0.9},{"id":"edge_fork_process_creation_part_of_unix_fork_exec_and_wait_process_api","source":"fork_process_creation","target":"unix_fork_exec_and_wait_process_api","type":"part_of","rationale":"fork() is one of the core calls in the UNIX process-control API, where it provides the process-creation component of the combined fork, exec, and wait model.","weight":0.92,"curation_confidence":0.96},{"id":"edge_exec_process_image_replacement_part_of_unix_fork_exec_and_wait_process_api","source":"exec_process_image_replacement","target":"unix_fork_exec_and_wait_process_api","type":"part_of","rationale":"exec() is one of the core calls in the UNIX process-control API, where it provides the program-image replacement component used with fork() and wait().","weight":0.92,"curation_confidence":0.96},{"id":"edge_exec_process_image_replacement_contrasts_with_fork_process_creation","source":"exec_process_image_replacement","target":"fork_process_creation","type":"contrasts_with","rationale":"fork() creates a new child process that continues from the call, while exec() does not create a new process and instead replaces the current process's program image.","weight":0.9,"curation_confidence":0.95},{"id":"edge_process_creation_and_loading_supports_exec_process_image_replacement","source":"process_creation_and_loading","target":"exec_process_image_replacement","type":"supports","rationale":"Both concepts involve loading executable code and data into memory, and process creation provides the broader loading-and-initialization background needed to explain exec() as loading a new program image into an existing process.","weight":0.72,"curation_confidence":0.78},{"id":"edge_unix_fork_exec_and_wait_process_api_prerequisite_for_fork_and_exec_separation_in_a_shell","source":"unix_fork_exec_and_wait_process_api","target":"fork_and_exec_separation_in_a_shell","type":"prerequisite_for","rationale":"The shell example depends on the combined roles of fork(), exec(), and wait(): creating a child, replacing its program image, and ordering the parent shell with child completion.","weight":0.94,"curation_confidence":0.96},{"id":"edge_fork_process_creation_prerequisite_for_fork_and_exec_separation_in_a_shell","source":"fork_process_creation","target":"fork_and_exec_separation_in_a_shell","type":"prerequisite_for","rationale":"Understanding how fork() creates a child that continues from the call is required to explain why a shell can create a separate child process before running a command.","weight":0.88,"curation_confidence":0.92},{"id":"edge_exec_process_image_replacement_prerequisite_for_fork_and_exec_separation_in_a_shell","source":"exec_process_image_replacement","target":"fork_and_exec_separation_in_a_shell","type":"prerequisite_for","rationale":"Understanding exec() as replacing the program image within an existing process is required to explain how the shell's child becomes the requested command after any setup between fork and exec.","weight":0.88,"curation_confidence":0.92},{"id":"edge_scheduling_turnaround_time_and_response_time_prerequisite_for_fifo_scheduling_and_convoy_effect","source":"scheduling_turnaround_time_and_response_time","target":"fifo_scheduling_and_convoy_effect","type":"prerequisite_for","rationale":"The convoy-effect weakness of FIFO is described in terms of waiting and poor turnaround time, so the scheduling metric of turnaround time is needed to evaluate the effect precisely.","weight":0.82,"curation_confidence":0.87},{"id":"edge_scheduling_turnaround_time_and_response_time_prerequisite_for_shortest_job_scheduling_policies","source":"scheduling_turnaround_time_and_response_time","target":"shortest_job_scheduling_policies","type":"prerequisite_for","rationale":"SJF and STCF are motivated by turnaround-time behavior, so understanding scheduling turnaround time is necessary for stable understanding of what these shortest-job policies optimize or improve.","weight":0.84,"curation_confidence":0.89},{"id":"edge_fifo_scheduling_and_convoy_effect_contrasts_with_shortest_job_scheduling_policies","source":"fifo_scheduling_and_convoy_effect","target":"shortest_job_scheduling_policies","type":"contrasts_with","rationale":"FIFO schedules by arrival order and can make short jobs wait behind a long job, whereas SJF and STCF use job length or remaining time to favor shorter work and improve turnaround behavior under their assumptions.","weight":0.86,"curation_confidence":0.9},{"id":"edge_multi_level_feedback_queue_scheduling_contrasts_with_shortest_job_scheduling_policies","source":"multi_level_feedback_queue_scheduling","target":"shortest_job_scheduling_policies","type":"contrasts_with","rationale":"SJF and STCF rely on known job lengths or remaining times, while MLFQ is designed for cases where future job lengths are not known and instead uses feedback from observed behavior to adjust priorities.","weight":0.84,"curation_confidence":0.88},{"id":"edge_scheduling_turnaround_time_and_response_time_supports_multi_level_feedback_queue_scheduling","source":"scheduling_turnaround_time_and_response_time","target":"multi_level_feedback_queue_scheduling","type":"supports","rationale":"Response time helps explain MLFQ's goal of favoring interactive jobs, while turnaround-oriented scheduling metrics provide context for comparing MLFQ with earlier scheduling policies.","weight":0.72,"curation_confidence":0.8}]}]</script>
  <header class="masthead">
    <p class="eyebrow">KnowAct · JSON review workflow</p>
    <h1>KG 评审比对与确认</h1>
    <p class="subtitle">导入同一冻结 candidate graph 的两份完整评审 JSON，计算一致性、定位需仲裁条目，并导出确认 JSON。页面不读取 CSV，也不直接执行 promotion。</p>
  </header>
  <main>
    <section class="panel">
      <h2>1. 导入独立评审 JSON</h2>
      <p class="muted">两份输入都必须是 <code>knowact.kg_review_submission.v3</code>、状态为 <code>complete</code>，且 graph fingerprint 完全相同。</p>
      <div class="input-grid">
        <div class="file-drop" id="drop-r1">
          <h3>Reviewer 1</h3>
          <p class="file-status" id="status-r1">尚未导入</p>
          <button data-pick="r1">选择 JSON</button>
          <input class="file-input" id="file-r1" type="file" accept="application/json,.json">
        </div>
        <div class="file-drop" id="drop-r2">
          <h3>Reviewer 2</h3>
          <p class="file-status" id="status-r2">尚未导入</p>
          <button data-pick="r2">选择 JSON</button>
          <input class="file-input" id="file-r2" type="file" accept="application/json,.json">
        </div>
      </div>
      <div id="import-message"></div>
    </section>

    <section id="comparison-root" class="hidden"></section>
  </main>

  <script>
  (() => {
    "use strict";

    const packages = JSON.parse(document.getElementById("review-packages").textContent);
    const packagesByFingerprint = Object.fromEntries(packages.map(item => [item.graph.graph_fingerprint, item]));
    const REVIEW_SCHEMA = "knowact.kg_review_submission.v3";
    const CONFIRMATION_SCHEMA = "knowact.kg_review_confirmation.v3";
    const inputs = { r1: null, r2: null };
    let rows = [];
    let metrics = null;
    let resolutions = {};
    let confirmationId = "";
    let adjudicator = {
      adjudicator_code: "",
      adjudication_date: "",
      adjudication_minutes: "",
      confirmed_review_inputs_and_resolutions: false,
    };

    const fieldSets = {
      node: ["scope_fit", "granularity", "diagnostic_usefulness", "rubric_quality", "decision"],
      edge: ["relation_validity", "type_correct", "replacement_type", "direction_correct", "provenance_class", "decision"],
      coverage: ["task_coverage"],
      overall: ["decision"],
    };
    const allowedValues = {
      scope_fit: ["in_scope", "boundary", "out_of_scope"],
      granularity: ["appropriate", "too_broad", "too_narrow", "mixed"],
      diagnostic_usefulness: ["adequate", "minor_issue", "major_issue"],
      rubric_quality: ["adequate", "minor_issue", "major_issue"],
      node_decision: ["accept", "edit", "reject"],
      relation_validity: ["valid", "uncertain", "invalid"],
      type_correct: ["yes", "no", "uncertain"],
      replacement_type: ["", "part_of", "prerequisite_for", "supports", "contrasts_with"],
      direction_correct: ["yes", "no", "not_applicable", "uncertain"],
      provenance_class: ["source_explicit", "source_entailed", "expert_pedagogical_extension", "unsupported"],
      edge_decision: ["accept", "edit", "delete"],
      task_coverage: ["sufficient", "partial", "insufficient"],
      overall_decision: ["approve", "approve_after_edits", "do_not_approve"],
    };
    const criticalValues = new Set([
      "out_of_scope", "major_issue", "invalid",
      "edit", "reject", "delete", "partial", "insufficient",
      "approve_after_edits", "do_not_approve",
    ]);

    function esc(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function safeFilename(value) {
      return String(value || "unknown").replace(/[^A-Za-z0-9_-]+/g, "_").replace(/^_+|_+$/g, "") || "unknown";
    }

    async function sha256(text) {
      if (!globalThis.crypto?.subtle) throw new Error("当前浏览器不支持 Web Crypto SHA-256");
      const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return [...new Uint8Array(digest)].map(byte => byte.toString(16).padStart(2, "0")).join("");
    }

    function exactIds(actual, expected, label) {
      const actualIds = actual.map(item => item[label]);
      if (actualIds.length !== expected.length || actualIds.some((id, index) => id !== expected[index])) {
        throw new Error(`${label} 集合或顺序与冻结 review package 不一致`);
      }
    }

    function canonicalJson(value) {
      if (Array.isArray(value)) return `[${value.map(canonicalJson).join(",")}]`;
      if (value && typeof value === "object") {
        return `{${Object.keys(value).sort().map(key => `${JSON.stringify(key)}:${canonicalJson(value[key])}`).join(",")}}`;
      }
      return JSON.stringify(value);
    }

    function requireNonblank(value, label) {
      if (typeof value !== "string" || !value.trim()) throw new Error(`${label} 必须是非空字符串`);
    }

    function requireAllowed(value, allowed, label) {
      if (!allowed.includes(value)) throw new Error(`${label} 包含不允许的值: ${String(value)}`);
    }

    function requireExactFields(value, fields, label) {
      if (canonicalJson(Object.keys(value || {}).sort()) !== canonicalJson([...fields].sort())) {
        throw new Error(`${label} 必须且只能包含 ${fields.join(", ")}`);
      }
    }

    function validateCompleteContent(documentValue, packageData) {
      if (canonicalJson(documentValue.graph) !== canonicalJson(packageData.graph)) {
        throw new Error("graph binding 与 fingerprint 对应的冻结 package 不完全一致");
      }
      const reviewer = documentValue.reviewer || {};
      const reviewerFields = ["reviewer_id", "role", "experience_band", "introduction"];
      requireExactFields(reviewer, reviewerFields, "reviewer");
      reviewerFields.forEach(field => requireNonblank(reviewer[field], `reviewer.${field}`));
      if (documentValue.validation?.issue_count !== 0 || (documentValue.validation?.issues || []).length !== 0) {
        throw new Error("complete 提交不得保留 validation issues");
      }

      documentValue.node_reviews.forEach(review => {
        requireExactFields(review, [
          "item_order", "node_id", "scope_fit", "granularity",
          "diagnostic_usefulness", "rubric_quality", "decision",
          "proposed_change", "rationale",
        ], review.node_id || "node_review");
        requireAllowed(review.scope_fit, allowedValues.scope_fit, `${review.node_id}.scope_fit`);
        requireAllowed(review.granularity, allowedValues.granularity, `${review.node_id}.granularity`);
        requireAllowed(review.diagnostic_usefulness, allowedValues.diagnostic_usefulness, `${review.node_id}.diagnostic_usefulness`);
        requireAllowed(review.rubric_quality, allowedValues.rubric_quality, `${review.node_id}.rubric_quality`);
        requireAllowed(review.decision, allowedValues.node_decision, `${review.node_id}.decision`);
        if (["edit", "reject"].includes(review.decision)) requireNonblank(review.rationale, `${review.node_id}.rationale`);
        if (review.decision === "edit") requireNonblank(review.proposed_change, `${review.node_id}.proposed_change`);
      });

      const edgeById = Object.fromEntries(packageData.edges.map(edge => [edge.id, edge]));
      documentValue.edge_reviews.forEach(review => {
        const edge = edgeById[review.edge_id];
        requireExactFields(review, [
          "item_order", "edge_id", "relation_validity", "type_correct",
          "replacement_type", "direction_correct", "provenance_class",
          "decision", "proposed_change", "rationale",
        ], review.edge_id || "edge_review");
        requireAllowed(review.relation_validity, allowedValues.relation_validity, `${review.edge_id}.relation_validity`);
        requireAllowed(review.type_correct, allowedValues.type_correct, `${review.edge_id}.type_correct`);
        requireAllowed(review.replacement_type, allowedValues.replacement_type, `${review.edge_id}.replacement_type`);
        requireAllowed(review.direction_correct, allowedValues.direction_correct, `${review.edge_id}.direction_correct`);
        requireAllowed(review.provenance_class, allowedValues.provenance_class, `${review.edge_id}.provenance_class`);
        requireAllowed(review.decision, allowedValues.edge_decision, `${review.edge_id}.decision`);
        if (review.type_correct === "no" && !review.replacement_type) throw new Error(`${review.edge_id}.replacement_type 必填`);
        if (edge.type === "contrasts_with" && review.direction_correct !== "not_applicable") {
          throw new Error(`${review.edge_id}.direction_correct 必须为 not_applicable`);
        }
        if (edge.type !== "contrasts_with" && review.direction_correct === "not_applicable") {
          throw new Error(`${review.edge_id}.direction_correct 不得为 not_applicable`);
        }
        if (["edit", "delete"].includes(review.decision)) requireNonblank(review.rationale, `${review.edge_id}.rationale`);
        if (review.decision === "edit") requireNonblank(review.proposed_change, `${review.edge_id}.proposed_change`);
      });

      documentValue.coverage_reviews.forEach((review, index) => {
        requireAllowed(review.task_coverage, allowedValues.task_coverage, `${review.task_id}.task_coverage`);
        if (review.task_text !== packageData.scope.representative_tasks[index]) {
          throw new Error(`${review.task_id}.task_text 与冻结 package 不一致`);
        }
        if (review.task_coverage !== "sufficient") {
          requireNonblank(review.missing_or_redundant_content, `${review.task_id}.missing_or_redundant_content`);
          requireNonblank(review.rationale, `${review.task_id}.rationale`);
        }
      });

      const overall = documentValue.overall_graph_review || {};
      requireAllowed(overall.decision, allowedValues.overall_decision, "overall_graph_review.decision");
      if (overall.decision !== "approve") requireNonblank(overall.rationale, "overall_graph_review.rationale");
    }

    function validateSubmission(documentValue) {
      if (documentValue.schema_version !== REVIEW_SCHEMA) throw new Error(`schema_version 必须为 ${REVIEW_SCHEMA}`);
      if (documentValue.status !== "complete" || documentValue.validation?.complete !== true) {
        throw new Error("只接受已通过完整性校验的 complete 评审 JSON");
      }
      const fingerprint = documentValue.graph?.graph_fingerprint;
      const packageData = packagesByFingerprint[fingerprint];
      if (!packageData) throw new Error("输入 graph fingerprint 不属于当前三份冻结 KG review packages");
      if (!documentValue.reviewer?.reviewer_id) throw new Error("reviewer_id 为空");
      exactIds(documentValue.node_reviews || [], packageData.nodes.map(node => node.id), "node_id");
      exactIds(documentValue.edge_reviews || [], packageData.edges.map(edge => edge.id), "edge_id");
      exactIds(
        documentValue.coverage_reviews || [],
        packageData.scope.representative_tasks.map((_, index) => `task_${String(index + 1).padStart(3, "0")}`),
        "task_id"
      );
      validateCompleteContent(documentValue, packageData);
      return packageData;
    }

    async function loadFile(slot, file) {
      if (!file) return;
      try {
        const rawText = await file.text();
        const documentValue = JSON.parse(rawText);
        const packageData = validateSubmission(documentValue);
        inputs[slot] = {
          filename: file.name,
          rawText,
          sha256: await sha256(rawText),
          document: documentValue,
          packageData,
        };
        document.getElementById(`drop-${slot}`).classList.add("loaded");
        document.getElementById(`status-${slot}`).textContent =
          `${documentValue.reviewer.reviewer_id} · ${packageData.graph.domain} · ${file.name}`;
        showImportMessage("", "none");
        if (inputs.r1 && inputs.r2) compareInputs();
      } catch (error) {
        inputs[slot] = null;
        document.getElementById(`drop-${slot}`).classList.remove("loaded");
        document.getElementById(`status-${slot}`).textContent = "导入失败";
        document.getElementById("comparison-root").classList.add("hidden");
        showImportMessage(error.message, "error");
      }
    }

    function showImportMessage(message, kind) {
      const element = document.getElementById("import-message");
      element.className = kind === "error" ? "error" : kind === "success" ? "success" : "";
      element.textContent = message;
    }

    function rowKey(type, id) {
      return `${type}:${id}`;
    }

    function valuesDiffer(first, second, fields) {
      return fields.filter(field => String(first?.[field] ?? "") !== String(second?.[field] ?? ""));
    }

    function makeRow(type, id, label, first, second, fields, finalOptions) {
      const disagreementFields = valuesDiffer(first, second, fields);
      const critical = fields.some(field => criticalValues.has(first?.[field]) || criticalValues.has(second?.[field]));
      const requiresAdjudication = disagreementFields.length > 0 || critical;
      const finalField = type === "coverage" ? "task_coverage" : "decision";
      const agreedFinal = String(first?.[finalField] ?? "") === String(second?.[finalField] ?? "")
        ? String(first?.[finalField] ?? "")
        : "";
      return {
        type, id, label, first, second, fields, finalOptions,
        disagreementFields, critical, requiresAdjudication, agreedFinal,
      };
    }

    function buildRows(packageData, first, second) {
      const firstNodes = Object.fromEntries(first.node_reviews.map(item => [item.node_id, item]));
      const secondNodes = Object.fromEntries(second.node_reviews.map(item => [item.node_id, item]));
      const firstEdges = Object.fromEntries(first.edge_reviews.map(item => [item.edge_id, item]));
      const secondEdges = Object.fromEntries(second.edge_reviews.map(item => [item.edge_id, item]));
      const firstCoverage = Object.fromEntries(first.coverage_reviews.map(item => [item.task_id, item]));
      const secondCoverage = Object.fromEntries(second.coverage_reviews.map(item => [item.task_id, item]));

      const result = [];
      packageData.nodes.forEach(node => result.push(makeRow(
        "node", node.id, node.name, firstNodes[node.id], secondNodes[node.id],
        fieldSets.node, ["accept", "edit", "reject"]
      )));
      packageData.edges.forEach(edge => result.push(makeRow(
        "edge", edge.id, `${edge.source} → ${edge.target} (${edge.type})`,
        firstEdges[edge.id], secondEdges[edge.id],
        fieldSets.edge, ["accept", "edit", "delete"]
      )));
      packageData.scope.representative_tasks.forEach((task, index) => {
        const id = `task_${String(index + 1).padStart(3, "0")}`;
        result.push(makeRow(
          "coverage", id, task, firstCoverage[id], secondCoverage[id],
          fieldSets.coverage, ["sufficient", "partial", "insufficient"]
        ));
      });
      result.push(makeRow(
        "overall", "overall_graph", "Overall graph decision",
        first.overall_graph_review, second.overall_graph_review,
        fieldSets.overall, ["approve", "approve_after_edits", "do_not_approve"]
      ));
      return result;
    }

    function cohenKappa(first, second) {
      if (!first.length || first.length !== second.length) return null;
      const categories = [...new Set([...first, ...second])];
      const observed = first.filter((value, index) => value === second[index]).length / first.length;
      const expected = categories.reduce((sum, category) => {
        const firstRate = first.filter(value => value === category).length / first.length;
        const secondRate = second.filter(value => value === category).length / second.length;
        return sum + firstRate * secondRate;
      }, 0);
      if (expected === 1) return observed === 1 ? 1 : null;
      return (observed - expected) / (1 - expected);
    }

    function agreement(valuesA, valuesB) {
      return valuesA.filter((value, index) => value === valuesB[index]).length / valuesA.length;
    }

    function calculateMetrics(resultRows) {
      const nodeRows = resultRows.filter(row => row.type === "node");
      const edgeRows = resultRows.filter(row => row.type === "edge");
      const coverageRows = resultRows.filter(row => row.type === "coverage");
      const nodeA = nodeRows.map(row => row.first.decision);
      const nodeB = nodeRows.map(row => row.second.decision);
      const edgeA = edgeRows.map(row => row.first.decision);
      const edgeB = edgeRows.map(row => row.second.decision);
      const fieldDisagreements = {};
      for (const type of ["node", "edge", "coverage", "overall"]) {
        for (const field of fieldSets[type]) {
          fieldDisagreements[`${type}.${field}`] = resultRows
            .filter(row => row.type === type && row.disagreementFields.includes(field)).length;
        }
      }
      return {
        node_raw_agreement: agreement(nodeA, nodeB),
        node_cohens_kappa: cohenKappa(nodeA, nodeB),
        edge_raw_agreement: agreement(edgeA, edgeB),
        edge_cohens_kappa: cohenKappa(edgeA, edgeB),
        coverage_exact_agreement_count: coverageRows.filter(row => !row.disagreementFields.length).length,
        coverage_item_count: coverageRows.length,
        field_disagreement_counts: fieldDisagreements,
        items_requiring_adjudication: resultRows.filter(row => row.requiresAdjudication).length,
      };
    }

    function compareInputs() {
      const first = inputs.r1.document;
      const second = inputs.r2.document;
      if (first.graph.graph_fingerprint !== second.graph.graph_fingerprint) {
        showImportMessage("两份 JSON 的 graph fingerprint 不一致，不能比对。", "error");
        document.getElementById("comparison-root").classList.add("hidden");
        return;
      }
      if (first.reviewer.reviewer_id === second.reviewer.reviewer_id) {
        showImportMessage("两份 JSON 的 reviewer_id 相同，不能作为两份独立评审。", "error");
        document.getElementById("comparison-root").classList.add("hidden");
        return;
      }
      rows = buildRows(inputs.r1.packageData, first, second);
      metrics = calculateMetrics(rows);
      resolutions = {};
      rows.forEach(row => {
        resolutions[rowKey(row.type, row.id)] = {
          final_decision: row.agreedFinal,
          final_edit: "",
          adjudication_rationale: "",
        };
      });
      adjudicator = {
        adjudicator_code: "",
        adjudication_date: new Date().toISOString().slice(0, 10),
        adjudication_minutes: "",
        confirmed_review_inputs_and_resolutions: false,
      };
      confirmationId = "";
      showImportMessage(
        `已验证 ${inputs.r1.packageData.graph.domain} 的两份独立完整评审；下方仅要求处理分歧、缺陷与修改请求。`,
        "success"
      );
      renderComparison();
    }

    function formatMetric(value) {
      return value === null || Number.isNaN(value) ? "N/A" : value.toFixed(3);
    }

    function renderMetricPanel(packageData) {
      return `<section class="panel">
        <h2>2. 一致性摘要</h2>
        <p class="binding">${esc(packageData.graph.domain)} · ${esc(packageData.graph.candidate_run_id)}<br>${esc(packageData.graph.graph_fingerprint)}</p>
        <div class="metric-grid">
          <div class="metric"><strong>${formatMetric(metrics.node_raw_agreement)}</strong><span>Node raw agreement</span></div>
          <div class="metric"><strong>${formatMetric(metrics.node_cohens_kappa)}</strong><span>Node Cohen's kappa</span></div>
          <div class="metric"><strong>${formatMetric(metrics.edge_raw_agreement)}</strong><span>Edge raw agreement</span></div>
          <div class="metric"><strong>${formatMetric(metrics.edge_cohens_kappa)}</strong><span>Edge Cohen's kappa</span></div>
          <div class="metric"><strong>${metrics.coverage_exact_agreement_count}/${metrics.coverage_item_count}</strong><span>Coverage exact agreement</span></div>
          <div class="metric"><strong>${metrics.items_requiring_adjudication}</strong><span>Items requiring adjudication</span></div>
        </div>
        <div class="reviewer-grid" style="margin-top:14px">
          <div class="reviewer-box"><strong>R1 · ${esc(inputs.r1.document.reviewer.reviewer_id)}</strong><p>${esc(inputs.r1.filename)}</p><p class="identifier">sha256:${esc(inputs.r1.sha256)}</p></div>
          <div class="reviewer-box"><strong>R2 · ${esc(inputs.r2.document.reviewer.reviewer_id)}</strong><p>${esc(inputs.r2.filename)}</p><p class="identifier">sha256:${esc(inputs.r2.sha256)}</p></div>
        </div>
      </section>`;
    }

    function criticalLabel(row) {
      if (row.disagreementFields.length && row.critical) return "分歧 + 缺陷触发";
      if (row.disagreementFields.length) return "字段分歧";
      return "缺陷/修改触发";
    }

    function renderResolutionCard(row, index) {
      const resolution = resolutions[rowKey(row.type, row.id)];
      const firstCode = inputs.r1.document.reviewer.reviewer_id;
      const secondCode = inputs.r2.document.reviewer.reviewer_id;
      const comparisonRows = row.fields.map(field => {
        const differs = row.disagreementFields.includes(field);
        return `<tr class="${differs ? "diff" : ""}">
          <td><code>${esc(field)}</code></td>
          <td>${esc(row.first?.[field] ?? "")}</td>
          <td>${esc(row.second?.[field] ?? "")}</td>
        </tr>`;
      }).join("");
      const options = ['<option value="">请选择最终决定</option>']
        .concat(row.finalOptions.map(option =>
          `<option value="${esc(option)}"${resolution.final_decision === option ? " selected" : ""}>${esc(option)}</option>`
        )).join("");
      const actionRequired = !["accept", "sufficient", "approve"].includes(resolution.final_decision);
      return `<article class="panel resolution-card ${row.critical ? "critical" : ""}" id="resolution-${index}">
        <div class="item-header">
          <div><h3>${esc(row.label)}</h3><div class="identifier">${esc(row.type)} · ${esc(row.id)}</div></div>
          <span class="badge">${esc(criticalLabel(row))}</span>
        </div>
        <table class="comparison-table">
          <thead><tr><th>字段</th><th>${esc(firstCode)}</th><th>${esc(secondCode)}</th></tr></thead>
          <tbody>${comparisonRows}</tbody>
        </table>
        <div class="reviewer-grid">
          <div class="reviewer-box"><strong>${esc(firstCode)} 的修改与理由</strong><p>${esc(row.first?.proposed_change || row.first?.missing_or_redundant_content || "—")}</p><p>${esc(row.first?.rationale || "—")}</p></div>
          <div class="reviewer-box"><strong>${esc(secondCode)} 的修改与理由</strong><p>${esc(row.second?.proposed_change || row.second?.missing_or_redundant_content || "—")}</p><p>${esc(row.second?.rationale || "—")}</p></div>
        </div>
        <div class="resolution-grid" style="margin-top:14px">
          <div class="field">
            <label class="required">最终决定 / Final decision</label>
            <select data-resolution-key="${esc(rowKey(row.type, row.id))}" data-resolution-field="final_decision">${options}</select>
          </div>
          <div class="field full">
            <label class="${actionRequired ? "required" : ""}">精确修改或处理 / Exact edit or action</label>
            <textarea data-resolution-key="${esc(rowKey(row.type, row.id))}" data-resolution-field="final_edit">${esc(resolution.final_edit)}</textarea>
            <span class="hint">最终决定不是 accept / sufficient / approve 时必填；修改后的 graph 需要重新冻结哈希。</span>
          </div>
          <div class="field full">
            <label class="required">仲裁理由 / Adjudication rationale</label>
            <textarea data-resolution-key="${esc(rowKey(row.type, row.id))}" data-resolution-field="adjudication_rationale">${esc(resolution.adjudication_rationale)}</textarea>
          </div>
        </div>
      </article>`;
    }

    function confirmationIssues() {
      const issues = [];
      if (!adjudicator.adjudicator_code.trim()) issues.push("adjudicator_code 未填写。");
      if (!adjudicator.adjudication_date) issues.push("adjudication_date 未填写。");
      if (!(Number(adjudicator.adjudication_minutes) > 0)) issues.push("adjudication_minutes 必须大于 0。");
      if (!adjudicator.confirmed_review_inputs_and_resolutions) issues.push("必须确认已核对两份输入与全部仲裁结果。");
      rows.filter(row => row.requiresAdjudication).forEach(row => {
        const resolution = resolutions[rowKey(row.type, row.id)];
        if (!resolution.final_decision) issues.push(`${row.type}:${row.id} 尚无最终决定。`);
        if (!resolution.adjudication_rationale.trim()) issues.push(`${row.type}:${row.id} 尚无仲裁理由。`);
        if (resolution.final_decision && !["accept", "sufficient", "approve"].includes(resolution.final_decision) && !resolution.final_edit.trim()) {
          issues.push(`${row.type}:${row.id} 的最终决定要求精确修改或处理。`);
        }
      });
      return issues;
    }

    function renderConfirmationPanel() {
      const issues = confirmationIssues();
      return `<section class="panel" id="confirmation-panel">
        <h2>4. 确认并导出 JSON</h2>
        <p class="muted">确认 JSON 是可审计的 review decision record。只有“无修改接受”才可进入结构验证；有修改时必须更新 candidate artifacts 并重新冻结哈希。</p>
        <div class="resolution-grid" style="margin-top:14px">
          <div class="field">
            <label class="required">仲裁者代码 / Adjudicator code</label>
            <input value="${esc(adjudicator.adjudicator_code)}" data-adjudicator-field="adjudicator_code">
          </div>
          <div class="field">
            <label class="required">仲裁日期 / Adjudication date</label>
            <input type="date" value="${esc(adjudicator.adjudication_date)}" data-adjudicator-field="adjudication_date">
          </div>
          <div class="field">
            <label class="required">仲裁时间（分钟）</label>
            <input type="number" min="0.1" step="0.1" value="${esc(adjudicator.adjudication_minutes)}" data-adjudicator-field="adjudication_minutes">
          </div>
          <div class="field">
            <label class="required">确认</label>
            <label class="checkbox-line">
              <input type="checkbox" data-adjudicator-field="confirmed_review_inputs_and_resolutions"${adjudicator.confirmed_review_inputs_and_resolutions ? " checked" : ""}>
              <span>我已核对两份完整评审 JSON、输入 SHA-256、所有触发项及最终处理。</span>
            </label>
          </div>
        </div>
        ${issues.length
          ? `<div class="error"><strong>尚有 ${issues.length} 个确认问题：</strong><ul>${issues.slice(0, 20).map(issue => `<li>${esc(issue)}</li>`).join("")}${issues.length > 20 ? `<li>另有 ${issues.length - 20} 项……</li>` : ""}</ul></div>`
          : '<div class="success"><strong>确认数据完整。</strong> 可以导出 complete confirmation JSON。</div>'}
        <div class="actions">
          <button id="export-confirmation-draft">导出确认草稿 JSON</button>
          <button class="primary" id="export-confirmation-complete"${issues.length ? " disabled" : ""}>导出完整确认 JSON</button>
        </div>
      </section>`;
    }

    function renderComparison() {
      const packageData = inputs.r1.packageData;
      const requiredRows = rows.filter(row => row.requiresAdjudication);
      const autoResolved = rows.length - requiredRows.length;
      const root = document.getElementById("comparison-root");
      root.classList.remove("hidden");
      root.innerHTML = `
        ${renderMetricPanel(packageData)}
        <div class="section-heading">
          <div><h2>3. 分歧、缺陷与修改请求</h2><p class="muted">${autoResolved} 个无触发条目按一致决定自动记录；以下 ${requiredRows.length} 个条目必须逐项确认。</p></div>
          <span class="badge">${requiredRows.length} items</span>
        </div>
        ${requiredRows.length
          ? requiredRows.map(renderResolutionCard).join("")
          : '<section class="panel"><div class="success">两位评审者对全部条目一致无修改接受；仍需填写下方仲裁/确认元数据。</div></section>'}
        ${renderConfirmationPanel()}`;
      bindComparisonEvents();
    }

    function bindComparisonEvents() {
      document.querySelectorAll("[data-resolution-key]").forEach(element => {
        const eventName = element.tagName === "SELECT" ? "change" : "input";
        element.addEventListener(eventName, event => {
          const target = event.currentTarget;
          resolutions[target.dataset.resolutionKey][target.dataset.resolutionField] = target.value;
          if (target.tagName === "SELECT") renderComparison();
        });
      });
      document.querySelectorAll("[data-adjudicator-field]").forEach(element => {
        const eventName = element.type === "checkbox" ? "change" : "input";
        element.addEventListener(eventName, event => {
          const target = event.currentTarget;
          adjudicator[target.dataset.adjudicatorField] = target.type === "checkbox" ? target.checked : target.value;
          if (target.type === "checkbox") renderComparison();
        });
      });
      document.getElementById("export-confirmation-draft").addEventListener("click", () => exportConfirmation("draft"));
      document.getElementById("export-confirmation-complete").addEventListener("click", () => exportConfirmation("complete"));
    }

    function readiness(itemConfirmations) {
      const overall = itemConfirmations.find(item => item.item_type === "overall")?.final_decision;
      if (overall === "do_not_approve") {
        return {
          status: "not_approved",
          structural_validation_required: false,
          promotion_ready: false,
          blocking_reasons: ["The adjudicated overall decision is do_not_approve."],
        };
      }
      const changed = itemConfirmations.filter(item => {
        if (item.item_type === "node") return item.final_decision !== "accept";
        if (item.item_type === "edge") return item.final_decision !== "accept";
        if (item.item_type === "coverage") return item.final_decision !== "sufficient";
        return item.final_decision !== "approve";
      });
      if (changed.length) {
        return {
          status: "edits_required",
          structural_validation_required: true,
          promotion_ready: false,
          blocking_reasons: [
            `${changed.length} adjudicated items require edits, deletion, rejection, scope handling, or conditional approval.`,
            "Apply the changes, rebuild the frozen review package, and bind any later promotion to the updated artifact hashes.",
          ],
        };
      }
      return {
        status: "ready_for_structural_validation",
        structural_validation_required: true,
        promotion_ready: false,
        blocking_reasons: ["Repository structural validation and explicit benchmark-author promotion are still required."],
      };
    }

    function buildConfirmation(status) {
      if (!confirmationId) {
        const randomPart = globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        confirmationId = `kg-review-confirmation-${randomPart}`;
      }
      const validation = confirmationIssues();
      const itemConfirmations = rows.map(row => {
        const resolution = resolutions[rowKey(row.type, row.id)];
        return {
          item_type: row.type,
          item_id: row.id,
          item_label: row.label,
          reviewer_1_judgments: Object.fromEntries(row.fields.map(field => [field, row.first?.[field] ?? ""])),
          reviewer_2_judgments: Object.fromEntries(row.fields.map(field => [field, row.second?.[field] ?? ""])),
          disagreement_fields: row.disagreementFields,
          critical_trigger: row.critical,
          requires_adjudication: row.requiresAdjudication,
          final_decision: resolution.final_decision,
          final_edit: resolution.final_edit.trim(),
          adjudication_rationale: resolution.adjudication_rationale.trim(),
          resolution_status: row.requiresAdjudication ? (resolution.final_decision ? "resolved" : "unresolved") : "auto_resolved_agreement",
        };
      });
      return {
        schema_version: CONFIRMATION_SCHEMA,
        status,
        confirmation_id: confirmationId,
        exported_at: new Date().toISOString(),
        graph: structuredClone(inputs.r1.packageData.graph),
        input_reviews: [
          {
            role: "reviewer_1",
            submission_id: inputs.r1.document.submission_id,
            reviewer_id: inputs.r1.document.reviewer.reviewer_id,
            source_filename: inputs.r1.filename,
            submission_sha256: inputs.r1.sha256,
          },
          {
            role: "reviewer_2",
            submission_id: inputs.r2.document.submission_id,
            reviewer_id: inputs.r2.document.reviewer.reviewer_id,
            source_filename: inputs.r2.filename,
            submission_sha256: inputs.r2.sha256,
          },
        ],
        comparison_summary: structuredClone(metrics),
        adjudication: {
          adjudicator_code: adjudicator.adjudicator_code.trim(),
          adjudication_date: adjudicator.adjudication_date || null,
          adjudication_minutes: adjudicator.adjudication_minutes === "" ? null : Number(adjudicator.adjudication_minutes),
          confirmed_review_inputs_and_resolutions: Boolean(adjudicator.confirmed_review_inputs_and_resolutions),
        },
        item_confirmations: itemConfirmations,
        promotion_readiness: readiness(itemConfirmations),
        validation: {
          complete: validation.length === 0,
          issue_count: validation.length,
          issues: validation,
        },
      };
    }

    function downloadJson(documentValue, filename) {
      const blob = new Blob([JSON.stringify(documentValue, null, 2) + "\n"], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function exportConfirmation(status) {
      const documentValue = buildConfirmation(status);
      if (status === "complete" && !documentValue.validation.complete) {
        renderComparison();
        document.getElementById("confirmation-panel").scrollIntoView({ behavior: "smooth" });
        return;
      }
      const filename = `${inputs.r1.packageData.graph.domain.toLowerCase()}_kg_review_confirmation_${safeFilename(adjudicator.adjudicator_code)}_${status}.json`;
      downloadJson(documentValue, filename);
    }

    document.querySelectorAll("[data-pick]").forEach(button => {
      button.addEventListener("click", () => document.getElementById(`file-${button.dataset.pick}`).click());
    });
    for (const slot of ["r1", "r2"]) {
      document.getElementById(`file-${slot}`).addEventListener("change", event => {
        const file = event.currentTarget.files?.[0];
        event.currentTarget.value = "";
        loadFile(slot, file);
      });
    }
  })();
  </script>
</body>
</html>
