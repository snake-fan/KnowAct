_goal":"Diagnose whether the learner can explain public goods, free riding, and cooperation as related concepts in mutual-benefit projects, including why individuals may benefit from others' contributions without contributing and how cooperative outcomes may be sustained.","levels":{"L0":"Cannot identify public goods, free riding, or cooperation in the relevant sense. May treat any publicly owned item as a public good or any nonpayment as free riding without considering shared benefits from another person's costly provision.","L1":"Can recall terms such as public good, free rider, or cooperation, but gives memorized or incomplete definitions. May say cooperation means being nice, without linking it to participation in a common project for mutual benefits.","L2":"Can explain that a public good can benefit everyone when one person pays a cost and that free riding means benefiting without contributing. Still has difficulty explaining why this creates an incentive problem or how cooperation relates to mutual-benefit projects.","L3":"Can describe the public-goods problem as one in which individuals may prefer others to contribute while they benefit from the good. Can define cooperation as participation in a common project intended to produce mutual benefits and understands that cooperation may occur with or without explicit agreement.","L4":"Can apply the concepts to new scenarios by identifying who bears costs, who receives benefits, who is free riding, and what behavior counts as cooperation. Can explain how punishment or independent actions may sustain cooperative outcomes in appropriate cases.","L5":"Can critically analyze public-goods and free-riding situations, generate examples and counterexamples, and explain the conditions under which cooperation can emerge or be sustained despite incentives to benefit from others' contributions."},"diagnostic_signals":["Identifies that a public good involves one person's costly provision producing benefits for everyone without reducing availability to others.","Explains free riding as receiving benefits from others' contributions without contributing oneself.","Defines cooperation as participation in a common project intended to produce mutual benefits.","Recognizes the incentive to prefer that others contribute while one still benefits from the public good.","Notes that cooperation may arise with or without explicit agreement.","Mentions that punishment or independent actions can help sustain cooperative outcomes when relevant.","Mistakenly equates public goods only with government-provided goods or treats any shared item as a public good without the costly-provision and shared-benefit logic."],"simulator_behavior":"When answering about this node, responses should reflect varying ability to connect public goods, free riding incentives, and cooperation in mutual-benefit projects, including possible sustaining mechanisms such as punishment or independent action."},{"id":"social_preferences_and_experimental_games","name":"Social Preferences and Experimental Games","type":"concept","definition":"Social preferences are motivations such as altruism, fairness, inequality aversion, and reciprocity that influence choices in social interactions; controlled behavioural experiments and games such as the ultimatum game can be used to study these motivations and how rules affect behaviour.","source_locators":[{"source_id":"Economy","locator":"Experiment Scope: Introductory Economics Foundations (part 5), section 4.8","note":"Defines controlled behavioural experiments."},{"source_id":"Economy","locator":"Experiment Scope: Introductory Economics Foundations (part 5), section 4.9","note":"Distinguishes social norms, individual preferences, and social preferences."},{"source_id":"Economy","locator":"Experiment Scope: Introductory Economics Foundations (part 5), section 4.10","note":"Introduces the ultimatum game as a tool for studying social preferences."},{"source_id":"Economy","locator":"Experiment Scope: Introductory Economics Foundations (part 5), section 4.12","note":"Shows how adding competition changes responder and proposer incentives."}],"diagnostic_goal":"Diagnose whether the learner understands social preferences as individual motives such as altruism, fairness, inequality aversion, and reciprocity, and understands how controlled experimental games such as the ultimatum game reveal how rules and incentives affect social behavior.","levels":{"L0":"Does not distinguish social preferences from selfish preferences, social norms, or personality labels. Cannot explain why controlled experimental games are used to study behavior in social interactions.","L1":"Can recall examples such as altruism, fairness, reciprocity, or the ultimatum game, but cannot explain how these motives affect choices or how experiments control rules and incentives.","L2":"Can give a basic explanation that people may care about fairness or others' outcomes, not only their own payoff, and that experiments observe choices. Still confuses group norms with individual preferences or treats experimental behavior as fixed personality rather than behavior under particular rules.","L3":"Can distinguish social norms as group-level expectations from individual social preferences as personal motives that may be influenced by norms. Can explain that controlled behavioural experiments observe choices under common rules, incentives, and treatments, and can describe the ultimatum game as a tool for studying social preferences.","L4":"Can apply the framework to interpret new experimental-game results, explaining how altruism, fairness or inequality aversion, and reciprocity may influence behavior, sometimes in opposite directions. Can explain why changing rules or incentives, such as adding competition, may change responder and proposer behavior.","L5":"Can critically analyze experimental evidence about social preferences, generate plausible interpretations and counterexamples, and teach why observed choices depend jointly on preferences, social norms, rules, incentives, and treatments rather than on a single fixed motive."},"diagnostic_signals":["Names relevant social preferences such as altruism, fairness, inequality aversion, and reciprocity.","Explains that social preferences influence individual choices in social interactions alongside self-interest.","Distinguishes social norms as group-level expectations from individual preferences as what people want to do, while noting norms may influence preferences.","Describes controlled behavioural experiments as observing behavior under common rules, incentives, and treatments.","Identifies the ultimatum game as a one-shot game used to study social preferences.","Explains that adding competition can change incentives, including making responders less likely to reject low offers.","Avoids interpreting experimental choices as direct evidence of fixed personality traits without considering rules and incentives.","Recognizes that different social preferences can work in opposite directions."],"simulator_behavior":"When answering about this node, responses should vary from listing motives or games to interpreting experimental behavior through social preferences, norms, controlled rules, incentives, and treatment changes such as competition."}],"edges":[{"id":"edge_production_function_prerequisite_for_average_product_marginal_product_and_diminishing_marginal_product","source":"production_function","target":"average_product_marginal_product_and_diminishing_marginal_product","type":"prerequisite_for","rationale":"Average product, marginal product, and diminishing marginal product are measures derived from how output changes with input levels along a production function.","weight":0.95,"curation_confidence":0.95},{"id":"edge_average_product_marginal_product_and_diminishing_marginal_product_prerequisite_for_malthusian_trap_and_subsistence_equilibrium","source":"average_product_marginal_product_and_diminishing_marginal_product","target":"malthusian_trap_and_subsistence_equilibrium","type":"prerequisite_for","rationale":"The Malthusian trap mechanism depends on population growth lowering average product and income per person, so understanding product measures is needed to explain the feedback cycle stably.","weight":0.85,"curation_confidence":0.86},{"id":"edge_technological_progress_and_the_permanent_technological_revolution_supports_malthusian_trap_and_subsistence_equilibrium","source":"technological_progress_and_the_permanent_technological_revolution","target":"malthusian_trap_and_subsistence_equilibrium","type":"supports","rationale":"Technological progress helps explain the Malthusian model's case where productivity improvements initially raise income per person before population growth returns living standards to subsistence.","weight":0.72,"curation_confidence":0.8},{"id":"edge_technological_progress_and_the_permanent_technological_revolution_prerequisite_for_escape_from_malthusian_stagnation","source":"technological_progress_and_the_permanent_technological_revolution","target":"escape_from_malthusian_stagnation","type":"prerequisite_for","rationale":"Escape from Malthusian stagnation is defined by sustained technological improvement offsetting diminishing average product, so technological progress is central to stable understanding of the escape mechanism.","weight":0.95,"curation_confidence":0.94},{"id":"edge_escape_from_malthusian_stagnation_contrasts_with_malthusian_trap_and_subsistence_equilibrium","source":"escape_from_malthusian_stagnation","target":"malthusian_trap_and_subsistence_equilibrium","type":"contrasts_with","rationale":"The Malthusian trap returns living standards to subsistence after population growth, whereas escape is the contrasting regime in which population and real wages rise together.","weight":0.92,"curation_confidence":0.93},{"id":"edge_general_purpose_technologies_and_the_industrial_revolution_supports_escape_from_malthusian_stagnation","source":"general_purpose_technologies_and_the_industrial_revolution","target":"escape_from_malthusian_stagnation","type":"supports","rationale":"General-purpose technologies and the Industrial Revolution provide a broad technological and organizational transformation that helps explain how sustained production improvements can support escape from stagnation.","weight":0.72,"curation_confidence":0.76},{"id":"edge_feasible_set_feasible_frontier_and_budget_constraint_prerequisite_for_marginal_rate_of_transformation_and_opportunity_cost","source":"feasible_set_feasible_frontier_and_budget_constraint","target":"marginal_rate_of_transformation_and_opportunity_cost","type":"prerequisite_for","rationale":"The marginal rate of transformation is the trade-off along a feasible frontier or budget constraint, so the constraint representation is needed to interpret the MRT as an opportunity cost.","weight":0.9,"curation_confidence":0.92},{"id":"edge_feasible_set_feasible_frontier_and_budget_constraint_contrasts_with_preferences_indifference_curves_and_marginal_rate_of_substitution","source":"feasible_set_feasible_frontier_and_budget_constraint","target":"preferences_indifference_curves_and_marginal_rate_of_substitution","type":"contrasts_with","rationale":"Feasible sets and budget constraints describe available combinations under constraints, while preferences and indifference curves describe rankings and willingness to trade among combinations.","weight":0.82,"curation_confidence":0.88},{"id":"edge_feasible_set_feasible_frontier_and_budget_constraint_prerequisite_for_interior_optimum_where_mrs_equals_mrt","source":"feasible_set_feasible_frontier_and_budget_constraint","target":"interior_optimum_where_mrs_equals_mrt","type":"prerequisite_for","rationale":"An interior constrained optimum is identified on a feasible frontier or budget constraint, so understanding feasible choices and frontiers is required before applying the tangency condition.","weight":0.93,"curation_confidence":0.94},{"id":"edge_preferences_indifference_curves_and_marginal_rate_of_substitution_prerequisite_for_interior_optimum_where_mrs_equals_mrt","source":"preferences_indifference_curves_and_marginal_rate_of_substitution","target":"interior_optimum_where_mrs_equals_mrt","type":"prerequisite_for","rationale":"The interior optimum condition equates MRS with MRT, so understanding preferences, indifference curves, and willingness to trade is required to interpret the preference side of the tangency.","weight":0.96,"curation_confidence":0.96},{"id":"edge_marginal_rate_of_transformation_and_opportunity_cost_prerequisite_for_interior_optimum_where_mrs_equals_mrt","source":"marginal_rate_of_transformation_and_opportunity_cost","target":"interior_optimum_where_mrs_equals_mrt","type":"prerequisite_for","rationale":"The interior optimum condition equates MRS with MRT, so understanding the feasible opportunity-cost trade-off is required to interpret the constraint side of the tangency.","weight":0.96,"curation_confidence":0.96},{"id":"edge_economic_models_and_ceteris_paribus_reasoning_prerequisite_for_income_and_substitution_effects","source":"economic_models_and_ceteris_paribus_reasoning","target":"income_and_substitution_effects","type":"prerequisite_for","rationale":"Income and substitution effects decompose a choice change by holding selected influences constant, which depends on ceteris paribus reasoning about prices, opportunity costs, and utility levels.","weight":0.82,"curation_confidence":0.85},{"id":"edge_feasible_set_feasible_frontier_and_budget_constraint_prerequisite_for_income_and_substitution_effects","source":"feasible_set_feasible_frontier_and_budget_constraint","target":"income_and_substitution_effects","type":"prerequisite_for","rationale":"Income and substitution effects are explained through shifts or changes in budget constraints and attainable combinations, so understanding feasible frontiers is needed to interpret the decomposition.","weight":0.86,"curation_confidence":0.88},{"id":"edge_preferences_indifference_curves_and_marginal_rate_of_substitution_prerequisite_for_income_and_substitution_effects","source":"preferences_indifference_curves_and_marginal_rate_of_substitution","target":"income_and_substitution_effects","type":"prerequisite_for","rationale":"The substitution effect is defined while holding the new utility level fixed, and the decomposition of choice changes requires preference and indifference-curve reasoning.","weight":0.84,"curation_confidence":0.86},{"id":"edge_marginal_rate_of_transformation_and_opportunity_cost_prerequisite_for_income_and_substitution_effects","source":"marginal_rate_of_transformation_and_opportunity_cost","target":"income_and_substitution_effects","type":"prerequisite_for","rationale":"The substitution effect isolates changes caused by altered price or opportunity cost, such as a wage changing the cost of free time, which requires understanding MRT and opportunity cost.","weight":0.85,"curation_confidence":0.88},{"id":"edge_strategic_interaction_and_game_models_prerequisite_for_social_dilemmas_dominant_strategies_and_prisoners_dilemmas","source":"strategic_interaction_and_game_models","target":"social_dilemmas_dominant_strategies_and_prisoners_dilemmas","type":"prerequisite_for","rationale":"Prisoners' dilemmas and dominant-strategy reasoning are game-model concepts that require identifying players, strategies, information, and payoffs in a strategic interaction.","weight":0.94,"curation_confidence":0.95},{"id":"edge_strategic_interaction_and_game_models_prerequisite_for_nash_equilibrium","source":"strategic_interaction_and_game_models","target":"nash_equilibrium","type":"prerequisite_for","rationale":"Nash equilibrium is a strategy profile in a game, so understanding strategic interaction and the components of a game model is required before applying mutual best-response reasoning.","weight":0.95,"curation_confidence":0.96},{"id":"edge_strategic_interaction_and_game_models_prerequisite_for_social_preferences_and_experimental_games","source":"strategic_interaction_and_game_models","target":"social_preferences_and_experimental_games","type":"prerequisite_for","rationale":"Experimental games such as the ultimatum game study behavior by specifying players, rules, strategies, information, and payoffs, which builds on the structure of game models.","weight":0.78,"curation_confidence":0.82},{"id":"edge_public_goods_free_riding_and_cooperation_supports_social_dilemmas_dominant_strategies_and_prisoners_dilemmas","source":"public_goods_free_riding_and_cooperation","target":"social_dilemmas_dominant_strategies_and_prisoners_dilemmas","type":"supports","rationale":"Public-goods free riding illustrates how individually attractive noncontribution can undermine a feasible cooperative outcome, strengthening the explanation of social dilemmas.","weight":0.78,"curation_confidence":0.84},{"id":"edge_social_preferences_and_experimental_games_supports_public_goods_free_riding_and_cooperation","source":"social_preferences_and_experimental_games","target":"public_goods_free_riding_and_cooperation","type":"supports","rationale":"Social preferences such as altruism, fairness, and reciprocity help explain why people may cooperate or contribute in social interactions despite free-riding incentives.","weight":0.74,"curation_confidence":0.8}]}</script>
  <div class="app-shell">

  <script>
  (() => {
    "use strict";

    const packageData = JSON.parse(document.getElementById("review-package").textContent);
    const SUBMISSION_SCHEMA = "knowact.kg_review_submission.v3";
    const storageKey = `knowact:kg-review:${packageData.graph.graph_fingerprint}`;
    const sectionOrder = ["overview", "nodes", "edges", "coverage", "submit"];
    let activeSection = "overview";
    let state = loadState() || createBlankState();

    const nodeOptions = {
      scope_fit: ["in_scope", "boundary", "out_of_scope"],
      granularity: ["appropriate", "too_broad", "too_narrow", "mixed"],
      diagnostic_usefulness: ["adequate", "minor_issue", "major_issue"],
      rubric_quality: ["adequate", "minor_issue", "major_issue"],
      decision: ["accept", "edit", "reject"],
    };
    const edgeOptions = {
      relation_validity: ["valid", "uncertain", "invalid"],
      type_correct: ["yes", "no", "uncertain"],
      replacement_type: ["part_of", "prerequisite_for", "supports", "contrasts_with"],
      direction_correct: ["yes", "no", "not_applicable", "uncertain"],
      provenance_class: ["source_explicit", "source_entailed", "expert_pedagogical_extension", "unsupported"],
      decision: ["accept", "edit", "delete"],
    };

    function esc(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function blankNodeReview() {
      return {
        scope_fit: "", granularity: "",
        diagnostic_usefulness: "", rubric_quality: "", decision: "",
        proposed_change: "", rationale: "",
      };
    }

    function blankEdgeReview() {
      return {
        relation_validity: "", type_correct: "", replacement_type: "",
        direction_correct: "", provenance_class: "", decision: "",
        proposed_change: "", rationale: "",
      };
    }

    function blankCoverageReview() {
      return { task_coverage: "", missing_or_redundant_content: "", rationale: "" };
    }

    function createBlankState() {
      return {
        submissionId: "",
        reviewer: {
          reviewer_id: "",
          role: "",
          experience_band: "",
          introduction: "",
        },
        nodeReviews: Object.fromEntries(packageData.nodes.map(node => [node.id, blankNodeReview()])),
        edgeReviews: Object.fromEntries(packageData.edges.map(edge => [edge.id, blankEdgeReview()])),
        coverageReviews: Object.fromEntries(
          packageData.scope.representative_tasks.map((_, index) => [`task_${String(index + 1).padStart(3, "0")}`, blankCoverageReview()])
        ),
        overall: { decision: "", rationale: "" },
      };
    }

    function loadState() {
      try {
        const value = localStorage.getItem(storageKey);
        if (!value) return null;
        const parsed = JSON.parse(value);
        if (parsed.graphFingerprint !== packageData.graph.graph_fingerprint) return null;
        return parsed.state;
      } catch {
        return null;
      }
    }

    function saveState() {
      localStorage.setItem(storageKey, JSON.stringify({
        graphFingerprint: packageData.graph.graph_fingerprint,
        state,
      }));
      document.getElementById("save-state").textContent = `已在本机保存 · ${new Date().toLocaleTimeString()}`;
      updateProgress();
    }

    function ensureCompleteShape() {
      const reviewer = state.reviewer || {};
      state.reviewer = {
        reviewer_id: reviewer.reviewer_id || "",
        role: reviewer.role || "",
        experience_band: reviewer.experience_band || "",
        introduction: reviewer.introduction || "",
      };
      for (const node of packageData.nodes) {
        state.nodeReviews[node.id] ||= blankNodeReview();
      }
      for (const edge of packageData.edges) {
        state.edgeReviews[edge.id] ||= blankEdgeReview();
      }
      packageData.scope.representative_tasks.forEach((_, index) => {
        const id = `task_${String(index + 1).padStart(3, "0")}`;
        state.coverageReviews[id] ||= blankCoverageReview();
      });
      state.overall ||= { decision: "", rationale: "" };
    }

    function selectField(label, scope, id, field, value, options, hint = "", allowBlank = true) {
      const optionHtml = [
        allowBlank ? '<option value="">请选择 / Select</option>' : "",
        ...options.map(option => `<option value="${esc(option)}"${value === option ? " selected" : ""}>${esc(option)}</option>`),
      ].join("");
      return `<div class="field">
        <label class="required">${esc(label)}</label>
        <select data-scope="${esc(scope)}" data-id="${esc(id)}" data-field="${esc(field)}">${optionHtml}</select>
        ${hint ? `<span class="hint">${esc(hint)}</span>` : ""}
      </div>`;
    }

    function textField(label, scope, id, field, value, options = {}) {
      const full = options.full ? " full" : "";
      const required = options.required ? " required" : "";
      const hint = options.hint ? `<span class="hint">${esc(options.hint)}</span>` : "";
      const type = options.type || "textarea";
      const min = options.min !== undefined ? ` min="${esc(options.min)}"` : "";
      const step = options.step !== undefined ? ` step="${esc(options.step)}"` : "";
      if (type === "textarea") {
        return `<div class="field${full}">
          <label class="${required}">${esc(label)}</label>
          <textarea class="${options.compact ? "compact-textarea" : ""}" data-scope="${esc(scope)}" data-id="${esc(id)}" data-field="${esc(field)}">${esc(value)}</textarea>
          ${hint}
        </div>`;
      }
      return `<div class="field${full}">
        <label class="${required}">${esc(label)}</label>
        <input type="${esc(type)}" value="${esc(value)}" data-scope="${esc(scope)}" data-id="${esc(id)}" data-field="${esc(field)}"${min}${step}>
        ${hint}
      </div>`;
    }

    function renderLabelGuide(title, intro, items) {
      return `<aside class="panel card label-guide">
        <h3>${esc(title)}</h3>
        <p>${esc(intro)}</p>
        <div class="label-guide-grid">
          ${items.map(item => `<div class="label-guide-item">
            <strong>${esc(item.label)} <code>${esc(item.field)}</code></strong>
            <p>${esc(item.description)}</p>
          </div>`).join("")}
        </div>
      </aside>`;
    }

    function nodeIsComplete(review) {
      const base = Object.keys(nodeOptions).every(field => Boolean(review[field]));
      if (!base) return false;
      if (["edit", "reject"].includes(review.decision) && !review.rationale.trim()) return false;
      return review.decision !== "edit" || Boolean(review.proposed_change.trim());
    }

    function edgeIsComplete(review, edge) {
      const required = ["relation_validity", "type_correct", "direction_correct", "provenance_class", "decision"];
      if (!required.every(field => Boolean(review[field]))) return false;
      if (review.type_correct === "no" && !review.replacement_type) return false;
      if (edge.type === "contrasts_with" && review.direction_correct !== "not_applicable") return false;
      if (edge.type !== "contrasts_with" && review.direction_correct === "not_applicable") return false;
      if (["edit", "delete"].includes(review.decision) && !review.rationale.trim()) return false;
      return review.decision !== "edit" || Boolean(review.proposed_change.trim());
    }

    function coverageIsComplete(review) {
      if (!review.task_coverage) return false;
      if (review.task_coverage !== "sufficient") {
        return Boolean(review.rationale.trim() && review.missing_or_redundant_content.trim());
      }
      return true;
    }

    function metadataIssues() {
      const reviewer = state.reviewer;
      return ["reviewer_id", "role", "experience_band", "introduction"]
        .filter(field => !String(reviewer[field] || "").trim())
        .map(field => `评审者字段 ${field} 尚未填写。`);
    }

    function validationIssues() {
      const issues = metadataIssues().map(message => ({ section: "overview", message }));
      packageData.nodes.forEach((node, index) => {
        if (!nodeIsComplete(state.nodeReviews[node.id])) {
          issues.push({ section: "nodes", message: `节点 ${index + 1} (${node.id}) 未完成或条件字段不完整。` });
        }
      });
      packageData.edges.forEach((edge, index) => {
        if (!edgeIsComplete(state.edgeReviews[edge.id], edge)) {
          issues.push({ section: "edges", message: `边 ${index + 1} (${edge.id}) 未完成或条件字段不完整。` });
        }
      });
      packageData.scope.representative_tasks.forEach((_, index) => {
        const id = `task_${String(index + 1).padStart(3, "0")}`;
        if (!coverageIsComplete(state.coverageReviews[id])) {
          issues.push({ section: "coverage", message: `代表性任务 ${index + 1} 尚未完成；partial/insufficient 还需填写内容与理由。` });
        }
      });
      if (!state.overall.decision) {
        issues.push({ section: "coverage", message: "尚未填写总体图谱决定。" });
      } else if (state.overall.decision !== "approve" && !state.overall.rationale.trim()) {
        issues.push({ section: "coverage", message: "approve_after_edits / do_not_approve 必须填写总体理由。" });
      }
      return issues;
    }

    function updateProgress() {
      ensureCompleteShape();
      const nodeDone = packageData.nodes.filter(node => nodeIsComplete(state.nodeReviews[node.id])).length;
      const edgeDone = packageData.edges.filter(edge => edgeIsComplete(state.edgeReviews[edge.id], edge)).length;
      const coverageDone = packageData.scope.representative_tasks.filter((_, index) => {
        const id = `task_${String(index + 1).padStart(3, "0")}`;
        return coverageIsComplete(state.coverageReviews[id]);
      }).length;
      const overviewDone = metadataIssues().length === 0 ? 1 : 0;
      const overallDone = state.overall.decision ? 1 : 0;
      document.getElementById("nav-overview-count").textContent = `${overviewDone}/1`;
      document.getElementById("nav-nodes-count").textContent = `${nodeDone}/${packageData.nodes.length}`;
      document.getElementById("nav-edges-count").textContent = `${edgeDone}/${packageData.edges.length}`;
      document.getElementById("nav-coverage-count").textContent = `${coverageDone + overallDone}/${packageData.scope.representative_tasks.length + 1}`;
      document.getElementById("nav-submit-count").textContent = validationIssues().length ? "待校验" : "可导出";
      document.querySelectorAll("[data-progress-kind]").forEach(element => {
        const kind = element.dataset.progressKind;
        if (kind === "nodes") element.textContent = `${nodeDone} / ${packageData.nodes.length} 完成`;
        if (kind === "edges") element.textContent = `${edgeDone} / ${packageData.edges.length} 完成`;
        if (kind === "coverage") element.textContent = `${coverageDone} / ${packageData.scope.representative_tasks.length} 完成`;
      });
    }

      document.getElementById("binding-strip").innerHTML = `

      document.getElementById("section-submit").innerHTML = `

          <h3>数据流</h3>
          <div class="callout">
            本页不会生成 CSV。两位评审者分别导出 <code>knowact.kg_review_submission.v3</code> JSON，
            再把两份完整 JSON 导入 <code>compare_and_confirm.html</code> 进行一致性计算与仲裁确认。
          </div>
          <div id="validation-errors" class="error-box ${issues.length ? "visible" : ""}">
            <strong>${issues.length ? "完整提交尚未通过校验：" : ""}</strong>
            ${issues.length ? `<ul>${issues.slice(0, 20).map(issue => `<li>${esc(issue.message)}</li>`).join("")}${issues.length > 20 ? `<li>另有 ${issues.length - 20} 项……</li>` : ""}</ul>` : ""}
          </div>
          ${issues.length ? "" : '<div class="success-box"><strong>完整性校验通过。</strong> 导出仍是 candidate graph 的独立专家判断，不等于 promotion。</div>'}
          <div class="actions">
            <button id="export-draft">导出草稿 JSON</button>
            <button class="primary" id="export-complete"${issues.length ? " disabled" : ""}>提交并导出完整 JSON</button>
            <button id="import-json">导入本图谱 JSON 草稿</button>
            <input class="file-input" id="import-file" type="file" accept="application/json,.json">
            <button class="danger" id="reset-review">清空本机草稿</button>
          </div>
        </div>
        <div class="panel card">
          <h3>冻结输入</h3>
          <div class="hash-list">
            package: ${esc(packageData.graph.review_package_id)}<br>
            fingerprint: ${esc(packageData.graph.graph_fingerprint)}<br>
            schema: ${SUBMISSION_SCHEMA}
          </div>
        </div>`;

      document.getElementById("export-draft").addEventListener("click", () => exportSubmission("draft"));
      document.getElementById("export-complete").addEventListener("click", () => exportSubmission("complete"));
      document.getElementById("import-json").addEventListener("click", () => document.getElementById("import-file").click());
      document.getElementById("import-file").addEventListener("change", importSubmission);
      document.getElementById("reset-review").addEventListener("click", resetReview);
    }

    function renderSection(section) {
      if (section === "overview") renderOverview();
      if (section === "nodes") renderNodes();
      if (section === "edges") renderEdges();
      if (section === "coverage") renderCoverage();
      if (section === "submit") renderSubmit();
      bindFormEvents();
      updateProgress();
    }

    function switchSection(section) {
      activeSection = section;
      document.querySelectorAll(".section").forEach(element => element.classList.toggle("active", element.id === `section-${section}`));
      document.querySelectorAll(".nav-button").forEach(element => element.classList.toggle("active", element.dataset.sectionTarget === section));
      renderSection(section);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function bindFormEvents() {
      document.querySelectorAll("[data-scope][data-field]").forEach(element => {
        const eventName = element.tagName === "SELECT" || element.type === "checkbox" ? "change" : "input";
        element.addEventListener(eventName, event => {
          const input = event.currentTarget;
          const value = input.type === "checkbox" ? input.checked : input.value;
          const { scope, id, field } = input.dataset;
          if (scope === "reviewer") state.reviewer[field] = value;
          if (scope === "node") state.nodeReviews[id][field] = value;
          if (scope === "edge") state.edgeReviews[id][field] = value;
          if (scope === "coverage") state.coverageReviews[id][field] = value;
          if (scope === "overall") state.overall[field] = value;
          saveState();
          if (input.tagName === "SELECT") renderSection(activeSection);
        });
      });
    }

    function buildSubmission(status) {
      if (!state.submissionId) {
        const randomPart = globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        state.submissionId = `kg-review-${randomPart}`;
        saveState();
      }
      const issues = validationIssues();
      return {
        schema_version: SUBMISSION_SCHEMA,
        status,
        submission_id: state.submissionId,
        exported_at: new Date().toISOString(),
        graph: structuredClone(packageData.graph),
        reviewer: {
          reviewer_id: state.reviewer.reviewer_id.trim(),
          role: state.reviewer.role.trim(),
          experience_band: state.reviewer.experience_band,
          introduction: state.reviewer.introduction.trim(),
        },
        node_reviews: packageData.nodes.map((node, index) => ({
          item_order: index + 1,
          node_id: node.id,
          ...structuredClone(state.nodeReviews[node.id]),
        })),
        edge_reviews: packageData.edges.map((edge, index) => ({
          item_order: index + 1,
          edge_id: edge.id,
          ...structuredClone(state.edgeReviews[edge.id]),
        })),
        coverage_reviews: packageData.scope.representative_tasks.map((task, index) => {
          const taskId = `task_${String(index + 1).padStart(3, "0")}`;
          return {
            item_order: index + 1,
            task_id: taskId,
            task_text: task,
            ...structuredClone(state.coverageReviews[taskId]),
          };
        }),
        overall_graph_review: structuredClone(state.overall),
        validation: {
          complete: issues.length === 0,
          issue_count: issues.length,
          issues: issues.map(issue => ({ section: issue.section, message: issue.message })),
        },
      };
    }

    function downloadJson(documentValue, filename) {
      const blob = new Blob([JSON.stringify(documentValue, null, 2) + "\n"], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function safeFilename(value) {
      return String(value || "anonymous").replace(/[^A-Za-z0-9_-]+/g, "_").replace(/^_+|_+$/g, "") || "anonymous";
    }

    function exportSubmission(status) {
      const submission = buildSubmission(status);
      if (status === "complete" && !submission.validation.complete) {
        switchSection("submit");
        return;
      }
      const filename = `${packageData.graph.domain.toLowerCase()}_kg_review_${safeFilename(submission.reviewer.reviewer_id)}_${status}.json`;
      downloadJson(submission, filename);
    }

    function stateFromSubmission(documentValue) {
      const next = createBlankState();
      next.submissionId = documentValue.submission_id || "";
      const reviewer = documentValue.reviewer || {};
      next.reviewer = {
        reviewer_id: reviewer.reviewer_id || "",
        role: reviewer.role || "",
        experience_band: reviewer.experience_band || "",
        introduction: reviewer.introduction || "",
      };
      for (const review of documentValue.node_reviews || []) {
        if (next.nodeReviews[review.node_id]) {
          next.nodeReviews[review.node_id] = { ...blankNodeReview(), ...review };
        }
      }
      for (const review of documentValue.edge_reviews || []) {
        if (next.edgeReviews[review.edge_id]) {
          next.edgeReviews[review.edge_id] = { ...blankEdgeReview(), ...review };
        }
      }
      for (const review of documentValue.coverage_reviews || []) {
        if (next.coverageReviews[review.task_id]) {
          next.coverageReviews[review.task_id] = { ...blankCoverageReview(), ...review };
        }
      }
      next.overall = { decision: "", rationale: "", ...(documentValue.overall_graph_review || {}) };
      return next;
    }

    async function importSubmission(event) {
      const file = event.currentTarget.files?.[0];
      event.currentTarget.value = "";
      if (!file) return;
      try {
        const documentValue = JSON.parse(await file.text());
        if (documentValue.schema_version !== SUBMISSION_SCHEMA) throw new Error("schema_version 不匹配");
        if (documentValue.graph?.graph_fingerprint !== packageData.graph.graph_fingerprint) {
          throw new Error("JSON 绑定的是另一张图谱或另一版 candidate artifacts");
        }
        state = stateFromSubmission(documentValue);
        saveState();
        renderSection(activeSection);
        alert("JSON 已导入并恢复为本机草稿。");
      } catch (error) {
        alert(`无法导入：${error.message}`);
      }
    }

    function resetReview() {
      if (!confirm("确定清空此图谱在本浏览器中的全部评审草稿吗？请先导出需要保留的 JSON。")) return;
      localStorage.removeItem(storageKey);
      state = createBlankState();
      renderSection(activeSection);
    }

    document.querySelectorAll("[data-section-target]").forEach(button => {
      button.addEventListener("click", () => switchSection(button.dataset.sectionTarget));
    });

    ensureCompleteShape();
    renderHeader();
    sectionOrder.forEach(renderSection);
    switchSection("overview");
  })();
  </script>
</body>
</html>
