<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Economy Candidate KG Expert Review</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211b;
      --muted: #637068;
      --paper: #f4f1e9;
      --panel: #fffdf7;
      --line: #d9d4c7;
      --accent: #176b51;
      --accent-soft: #e4f0e9;
      --warn: #9a5a14;
      --danger: #a13732;
      --shadow: 0 12px 36px rgba(38, 47, 40, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 15px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button, select, input, textarea { border-radius: 8px; }
    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
      padding: 9px 13px;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: white; }
    button.danger { color: var(--danger); }
    button:disabled { cursor: not-allowed; opacity: 0.52; }

    .app-shell { min-height: 100vh; }
    .masthead {
      background: #12251d;
      color: white;
      padding: 28px max(24px, calc((100vw - 1440px) / 2));
    }
    .eyebrow {
      color: #9ed7c0;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      margin: 0 0 7px;
      text-transform: uppercase;
    }
    h1 { font-size: clamp(24px, 4vw, 40px); line-height: 1.13; margin: 0; }
    .subtitle { color: #c8d5cf; margin: 10px 0 0; max-width: 900px; }
    .binding-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 18px;
    }
    .binding-pill {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 999px;
      font-size: 12px;
      padding: 6px 10px;
    }

    .layout {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      gap: 22px;
      margin: 0 auto;
      max-width: 1440px;
      padding: 22px;
    }
    .sidebar {
      align-self: start;
      position: sticky;
      top: 16px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }
    .nav-panel { overflow: hidden; }
    .nav-title {
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      padding: 14px 16px 10px;
      text-transform: uppercase;
    }
    .nav-button {
      align-items: center;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      display: flex;
      justify-content: space-between;
      padding: 13px 16px;
      text-align: left;
      width: 100%;
    }
    .nav-button.active { background: var(--accent-soft); color: var(--accent); font-weight: 750; }
    .count {
      background: #ece9df;
      border-radius: 999px;
      color: var(--muted);
      font-size: 11px;
      padding: 2px 7px;
    }
    .nav-button.active .count { background: white; color: var(--accent); }
    .save-state {
      color: var(--muted);
      font-size: 12px;
      padding: 12px 16px;
    }

    .content { min-width: 0; }
    .section { display: none; }
    .section.active { display: block; }
    .section-header {
      align-items: start;
      display: flex;
      justify-content: space-between;
      margin: 5px 0 16px;
    }
    .section-header h2 { font-size: 25px; line-height: 1.25; margin: 0 0 4px; }
    .section-header p { color: var(--muted); margin: 0; }
    .progress-badge {
      background: var(--accent-soft);
      border-radius: 999px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
      padding: 6px 10px;
      white-space: nowrap;
    }

    .card { margin-bottom: 15px; padding: 20px; }
    .card-title { align-items: start; display: flex; gap: 12px; justify-content: space-between; }
    .card h3 { font-size: 19px; line-height: 1.3; margin: 0; }
    .label-guide {
      background: #f8f6ef;
      border-color: #c9c4b7;
    }
    .label-guide > p { color: var(--muted); margin: 5px 0 14px; }
    .label-guide-grid {
      display: grid;
      gap: 9px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .label-guide-item {
      background: white;
      border: 1px solid #dfdbcf;
      border-radius: 9px;
      padding: 10px 12px;
    }
    .label-guide-item strong { display: block; font-size: 13px; margin-bottom: 3px; }
    .label-guide-item p { color: var(--muted); font-size: 12px; margin: 0; }
    .label-guide-item code { color: var(--accent); font-size: 11px; }
    .identifier {
      color: var(--muted);
      font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow-wrap: anywhere;
    }
    .item-number {
      background: #ece9df;
      border-radius: 7px;
      color: var(--muted);
      flex: 0 0 auto;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 7px;
    }
    .item-status {
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
    }
    .item-status.done { background: var(--accent-soft); color: var(--accent); }
    .item-status.todo { background: #f7e9d3; color: var(--warn); }
    details {
      border-top: 1px solid var(--line);
      margin-top: 15px;
      padding-top: 12px;
    }
    summary { color: var(--accent); cursor: pointer; font-weight: 750; }
    .detail-block { margin-top: 13px; }
    .detail-block h4 {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.08em;
      margin: 0 0 5px;
      text-transform: uppercase;
    }
    .detail-block p { margin: 0; white-space: pre-wrap; }
    .locator, .rubric-row {
      background: #f4f1e8;
      border-left: 3px solid #a9b9b1;
      margin: 7px 0;
      padding: 9px 11px;
    }
    .rubric-row strong { color: var(--accent); display: inline-block; min-width: 30px; }
    ul { margin: 7px 0; padding-left: 20px; }

    .review-grid {
      border-top: 1px solid var(--line);
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-top: 16px;
      padding-top: 16px;
    }
    .field { min-width: 0; }
    .field.full { grid-column: 1 / -1; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 5px;
    }
    .required::after { color: var(--danger); content: " *"; }
    .hint { color: var(--muted); display: block; font-size: 11px; margin-top: 4px; }
    input, select, textarea {
      background: white;
      border: 1px solid #bbb7aa;
      color: var(--ink);
      padding: 9px 10px;
      width: 100%;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(23, 107, 81, 0.12);
      outline: none;
    }
    textarea { min-height: 84px; resize: vertical; }
    .compact-textarea { min-height: 62px; }

    .scope-summary { font-size: 16px; line-height: 1.8; margin: 8px 0 0; }
    .callout {
      background: #fff7e8;
      border: 1px solid #ecd1a6;
      border-radius: 10px;
      color: #664216;
      margin: 14px 0;
      padding: 12px 14px;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .file-input { display: none; }
    .error-box {
      background: #fff0ef;
      border: 1px solid #e0aaa7;
      border-radius: 10px;
      color: #75211d;
      display: none;
      margin: 14px 0;
      padding: 13px 15px;
    }
    .error-box.visible { display: block; }
    .success-box {
      background: var(--accent-soft);
      border: 1px solid #a7cbbb;
      border-radius: 10px;
      color: #154f3e;
      margin: 14px 0;
      padding: 13px 15px;
    }
    .checkbox-line { align-items: flex-start; display: flex; gap: 9px; }
    .checkbox-line input { margin-top: 4px; width: auto; }
    .hash-list {
      background: #f0ede5;
      border-radius: 9px;
      font: 11px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow-wrap: anywhere;
      padding: 11px 13px;
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; padding: 14px; }
      .sidebar { position: static; }
      .nav-panel { display: grid; grid-template-columns: repeat(3, 1fr); }
      .nav-title, .save-state { grid-column: 1 / -1; }
      .nav-button { border-right: 1px solid var(--line); }
      .review-grid, .label-guide-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
    }
    @media print {
      .sidebar, .actions { display: none !important; }
      .layout { display: block; max-width: none; padding: 0; }
      .section { display: block !important; }
      .panel { box-shadow: none; break-inside: avoid; }
    }
  </style>
</head>

  <script id="review-package" type="application/json">{"schema_version":"knowact.kg_review_package.v1","review_input_kind":"candidate_graph","graph":{"domain":"Economy","candidate_run_id":"kg_metadata_v1_economy_20260730_contract_retry_v6","review_package_id":"Economy:kg_metadata_v1_economy_20260730_contract_retry_v6","graph_fingerprint":"sha256:b95fdf3c34c8e05bfc30a50bcf643404541f25e5a1dd6d4aabb69f5f1659e961","node_count":22,"edge_count":20,"representative_task_count":50,"artifact_binding":{"domain":"Economy","candidate_run_id":"kg_metadata_v1_economy_20260730_contract_retry_v6","candidate_nodes":{"repository_path":"benchmark/domains/Economy/candidate_graphs/kg_metadata_v1_economy_20260730_contract_retry_v6/candidate_nodes.json","sha256":"fca37c522b2d3e924b3cfd0636ff44c8f2abaf5a4f29900f5237037aff328f5d"},"candidate_edges":{"repository_path":"benchmark/domains/Economy/candidate_graphs/kg_metadata_v1_economy_20260730_contract_retry_v6/candidate_edges.json","sha256":"1ecee19a42bc690ca0dbb53e1fb79a9180141c0a02ee0535b1495d1a9d438998"},"source_metadata":{"repository_path":"storage/source_materials/Economy/metadata.json","sha256":"2890ed14c5f75fcc33046cbd456befed9da1c707610b62dec055d70aa8caf45b"},"source_content_sha256":"cf7f44613e50529d0293bd3511024ac14264612e99766d3f7aca5e6fc0282cae"}},"source":{"source_id":"Economy","title":"The Economy: Introductory Economics Foundations","citation":"CORE Econ, The Economy 1.0, Units 1-4.","storage_uri":"storage/source_materials/Economy/experiment_scope.md","content_sha256":"cf7f44613e50529d0293bd3511024ac14264612e99766d3f7aca5e6fc0282cae"},"scope":{"aspect_name":"Introductory economics foundations","aspect_description":"Diagnosable concepts from The Economy Units 1-4: capitalism and long-run growth, technology and population, scarcity and individual choice, and strategic social interactions.","review_scope_summary":"这张图谱聚焦《The Economy》前四单元的入门经济学基础，覆盖资本主义制度与长期增长、技术进步和工业革命、人口与马尔萨斯停滞、稀缺条件下的可行集合与个体选择，以及策略互动、纳什均衡、公共品和社会偏好等内容。评审重点是这些概念是否被组织成适合诊断学习者理解水平的知识单元，并由合理的先修、支持、组成或对比关系连接起来。","representative_tasks":["Use a long-run GDP-per-capita graph to explain the hockey-stick pattern and identify what the graph does not prove.","Distinguish total GDP, GDP per capita, nominal income, and real income when comparing living standards.","Explain how private property, markets, and firms jointly characterize a capitalist economic system.","Compare markets and firms as alternative ways of coordinating specialization and production.","Explain how specialization and technological progress can raise labour productivity and living standards.","Interpret income-distribution data that show inequality both between countries and within countries.","Assess whether a correlation between capitalism and growth is sufficient evidence of causation.","Explain why environmental damage and inequality can coexist with rising average GDP per capita.","Reconstruct the feedback mechanism that produces a Malthusian trap.","Explain how sustained technological progress can allow income growth to outpace population growth.","Use relative wages and energy prices to predict whether a cost-saving technology will be adopted.","Distinguish a production function from a single observed production outcome.","Calculate and interpret average product and marginal product from a production schedule.","Identify diminishing marginal product and explain its relevance to production choices.","Use an isocost line to compare the costs of alternative production techniques.","Explain why an innovator may earn temporary economic rents after adopting a superior technology.","Explain how competition and diffusion can erode an innovator's temporary rents.","Distinguish a general-purpose technology from a narrow process improvement.","Evaluate competing explanations for why the Industrial Revolution began in Britain.","Identify which assumptions in a simplified technological-change model are doing explanatory work.","Construct a feasible set for a choice involving limited time and multiple objectives.","Identify the opportunity cost of additional consumption, study, leisure, or work in a concrete scenario.","Use an indifference curve to compare bundles without treating utility as directly measurable happiness.","Interpret the marginal rate of substitution as willingness to trade one objective for another.","Use a concave production function to explain why additional study or work may have diminishing returns.","Distinguish feasible, infeasible, dominated, and efficient choices on a constrained-choice diagram.","Find a preferred feasible choice by combining a feasible frontier with indifference curves.","Explain why a tangency condition characterizes an interior optimum and when it may fail.","Separate the income effect and substitution effect of an increase in the wage rate.","Explain why higher wages need not cause every person to work more hours.","Use ceteris paribus reasoning to evaluate a claim about study time and academic performance.","Identify omitted variables that could confound an observed relationship between effort and outcomes.","Compare average and marginal quantities and explain why they can move in different directions.","Explain scarcity as a constraint on choice rather than as a synonym for poverty.","Identify self-interest, altruism, reciprocity, and inequality aversion in a strategic interaction.","Represent a two-player interaction with actions, payoffs, and outcomes.","Determine whether a strategy is dominant by comparing payoffs across the other player's possible actions.","Find a Nash equilibrium and explain why it need not maximize joint wellbeing.","Explain the conflict between individual incentives and collective outcomes in a prisoner's dilemma.","Diagnose free riding in a public-goods game and identify the payoff structure that sustains it.","Predict how repeated interaction can change incentives for cooperation.","Explain how reciprocity and credible punishment may support cooperative outcomes.","Distinguish altruistic preferences from strategic cooperation motivated by future rewards.","Use inequality aversion to explain behavior that a purely self-interested model cannot explain.","Predict how changing a game's rules or payoffs can change its equilibrium.","Distinguish a coordination problem from a social dilemma using payoff comparisons.","Interpret experimental-game evidence without assuming that one observed choice reveals a fixed personality type.","Explain how institutions can alter incentives while preferences remain unchanged.","Design a diagnostic comparison that separates misunderstanding of Nash equilibrium from disagreement about fairness.","Connect capitalism, technological change, constrained choice, and social interaction without collapsing them into one causal claim."],"excluded_topics":["Units 5 and later of The Economy","Detailed firm governance and employment contracts","Supply-and-demand equilibrium and price-taking markets","Credit, banking, money, inflation, unemployment, and fiscal policy","International trade and macroeconomic stabilization","Advanced welfare economics and formal social-choice theory","Econometric estimation beyond qualitative ceteris paribus reasoning","Calculus-based optimization proofs","Policy prescriptions not developed in Units 1-4","Historical facts that do not support a reusable economic concept"],"target_node_count":20,"max_node_count":24},"nodes":[{"id":"gdp_based_income_comparisons","name":"GDP-Based Income Comparisons","type":"concept","definition":"GDP-based income comparisons use GDP per capita as average output or income per person, distinguish nominal from real GDP over time, and use purchasing power parity to compare purchasing power across countries.","source_locators":[{"source_id":"Economy","locator":"Unit 1, Section 1.2 Measuring income and living standards","note":"Defines GDP per capita and cautions against treating it as full wellbeing."},{"source_id":"Economy","locator":"Unit 1, Section 1.2, Einstein: Comparing income at different times, and across different countries","note":"Distinguishes nominal GDP from real GDP."},{"source_id":"Economy","locator":"Unit 1, Section 1.2, Einstein: Taking account of price differences among countries","note":"Explains PPP as a correction for price-level and currency differences."}],"diagnostic_goal":"Diagnose whether the learner can use GDP per capita appropriately for income and living-standard comparisons, distinguish nominal from real GDP over time, and explain why purchasing power parity is needed for cross-country comparisons.","levels":{"L0":"Cannot identify GDP per capita as an average per-person measure and may treat any GDP number, money income, prices, or wellbeing measure as interchangeable.","L1":"Can recall terms such as GDP per capita, nominal GDP, real GDP, and purchasing power parity, but gives memorized definitions without reliably distinguishing average output or income, inflation correction, and cross-country purchasing power.","L2":"Can explain that GDP per capita is average income or output per person and that real GDP adjusts for price changes, but may still overstate GDP per capita as typical disposable income or overall wellbeing and only vaguely understands PPP.","L3":"Can distinguish GDP per capita from broader wellbeing, nominal GDP from real GDP when prices change, and PPP comparisons from simple currency or market-exchange-rate comparisons; recognizes common boundary errors such as confusing inflation with increased output.","L4":"Can apply the distinctions to new comparisons, such as deciding whether a nominal GDP increase reflects real output growth, or why two countries' incomes should be compared using common prices to assess purchasing power.","L5":"Can critically evaluate GDP-based income comparisons, explain their usefulness and limits, construct examples where nominal, real, and PPP comparisons diverge, and teach why GDP per capita is a broad indicator rather than a complete measure of living standards."},"diagnostic_signals":["Correctly identifies GDP per capita as an average per-person output or income measure rather than total national income alone.","Notes that GDP per capita is useful for broad living-standard comparisons but is not the same as typical disposable income or overall wellbeing.","Explains that real GDP corrects nominal GDP for price changes so inflation is not mistaken for more output.","Recognizes that if nominal GDP rises only because prices rise, real GDP may be unchanged.","Explains PPP as using a common set of prices to compare what incomes can buy across countries.","Incorrectly treats exchange-rate conversion, nominal GDP, real GDP, and PPP-adjusted income as equivalent."],"simulator_behavior":"Answers should reveal whether the learner separates average income, inflation adjustment, and cross-country purchasing-power adjustment, and whether they avoid treating GDP per capita as a complete measure of wellbeing."},{"id":"capitalist_institutions_private_property_markets_and_firms","name":"Capitalist Institutions: Private Property, Markets, and Firms","type":"concept","definition":"Capitalism is an economic system characterized by private property, markets, and firms, where markets coordinate voluntary reciprocal exchange and firms organize production under owners who hire and direct employees to sell output for profit.","source_locators":[{"source_id":"Economy","locator":"Unit 1, Section 1.6 Capitalism defined: Private property, markets, and firms","note":"Defines capitalism by its central institutions."},{"source_id":"Economy","locator":"Unit 1, Section 1.6 Capitalism defined: Markets","note":"Defines markets as voluntary and reciprocal transfers."},{"source_id":"Economy","locator":"Unit 1, Section 1.6 Capitalism defined: Firm","note":"Lists defining characteristics of firms."}],"diagnostic_goal":"Diagnose whether the learner understands capitalism as the combination of private property, markets, and firms, including how markets and firms differ as coordinating institutions.","levels":{"L0":"Does not recognize capitalism in terms of private property, markets, and firms, and may describe it only as money, greed, government absence, or any form of trade.","L1":"Can recall that capitalism involves private property, markets, and firms, but cannot explain why all three matter or how markets and firms are distinct.","L2":"Can give a basic explanation that markets involve buying and selling and firms produce for profit, but has unclear boundaries between voluntary exchange, gifts, theft, commands, and employment inside firms.","L3":"Can explain capitalism as a system combining private property, voluntary reciprocal market exchange, and firms in which owners hire and direct employees to produce output for sale for profit; can contrast markets with gifts, theft, and commands.","L4":"Can apply the institutional distinctions to classify examples, such as identifying whether a transfer is a market exchange or whether production is organized within a firm rather than through separate market trades.","L5":"Can analyze and teach how private property, markets, and firms jointly define capitalism, generate examples and counterexamples, and critique oversimplified definitions that reduce capitalism to one institution alone."},"diagnostic_signals":["Names private property, markets, and firms as the central institutions rather than relying on only one feature.","Describes markets as voluntary and reciprocal transfers, not gifts, theft, or commands.","Explains that firms organize production through ownership of capital goods, employment, direction of workers, and sale of output for profit.","Distinguishes exchange between market participants from direction within a firm.","Avoids defining capitalism solely as profit seeking, money use, free markets, or absence of government.","Can classify borderline cases using the presence or absence of private property, voluntary reciprocal exchange, and firm organization."],"simulator_behavior":"Answers should show whether the learner can define capitalism institutionally and separate market exchange from firm-based production without importing user-specific judgments or policy preferences."},{"id":"specialization_and_comparative_advantage","name":"Specialization and Comparative Advantage","type":"concept","definition":"Specialization raises productivity when people focus on limited activities, and comparative advantage explains how trade can benefit producers even when one producer has an absolute advantage in all goods.","source_locators":[{"source_id":"Economy","locator":"Unit 1, Section 1.8 The gains from specialization","note":"Links division of labour to learning, ability differences, scale, and comparative advantage."}],"diagnostic_goal":"Diagnose whether the learner understands how specialization can raise productivity and why comparative advantage allows mutual gains from trade even when absolute advantages differ.","levels":{"L0":"Does not recognize specialization or comparative advantage and may think trade can benefit only the producer who is better at producing everything.","L1":"Can repeat terms such as specialization, division of labour, productivity, or comparative advantage, but cannot explain the source of gains or the difference from absolute advantage.","L2":"Can explain that focusing on limited activities can improve productivity, but gives only a simple account and may still believe trade requires each producer to have an absolute advantage in something.","L3":"Can connect specialization to learning, differences in abilities, and economies of scale, and can explain that comparative advantage can make specialization and trade beneficial even when one producer has an absolute advantage in all goods.","L4":"Can apply comparative-advantage reasoning to new producer or country examples, identifying mutually beneficial specialization and trade possibilities despite absolute-productivity differences.","L5":"Can construct and critique comparative-advantage examples, explain the mechanism of mutual gains clearly, and distinguish productivity gains from specialization from gains due to relative rather than absolute advantage."},"diagnostic_signals":["Explains that specialization can raise productivity through learning, differing abilities, or economies of scale.","Distinguishes absolute advantage from comparative advantage.","Recognizes that all producers can benefit by specializing and trading goods even if one is absolutely better at producing all goods.","Identifies that the relevant comparison is relative advantage or opportunity cost, not simply who produces more of everything.","Incorrectly claims that trade benefits only the more productive producer or only occurs when each side is best at a different good.","Can generate or interpret a simple specialization-and-trade scenario without confusing total productivity with comparative advantage."],"simulator_behavior":"Answers should reveal whether the learner attributes gains to specialization mechanisms and comparative advantage, and whether they avoid the misconception that absolute advantage in all goods rules out mutual gains from trade."},{"id":"technological_progress_and_the_permanent_technological_revolution","name":"Technological Progress and the Permanent Technological Revolution","type":"concept","definition":"Technological progress is a change in production technology that reduces the resources needed for a given output; the permanent technological revolution is repeated, generation-after-generation improvement in production methods.","source_locators":[{"source_id":"Economy","locator":"Unit 1, Section 1.4 The permanent technological revolution","note":"Defines technology and links sustained innovation to labour productivity."}],"diagnostic_goal":"Diagnose whether the learner understands technological progress as reducing the resources needed for a given output and understands the permanent technological revolution as repeated improvement in production methods linked to sustained productivity and living-standard growth.","levels":{"L0":"Does not identify technological progress as a production-technology change and may treat any new device, higher spending, or larger output as progress regardless of resource use.","L1":"Can recall that technological progress involves technology improving or resources being reduced, but cannot specify the given-output comparison or the repeated nature of the permanent technological revolution.","L2":"Can explain that technological progress means producing the same output with fewer resources, but may not connect repeated improvements to sustained labour productivity or living standards.","L3":"Can distinguish a one-time change in production technology from generation-after-generation improvement, and can explain how repeated resource-saving improvements support sustained growth in labour productivity and living standards.","L4":"Can apply the concept to examples by deciding whether a production change is technological progress and explaining how continuing improvements could affect productivity over time.","L5":"Can critique ambiguous cases, construct examples of resource-saving production changes, and teach how a permanent technological revolution differs from isolated inventions or simple increases in output."},"diagnostic_signals":["Defines technological progress in terms of reducing resources required for a given output.","Maintains the comparison at a given output rather than treating any output increase as technological progress.","Recognizes repeated technological improvement as central to the permanent technological revolution.","Links repeated improvements to sustained labour productivity growth and living-standard gains.","Incorrectly equates technological progress with more machines, more production, or novelty without resource-saving production change.","Can assess whether a described change in methods qualifies as technological progress."],"simulator_behavior":"Answers should show whether the learner focuses on resource requirements for a given output and can connect repeated production-method improvements to productivity and living-standard growth."},{"id":"general_purpose_technologies_and_the_industrial_revolution","name":"General-Purpose Technologies and the Industrial Revolution","type":"concept","definition":"General-purpose technologies are advances applicable across many sectors that spawn further innovations; the Industrial Revolution is presented as a wave of technological and organizational change that transformed production.","source_locators":[{"source_id":"Economy","locator":"Experiment Scope: Introductory Economics Foundations (part 2), Unit 2 introduction","note":"Defines the Industrial Revolution and general-purpose technologies."}],"diagnostic_goal":"Diagnose whether the learner understands general-purpose technologies as broad, innovation-spawning advances and understands the Industrial Revolution as a wave of technological and organizational change beginning in eighteenth-century Britain.","levels":{"L0":"Does not recognize general-purpose technologies or the Industrial Revolution, or treats them as any isolated invention or any period of economic growth.","L1":"Can recall that the Industrial Revolution began in Britain in the eighteenth century or that general-purpose technologies affect many sectors, but cannot explain the broader transformation or innovation-spawning role.","L2":"Can describe the Industrial Revolution as involving technological change and general-purpose technologies as widely used advances, but may overlook organizational change or the way broad technologies generate further innovations.","L3":"Can explain that the Industrial Revolution was a wave of technological and organizational changes starting in eighteenth-century Britain, and can distinguish general-purpose technologies from narrower improvements because they apply across many sectors and spawn further innovations.","L4":"Can apply the distinction to examples by identifying whether an advance is general-purpose or sector-specific and explaining how broad technologies can contribute to production transformation.","L5":"Can analyze the Industrial Revolution as a system-wide wave of technological and organizational change, generate examples and counterexamples of general-purpose technologies, and critique accounts that reduce it to a single invention."},"diagnostic_signals":["Identifies the Industrial Revolution as a wave of technological and organizational changes rather than a single event or invention.","Locates the described Industrial Revolution as beginning in eighteenth-century Britain when relevant.","Defines general-purpose technologies as applicable across many sectors.","Explains that general-purpose technologies spawn further innovations.","Distinguishes broad, cross-sector advances from narrow sector-specific improvements.","Incorrectly treats every new technology as general-purpose or ignores organizational change in the Industrial Revolution."],"simulator_behavior":"Answers should reveal whether the learner can separate broad, innovation-generating technologies from narrow improvements and can describe the Industrial Revolution as a broad technological and organizational transformation."},{"id":"causality_versus_correlation_in_economic_explanation","name":"Causality Versus Correlation in Economic Explanation","type":"concept","definition":"Causality means that a change in one variable produces a change in another through a mechanism, while correlation only shows that variables moved together.","source_locators":[{"source_id":"Economy","locator":"Unit 1, Section 1.9 Capitalism, causation and history’s hockey stick","note":"Warns against inferring causation from timing or co-movement alone."}],"diagnostic_goal":"Diagnose whether the learner can distinguish correlation from causality in economic explanation and recognize that causal claims require a mechanism rather than timing or co-movement alone.","levels":{"L0":"Cannot distinguish causality from correlation and treats variables moving together or occurring in sequence as proof that one caused the other.","L1":"Can repeat that correlation is not causation, but cannot explain what correlation shows or what is needed for a causal explanation.","L2":"Can explain that correlation means two things moved together and causality means one change produces another, but gives weak or vague accounts of mechanisms.","L3":"Can state that co-movement or timing alone is insufficient for causation and can explain that a causal claim needs a mechanism linking a change in one variable to a change in another.","L4":"Can apply the distinction to economic examples, such as evaluating whether the timing of capitalism and growth supports a causal claim only when supported by a plausible mechanism.","L5":"Can critique causal arguments, propose alternative explanations for correlations, articulate mechanisms, and design examples showing why observed co-movement is insufficient evidence of causation."},"diagnostic_signals":["Defines correlation as variables moving together rather than one producing the other.","Defines causality as a change in one variable producing a change in another through a mechanism.","Rejects timing or co-movement alone as sufficient evidence for causation.","Mentions the need for a mechanism in economic explanation.","Incorrectly infers causation merely because capitalism and growth, or any two variables, occur together over time.","Can evaluate whether a proposed relationship is causal, correlational, or under-supported."],"simulator_behavior":"Answers should show whether the learner requires a mechanism for causal claims and resists inferring causation from co-movement or timing alone."},{"id":"economic_models_and_ceteris_paribus_reasoning","name":"Economic Models and Ceteris Paribus Reasoning","type":"concept","definition":"Economic models are simplified representations that focus on essential features of a question, often using ceteris paribus reasoning to hold other influences constant and clarify mechanisms or predictions.","source_locators":[{"source_id":"Economy","locator":"Experiment Scope: Introductory Economics Foundations (part 2), Section 2.2 Economic models: How to see more by looking at less","note":"Defines models as simplifications that focus attention on what matters."},{"source_id":"Economy","locator":"Experiment Scope: Introductory Economics Foundations (part 2), Section 2.3 Basic concepts: Prices, costs, and innovation rents","note":"Introduces ceteris paribus reasoning for focused comparison."},{"source_id":"Economy","locator":"3.1 Labour and production","note":"Applies ceteris paribus to study time and GPA."},{"source_id":"Economy","locator":"Unit 3, Section 3.8","note":"Explains that models may work as if people calculated, without claiming conscious calculation."}],"diagnostic_goal":"Diagnose whether the learner understands economic models as purposeful simplifications, can use ceteris paribus reasoning to isolate relationships, and recognizes the role of omitted factors and as-if reasoning.","levels":{"L0":"Does not recognize models as simplified representations and may treat them as exact descriptions, useless fictions, or claims that people consciously calculate every modeled step.","L1":"Can recall terms such as model, simplification, ceteris paribus, or as-if, but cannot explain how simplification, holding other influences constant, and prediction or explanation fit together.","L2":"Can explain that models simplify reality and that ceteris paribus means other things are held constant, but may not identify which omitted factors matter or may assume the model describes conscious decision calculations.","L3":"Can explain that models focus on essential features for a question, omit unnecessary details, use ceteris paribus comparisons to isolate a mechanism, and require attention to omitted influences such as study environment when interpreting relationships.","L4":"Can apply model and ceteris paribus reasoning to new cases, identifying what is being held constant, what mechanism is being clarified, and why a prediction may still be useful as if people calculated without claiming they actually do.","L5":"Can critique and construct simplified economic models, justify what is included or omitted for a question, design ceteris paribus comparisons, and explain the strengths and limits of as-if reasoning in prediction and explanation."},"diagnostic_signals":["Describes models as simplified representations that focus attention on what is important for a question.","Recognizes that models omit details not needed for the specific purpose rather than aiming to include everything.","Explains ceteris paribus as comparing cases while holding other relevant influences constant.","Uses examples such as study time and GPA to note that omitted factors can affect interpretation.","Understands as-if reasoning: models may predict or explain without claiming people consciously perform the calculations.","Incorrectly treats ceteris paribus as meaning omitted factors do not exist or never matter."],"simulator_behavior":"Answers should reveal whether the learner can reason with simplification and controlled comparison, while acknowledging omitted factors and avoiding the misconception that models require conscious calculation by agents."},{"id":"relative_prices_and_technology_choice","name":"Relative Prices and Technology Choice","type":"concept","definition":"Relative prices are ratios of prices that guide comparisons among alternatives and can determine which production technology is least costly.","source_locators":[{"source_id":"Economy","locator":"Experiment Scope: Introductory Economics Foundations (part 2), Sections 2.3-2.6","note":"Uses wages relative to coal or capital-goods prices to explain technology choice."}],"diagnostic_goal":"Diagnose whether the learner understands relative prices as price ratios that guide comparison among alternatives and can explain how changes in relative input prices affect least-cost technology choice.","levels":{"L0":"Does not recognize relative prices and may think technology choice depends only on physical efficiency, absolute prices, or the newest available technique.","L1":"Can recall that relative prices are price comparisons or that firms compare input prices, but cannot explain how these comparisons affect technology choice.","L2":"Can explain that relative prices compare one price with another and that firms consider input costs, but may not see why a change in wages relative to energy or capital-goods prices can change the least-cost technique.","L3":"Can explain that relative prices are ratios of prices and that firms choose among production technologies by comparing total costs implied by relative input prices such as wages, energy, or capital goods.","L4":"Can apply relative-price reasoning to new examples, predicting when a change in wages, energy prices, or capital-goods prices would make a different technology least costly.","L5":"Can construct and critique technology-choice examples, separate technical feasibility from cost minimization, and explain how shifts in relative input prices can overturn a previously least-cost technology choice."},"diagnostic_signals":["Defines relative prices as ratios or comparisons among prices rather than isolated money prices.","Explains that technology choice depends on relative input prices.","Mentions wages relative to energy or capital-goods prices as relevant comparisons when grounded in examples.","Recognizes that a technique can become least costly or cease to be least costly when relative prices change.","Avoids choosing technology solely by newest, fastest, most output-producing, or lowest absolute price of one input.","Can reason through a simple change in input prices and its effect on least-cost production technology."],"simulator_behavior":"Answers should show whether the learner compares input prices relatively and uses those comparisons to determine least-cost technology choices rather than relying on physical or absolute-price criteria alone."},{"id":"malthusian_trap_and_subsistence_equilibrium","name":"Malthusian Trap and Subsistence Equilibrium","type":"concept","definition":"The Malthusian trap is a feedback mechanism in which income or wages above subsistence raise population, population growth lowers average product and income per person, and living standards return to subsistence equilibrium.","source_locators":[{"source_id":"Economy","locator":"Experiment Scope: Introductory Economics Foundations (part 2), Unit 2 introduction","note":"Introduces Malthus's logic that productivity gains lead to population growth and a return to subsistence."},{"source_id":"Economy","locator":"2.8 Malthusian economics: Population grows when living standards rise","note":"Explains population response to living standards and subsistence equilibrium."},{"source_id":"Economy","locator":"2.8 Malthusian economics: The effect of technological improvement","note":"Shows temporary income gains from technology followed by return to subsistence."},{"source_id":"Economy","locator":"2.8 Malthusian economics: Modelling Malthus","note":"Summarizes the wage-population feedback cycle."}],"diagnostic_goal":"Diagnose whether the learner understands the Malthusian feedback mechanism linking living standards, population growth, diminishing average product of labour, and return to subsistence equilibrium.","levels":{"L0":"Cannot identify the Malthusian trap as a population-income feedback mechanism; may treat it as simply poverty, famine, or lack of technology without explaining why wages return to subsistence.","L1":"Can recall terms such as subsistence, population growth, or Malthusian trap, but gives a memorized or fragmentary description and does not connect higher wages to population expansion and falling income per person.","L2":"Can explain that when living standards rise, population tends to grow and income eventually falls back toward subsistence, but the explanation is simple and may leave out diminishing average product of labour or the constant-population condition at subsistence wages.","L3":"Can describe the full cycle: wages above subsistence raise population, more labour lowers average product and income per person, and equilibrium is restored at subsistence with a larger population; can distinguish temporary gains from a stable subsistence equilibrium.","L4":"Can apply the model to new scenarios, such as a technological improvement, predicting a short-run rise in income per person followed by population growth and a return to subsistence under Malthusian assumptions.","L5":"Can critically explain the assumptions behind the trap, including the demographic response to living standards and diminishing average product of labour, teach the mechanism using examples, and generate counterexamples where the feedback would not restore subsistence."},"diagnostic_signals":["States whether population is constant, rising, or falling at subsistence versus above-subsistence wages.","Connects higher living standards to population expansion rather than treating population as fixed.","Explains that population growth lowers average product or income per person in the model.","Recognizes that technological improvement produces only temporary income gains in the Malthusian model unless conditions change.","Avoids the misconception that the trap means technology cannot increase total output or population.","Distinguishes subsistence equilibrium from a one-time low-income outcome."],"simulator_behavior":"Answers should reveal whether the simulated knowledge state can trace the wage-population-output feedback, identify subsistence as the equilibrium condition, and apply or misapply the mechanism to changes such as technological improvement."},{"id":"escape_from_malthusian_stagnation","name":"Escape from Malthusian Stagnation","type":"concept","definition":"Escape from Malthusian stagnation occurs when sustained technological improvement offsets diminishing average product of labour so population and real wages can rise together.","source_locators":[{"source_id":"Economy","locator":"2.10 Escaping from Malthusian stagnation","note":"Contrasts Malthusian stagnation with simultaneous increases in population and real wages."}],"diagnostic_goal":"Diagnose whether the learner understands escape from Malthusian stagnation as a regime in which sustained technological improvement allows real wages and population to rise together.","levels":{"L0":"Does not recognize escape from Malthusian stagnation; may say population growth always forces wages back to subsistence or confuse escape with a temporary productivity shock.","L1":"Can recall that escape involves rising wages, rising population, or technology, but cannot explain how these features differ from the Malthusian trap.","L2":"Can state that both population and real wages increase in the new regime, but gives only a basic explanation and may not connect this to sustained technological improvement offsetting diminishing average product.","L3":"Can contrast Malthusian stagnation with escape: in stagnation productivity gains are absorbed by population growth, while in escape continuing technological improvement allows income growth to outpace the population feedback.","L4":"Can apply the concept to distinguish examples where wages and population rise together from examples that remain Malthusian, using sustained technological progress as the key mechanism.","L5":"Can reflect on the conditions required for escape, explain why a single temporary improvement is insufficient, and generate examples or counterexamples involving the balance between technological improvement, population, and real wages."},"diagnostic_signals":["Identifies simultaneous increases in population and real wages as the hallmark of escape.","Names sustained technological improvement as the mechanism rather than merely a one-off increase in output.","Contrasts escape with the return-to-subsistence logic of the Malthusian trap.","Avoids claiming that any population growth by itself means escape.","Avoids claiming that any technological improvement automatically produces permanent escape.","Uses real wages or income per person rather than only total output as the relevant living-standard measure."],"simulator_behavior":"Answers should indicate whether the simulated knowledge state can distinguish a sustained post-Malthusian regime from a temporary Malthusian productivity gain and can use simultaneous wage and population growth as the diagnostic pattern."},{"id":"production_function","name":"Production Function","type":"concept","definition":"A production function describes how much output can be produced from a given amount or combination of inputs.","source_locators":[{"source_id":"Economy","locator":"3.1 Labour and production","note":"Applies the concept to study hours as input and grade as output."}],"diagnostic_goal":"Diagnose whether the learner understands a production function as a relationship mapping input amounts or input combinations to the amount of output that can be produced.","levels":{"L0":"Cannot identify a production function; may confuse it with a budget constraint, a preference ranking, a single observed production result, or a general goal of producing more output.","L1":"Can repeat that a production function relates inputs and output, but cannot explain what varies or what the relationship is used to describe.","L2":"Can explain in simple terms that output depends on inputs, such as study hours affecting a grade, but may treat the function as only one observed input-output pair rather than a relationship over many possible input levels or combinations.","L3":"Can describe a production function as showing the possible output for different amounts or combinations of inputs and can distinguish it from an actual chosen outcome on that relationship.","L4":"Can apply the idea to new production contexts by identifying the relevant inputs and output and interpreting how changing an input would move along or alter the relationship.","L5":"Can teach or critique the concept by explaining what information a production function includes and excludes, generate examples with single or multiple inputs, and distinguish it from neighboring concepts such as preferences or constraints."},"diagnostic_signals":["Identifies both inputs and output in an example.","Describes the relationship over varying input amounts or combinations, not just one data point.","Uses language of possible output that can be produced from given inputs.","Correctly interprets examples such as study hours as input and grade as output.","Avoids confusing the production function with utility, preferences, or a budget line.","Can explain that different input levels correspond to different possible output levels."],"simulator_behavior":"Answers should reveal whether the simulated knowledge state treats the production function as a general input-output relationship and can separate that relationship from a particular observed production choice or outcome."},{"id":"average_product_marginal_product_and_diminishing_marginal_product","name":"Average Product, Marginal Product, and Diminishing Marginal Product","type":"concept","definition":"Average product is total output divided by an input, marginal product is the additional output from one more unit of input holding other inputs constant, and diminishing marginal product occurs when successive input units add less output.","source_locators":[{"source_id":"Economy","locator":"3.1 Labour and production","note":"Defines average product, marginal product, and diminishing marginal product using the study-hours example."}],"diagnostic_goal":"Diagnose whether the learner understands average product, marginal product, and diminishing marginal product as distinct measures derived from a production relationship.","levels":{"L0":"Does not distinguish average product from marginal product; may use the terms interchangeably or define both as total output.","L1":"Can recall isolated phrases such as output per input or extra output, but cannot reliably assign them to average product and marginal product or explain diminishing marginal product.","L2":"Can give basic definitions: average product is total output divided by input and marginal product is extra output from one more input unit, but may struggle with examples or with holding other inputs constant.","L3":"Can distinguish the questions each measure answers, explain that marginal product can fall as input rises, and connect diminishing marginal product to a production function becoming flatter.","L4":"Can apply the concepts to new numerical or graphical examples, computing or interpreting average and marginal product and identifying when marginal product is diminishing.","L5":"Can explain subtle cases where average and marginal product move differently, teach the distinction with examples, and generate cases showing constant, increasing, or diminishing marginal product."},"diagnostic_signals":["Defines average product as total output divided by an input.","Defines marginal product as additional output from one more unit of input while other inputs are held constant.","Recognizes diminishing marginal product as successive input units adding less output.","Connects diminishing marginal product to a flattening production curve.","Avoids confusing diminishing marginal product with falling total output.","Can distinguish average output per unit from the increment added by the next unit."],"simulator_behavior":"Answers should show whether the simulated knowledge state can define, distinguish, and apply average product, marginal product, and diminishing marginal product without collapsing them into total output or each other."},{"id":"feasible_set_feasible_frontier_and_budget_constraint","name":"Feasible Set, Feasible Frontier, and Budget Constraint","type":"concept","definition":"A feasible set contains all combinations available under constraints, a feasible frontier shows the maximum feasible amount of one objective for each amount of another, and a budget constraint is a feasible frontier for consumption choices.","source_locators":[{"source_id":"Economy","locator":"3.4 The feasible set","note":"Defines feasible combinations and the frontier in the grade-free-time choice."},{"source_id":"Economy","locator":"Unit 3, Section 3.7, Figure 3.15","note":"Defines the work-consumption budget constraint as a feasible frontier."}],"diagnostic_goal":"Diagnose whether the learner understands feasible sets, feasible frontiers, and budget constraints as representations of choices available under constraints.","levels":{"L0":"Cannot identify feasible and infeasible choices; may treat every desired combination as available or confuse the feasible set with preferences or utility.","L1":"Can recall terms such as feasible set, frontier, or budget constraint, but gives only vague definitions and cannot distinguish the area of feasible choices from the boundary.","L2":"Can explain that the feasible set contains available combinations and that the frontier shows a maximum, but may be unclear about which points are inside, on, or outside the constraint.","L3":"Can distinguish feasible, infeasible, and frontier choices; can explain that the feasible frontier gives the maximum amount of one objective for each amount of another and that a budget constraint is such a frontier for consumption choices.","L4":"Can apply the framework to new cases, such as free time and grades or free time and consumption, identifying the feasible set below the frontier and the maximum attainable combinations on the budget constraint.","L5":"Can teach and critique the representation by generating examples of constraints, explaining changes to the frontier, and distinguishing feasibility from desirability or optimality."},"diagnostic_signals":["Identifies the feasible set as all available combinations under constraints.","Identifies the feasible frontier as the boundary of maximum attainable combinations.","Recognizes that points below or within the frontier may be feasible but not maximal.","Recognizes that points beyond the frontier are infeasible under the stated constraint.","Describes a budget constraint as a feasible frontier for consumption choices.","Avoids treating the highest-utility choice as automatically feasible."],"simulator_behavior":"Answers should reveal whether the simulated knowledge state can classify choices as feasible, frontier, or infeasible and can interpret a budget constraint as the maximum consumption available for each level of another objective."},{"id":"marginal_rate_of_transformation_and_opportunity_cost","name":"Marginal Rate of Transformation and Opportunity Cost","type":"concept","definition":"The marginal rate of transformation is the rate at which one feasible objective can be transformed into another; in the work-time model it equals the wage and is the opportunity cost of free time.","source_locators":[{"source_id":"Economy","locator":"Unit 3, Section 3.7, Figure 3.15 and Figure 3.16","note":"Links the budget-constraint slope, wage, MRT, and opportunity cost of free time."}],"diagnostic_goal":"Diagnose whether the learner understands the marginal rate of transformation as the feasible trade-off between objectives and, in the work-time model, as the wage or opportunity cost of free time.","levels":{"L0":"Does not recognize marginal rate of transformation or opportunity cost; may confuse it with personal willingness to trade or with total income.","L1":"Can recall that MRT, wage, slope, or opportunity cost are related, but cannot explain the trade-off they measure.","L2":"Can state that MRT is a rate of transforming one objective into another and that the wage is related to it, but may be unclear about the direction of the trade-off or the meaning of consumption forgone.","L3":"Can explain that in the work-time model the wage is the slope of the budget constraint, the rate at which time can be transformed into consumption, and the opportunity cost of an additional unit of free time.","L4":"Can apply the concept to new budget-constraint examples, using the wage or slope to calculate or interpret how much consumption is forgone when free time increases.","L5":"Can teach the distinction between feasible trade-offs and preference-based willingness to trade, generate examples with different wages, and explain how changes in the wage alter the opportunity cost of free time."},"diagnostic_signals":["Identifies MRT as a feasible trade-off, not a preference ranking.","Links the MRT in the work-time model to the slope of the budget constraint.","States that the wage measures how much consumption is gained by working more or forgone by taking more free time.","Uses opportunity cost language correctly for an additional unit of free time.","Avoids confusing MRT with MRS.","Can interpret the effect of a higher or lower wage on the trade-off between free time and consumption."],"simulator_behavior":"Answers should indicate whether the simulated knowledge state can use the wage or budget-constraint slope to describe the objective trade-off between free time and consumption and distinguish it from willingness to trade."},{"id":"preferences_indifference_curves_and_marginal_rate_of_substitution","name":"Preferences, Indifference Curves, and Marginal Rate of Substitution","type":"concept","definition":"Preferences describe how a person ranks outcomes, indifference curves join bundles that provide equal utility, and the marginal rate of substitution measures willingness to trade one good or objective for another.","source_locators":[{"source_id":"Economy","locator":"3.2 Preferences","note":"Introduces preferences, utility, indifference curves, and MRS using free time and grade."}],"diagnostic_goal":"Diagnose whether the learner understands preferences, indifference curves, and marginal rate of substitution as representations of rankings, equal-utility bundles, and willingness to trade.","levels":{"L0":"Cannot identify preferences or indifference curves; may treat them as budget constraints, production possibilities, or objective feasibility rather than rankings of outcomes.","L1":"Can recall words such as utility, indifference curve, or MRS, but cannot explain equal satisfaction or willingness to trade between objectives.","L2":"Can explain that preferences rank outcomes and indifference curves connect equally preferred bundles, but may treat utility as directly measurable happiness or struggle to interpret the MRS as a trade-off.","L3":"Can describe indifference curves as joining bundles that provide equal utility or satisfaction and explain MRS as the slope-based trade-off a person is willing to make between objectives.","L4":"Can apply the ideas to new examples, identifying equally preferred bundles and interpreting how much of one objective a person would give up for another along an indifference curve.","L5":"Can teach and critique the representation by distinguishing preferences from constraints, explaining utility without requiring direct measurement of happiness, and generating examples with different willingness-to-trade patterns."},"diagnostic_signals":["States that preferences rank outcomes or bundles.","Defines an indifference curve as connecting combinations that provide equal utility or satisfaction.","Interprets MRS as willingness to trade one good or objective for another.","Avoids confusing MRS with the feasible trade-off or wage-based MRT.","Avoids requiring utility to be directly measurable happiness.","Can apply the concepts to objectives such as free time and grades or consumption."],"simulator_behavior":"Answers should reveal whether the simulated knowledge state can represent subjective rankings with indifference curves and interpret MRS as willingness to trade, while keeping preferences separate from feasibility constraints."},{"id":"interior_optimum_where_mrs_equals_mrt","name":"Interior Optimum Where MRS Equals MRT","type":"concept","definition":"An interior utility-maximizing constrained choice occurs at a feasible-frontier point where the marginal rate of substitution equals the marginal rate of transformation, such as the wage in the work-consumption model.","source_locators":[{"source_id":"Economy","locator":"Unit 3, Section 3.7, Figures 3.15-3.16","note":"Identifies the ideal job where willingness to trade equals the feasible trade-off."}],"diagnostic_goal":"Diagnose whether the learner understands an interior constrained optimum as the feasible-frontier tangency where willingness to trade equals the feasible opportunity-cost trade-off.","levels":{"L0":"Does not recognize the interior optimum condition; may choose any preferred bundle, any feasible bundle, or the bundle with maximum one good without considering both preferences and constraints.","L1":"Can recall that MRS equals MRT, or that there is a tangency, but cannot explain what is being equated or why this identifies an optimum.","L2":"Can state that the optimum is where an indifference curve touches a budget constraint, but may not clearly connect MRS to willingness to trade and MRT to opportunity cost.","L3":"Can explain that at an interior optimum on the feasible frontier, the person's willingness to trade equals the feasible trade-off, such as MRS equaling the wage or budget-constraint slope in the work-consumption model.","L4":"Can apply the condition to new constrained-choice examples, identifying when an interior point is optimal and explaining why points with unequal MRS and MRT can be improved upon along the frontier.","L5":"Can teach and critically qualify the condition, explaining its dependence on an interior tangency and generating cases where the equality may not characterize the choice, such as boundary outcomes."},"diagnostic_signals":["States the condition MRS equals MRT for an interior optimum.","Identifies the optimum as a tangency between an indifference curve and the feasible frontier or budget constraint.","Explains MRS as willingness to trade and MRT as opportunity cost or feasible trade-off.","Links the work-consumption case to the wage as the relevant MRT.","Avoids choosing the highest indifference curve without checking feasibility.","Recognizes that the equality is for an interior solution rather than every constrained choice."],"simulator_behavior":"Answers should show whether the simulated knowledge state can combine preference trade-offs and feasible trade-offs to identify an interior optimum, and can distinguish tangency reasoning from merely selecting a desirable or feasible bundle."},{"id":"income_and_substitution_effects","name":"Income and Substitution Effects","type":"concept","definition":"The income effect is the change in choice caused by additional income with price or opportunity cost unchanged, while the substitution effect is the change caused by a price or opportunity-cost change holding the new utility level fixed.","source_locators":[{"source_id":"Economy","locator":"Unit 3, Section 3.7, Figure 3.17","note":"Defines income effect using unearned income and an outward budget shift."},{"source_id":"Economy","locator":"Unit 3, Section 3.7, Figure 3.19a and Figure 3.19b","note":"Defines substitution effect using a wage rise and changed opportunity cost."}],"diagnostic_goal":"Diagnose whether the learner can distinguish income effects from substitution effects in choice problems, especially when a wage or price change alters both attainable combinations and relative opportunity costs, and can explain why the two effects may offset each other.","levels":{"L0":"Cannot identify income or substitution effects in a choice problem, or treats any change in choice after a wage, price, or income change as one undifferentiated effect. May confuse opportunity cost changes with simple increases in money income.","L1":"Can recall that there are income and substitution effects, and may state short definitions, but cannot reliably say which effect holds price or opportunity cost unchanged and which isolates a changed relative trade-off at the new utility level.","L2":"Can explain in basic terms that the income effect comes from being able to afford or reach more combinations, while the substitution effect comes from a changed opportunity cost. Still struggles with boundary cases, such as separating an outward budget shift from a wage rise that changes the cost of free time.","L3":"Can distinguish the two effects in structured examples: identifies additional income with unchanged relative trade-offs as the income effect, and identifies a higher wage or price change that makes one option more costly relative to another as the substitution effect. Recognizes that the two effects can work in opposite directions but may need guidance to apply this to unfamiliar choices.","L4":"Can apply the distinction to new price, wage, or opportunity-cost scenarios, explaining which component pushes choices toward or away from an activity and why a higher wage need not make everyone work more hours. Can reason through cases where income and substitution effects reinforce or offset each other.","L5":"Can reflectively analyze and teach the decomposition of a choice change into income and substitution effects, including constructing examples and counterexamples where the effects have different signs. Can critique claims that infer behavior from a price or wage change without separating expanded attainable options from altered relative opportunity costs."},"diagnostic_signals":["Correctly identifies the income effect as the effect of extra income or expanded attainable combinations when the price or opportunity cost is unchanged.","Correctly identifies the substitution effect as the effect of a changed price or opportunity cost while holding the new utility level fixed.","Uses opportunity cost language appropriately, such as explaining that a higher wage makes free time more costly.","Recognizes that income and substitution effects can move choices in different directions rather than assuming all wage increases increase hours worked.","Distinguishes an unearned income shift from a wage change that changes the relative trade-off.","Misclassifies all effects of a wage increase as income effects, or all effects of higher purchasing power as substitution effects.","Can construct or interpret an example in which the two effects offset each other."],"simulator_behavior":"When answering about this node, vary whether responses merely name the two effects, correctly separate unchanged-income versus changed-opportunity-cost reasoning, or apply the decomposition to wage and price scenarios with possible opposing effects."},{"id":"strategic_interaction_and_game_models","name":"Strategic Interaction and Game Models","type":"concept","definition":"A strategic interaction is a situation in which participants know their actions affect others and others' actions affect them; a game models this by specifying players, feasible strategies, information, and payoffs.","source_locators":[{"source_id":"Economy","locator":"Unit 4, Section 4.1","note":"Defines strategic interaction and contrasts it with individual choice."},{"source_id":"Economy","locator":"Unit 4, Section 4.1, Figure 4.1","note":"Lists the required elements of a game description."}],"diagnostic_goal":"Diagnose whether the learner understands strategic interaction as mutually recognized interdependence of actions and can identify the required components of a game model: players, feasible strategies, information, and payoffs.","levels":{"L0":"Does not recognize strategic interaction as distinct from an isolated individual choice. May describe any decision involving more than one person as strategic without considering whether each participant's outcome depends on others' actions.","L1":"Can recall the term strategic interaction or game, and may list one or two elements such as players or strategies, but cannot explain mutual awareness of action effects or the full structure needed for a game representation.","L2":"Can explain that strategic interaction involves people whose actions affect one another, and can name basic game elements. Still gives incomplete game descriptions or omits information or payoffs when asked to model an interaction.","L3":"Can distinguish strategic interaction from isolated choice by emphasizing that participants know their actions affect others and are affected by others. Can specify players, feasible strategies, information, and payoffs in a simple game, though may need help with more complex cases.","L4":"Can apply the game-model framework to new interactions by identifying who is interacting, what each can do, what they know, and the payoff consequences of action combinations. Can reject inadequate models that list participants but fail to specify strategies, information, or payoffs.","L5":"Can critically construct and explain game representations, including why particular players, strategy sets, information assumptions, and payoff descriptions are needed. Can generate examples and counterexamples showing when a situation is or is not strategic interaction."},"diagnostic_signals":["Explains strategic interaction in terms of mutually recognized effects of participants' actions on one another.","Contrasts strategic interaction with an isolated choice whose outcome does not depend on another participant's action.","Lists all core game-model elements: players, feasible strategies, information, and payoffs.","Describes payoffs as depending on combinations of actions rather than only on one person's choice.","Omits information or payoffs when asked to model a game, indicating partial understanding.","Treats any social setting as a game without specifying strategies or interdependence.","Can turn a verbal interaction into a structured game description without adding unsupported elements."],"simulator_behavior":"When answering about this node, responses should reflect different knowledge states from simple term recall to explicit modeling of strategic interdependence through players, strategies, information, and payoffs."},{"id":"social_dilemmas_dominant_strategies_and_prisoners_dilemmas","name":"Social Dilemmas, Dominant Strategies, and Prisoners' Dilemmas","type":"concept","definition":"A social dilemma occurs when individually chosen actions lead to an outcome worse than a feasible cooperative outcome; in a prisoners' dilemma, each player has a dominant strategy, but mutual use of those strategies makes each player and the group worse off than cooperation.","source_locators":[{"source_id":"Economy","locator":"Unit 4 introduction","note":"Defines social dilemmas as privately chosen actions leading to inferior outcomes."},{"source_id":"Economy","locator":"Unit 4, Section 4.2","note":"Defines dominant strategy equilibrium."},{"source_id":"Economy","locator":"Unit 4, Section 4.3","note":"Defines prisoners' dilemma using the pest-control example."}],"diagnostic_goal":"Diagnose whether the learner can explain how dominant strategies and prisoners' dilemmas illustrate social dilemmas, where individually rational choices produce outcomes worse than feasible cooperative outcomes.","levels":{"L0":"Cannot identify a social dilemma, dominant strategy, or prisoners' dilemma, or confuses them with any disagreement or bad outcome. Does not connect individual incentives to collectively inferior results.","L1":"Can recall isolated phrases such as dominant strategy, prisoners' dilemma, or cooperation, but cannot explain that a dominant strategy gives the highest payoff regardless of the other player's action or why mutual dominant strategies can be worse than cooperation.","L2":"Can give a basic explanation that private choices may lead to a worse group outcome and that a prisoners' dilemma involves incentives not to cooperate. Still struggles to identify dominant strategies from payoffs or to explain the comparison with a feasible cooperative outcome.","L3":"Can identify a dominant strategy as the highest-payoff action no matter what the other player does, and can explain a prisoners' dilemma as a case where each player has such a strategy but both are worse off when both use it than if both cooperated. Understands the social-dilemma framing in simple examples.","L4":"Can apply the concepts to new payoff descriptions or scenarios by checking each player's best action against the other's possible actions, identifying the dominant strategy equilibrium, and comparing it with a cooperative outcome that would make players better off.","L5":"Can analyze and teach the logic of social dilemmas, dominant strategies, and prisoners' dilemmas, including generating examples and counterexamples. Can critique mistaken claims that an equilibrium reached by dominant strategies must be socially or jointly best."},"diagnostic_signals":["Defines a dominant strategy as the action with the highest payoff regardless of what the other player does.","Identifies that a dominant strategy equilibrium is an outcome in which every player uses a dominant strategy.","Explains that a prisoners' dilemma requires both dominant strategies and a cooperative alternative that would give each player higher payoffs than the dominant-strategy outcome.","Connects prisoners' dilemmas to the broader social dilemma idea that independent pursuit of private objectives can yield an inferior outcome.","Distinguishes a merely unfavorable outcome from one generated by dominant-strategy incentives.","Incorrectly treats cooperation as dominant in a prisoners' dilemma without comparing payoffs across the other player's actions.","Recognizes that collective inferiority is assessed relative to a feasible cooperative outcome, not simply by whether someone is unhappy."],"simulator_behavior":"When answering about this node, responses should range from vague references to conflict or cooperation to precise payoff-based reasoning about dominant strategies, dominant-strategy equilibrium, and the cooperative benchmark."},{"id":"nash_equilibrium","name":"Nash Equilibrium","type":"concept","definition":"A Nash equilibrium is a set of strategies, one for each player, in which each player's strategy is a best response to the strategies chosen by the others.","source_locators":[{"source_id":"Economy","locator":"Experiment Scope: Introductory Economics Foundations (part 5), section 4.13","note":"Defines Nash equilibrium and illustrates one or multiple equilibria."}],"diagnostic_goal":"Diagnose whether the learner understands Nash equilibrium as a strategy profile in which each player's strategy is a best response to the others, including that there may be one or multiple equilibria and that equilibrium need not be jointly best.","levels":{"L0":"Does not recognize Nash equilibrium or treats it as any stable, fair, or best overall outcome. Cannot relate equilibrium to players' best responses to one another.","L1":"Can recall that Nash equilibrium involves best responses or strategies, but states the idea vaguely and may describe only one player's optimal action without reference to the others' strategies.","L2":"Can explain in basic terms that in a Nash equilibrium no player wants to change given what others do. Still has unclear boundaries, such as assuming the equilibrium is always unique or always the best outcome for the group.","L3":"Can identify Nash equilibrium as a set of strategies, one for each player, where every player's strategy is a best response to the strategies chosen by the others. Recognizes that a game may have one or multiple Nash equilibria and that equilibrium need not maximize joint outcomes.","L4":"Can apply the mutual-best-response test to new simple games or verbal scenarios, checking each player's incentives given the others' choices and rejecting outcomes where at least one player would prefer to switch.","L5":"Can reflectively analyze Nash equilibrium, generate examples with single or multiple equilibria, and explain why equilibrium is a prediction about mutual best responses rather than a claim about fairness, cooperation, or joint optimality."},"diagnostic_signals":["States that Nash equilibrium is a strategy profile, not just one player's action.","Uses mutual best-response reasoning: each player's strategy is best given the others' strategies.","Identifies that no individual player has an incentive to unilaterally change strategy at a Nash equilibrium.","Recognizes the possibility of multiple Nash equilibria in a game.","Avoids equating Nash equilibrium with the jointly best or socially best outcome.","Incorrectly labels an outcome as Nash equilibrium when one player could improve by switching given the other's strategy.","Can test candidate outcomes by checking best responses for all players."],"simulator_behavior":"When answering about this node, responses should vary from vague equilibrium language to explicit mutual-best-response tests, including awareness that equilibria can be multiple and not jointly optimal."},{"id":"public_goods_free_riding_and_cooperation","name":"Public Goods, Free Riding, and Cooperation","type":"concept","definition":"A public good is costly for one person to provide but benefits everyone without reducing availability to others; free riding occurs when someone benefits from others' contributions without contributing, while cooperation is participation in a common project intended to create mutual benefits.","source_locators":[{"source_id":"Economy","locator":"Unit 4, Section 4.6","note":"Defines public goods and free riding with an irrigation example."},{"source_id":"Economy","locator":"Experiment Scope: Introductory Economics Foundations (part 5), section 4.9","note":"Defines cooperation and notes that punishment can sustain cooperative outcomes."}],"diagnostic
