 imperfect estimation of f creates reducible error, while the random error term creates irreducible error.","weight":0.95,"curation_confidence":0.97},{"id":"edge_statistical_learning_function_model_prerequisite_for_parametric_versus_non_parametric_methods","source":"statistical_learning_function_model","target":"parametric_versus_non_parametric_methods","type":"prerequisite_for","rationale":"Parametric and non-parametric methods are alternative approaches to estimating the unknown function f, so the basic function-model setup is needed to interpret what these methods are estimating.","weight":0.88,"curation_confidence":0.92},{"id":"edge_statistical_learning_function_model_prerequisite_for_model_flexibility_interpretability_and_overfitting","source":"statistical_learning_function_model","target":"model_flexibility_interpretability_and_overfitting","type":"prerequisite_for","rationale":"Model flexibility is defined as the range of shapes a method can produce for f, so understanding f as the systematic predictor-response function is needed to understand flexibility and overfitting.","weight":0.86,"curation_confidence":0.9},{"id":"edge_prediction_versus_inference_objectives_supports_model_flexibility_interpretability_and_overfitting","source":"prediction_versus_inference_objectives","target":"model_flexibility_interpretability_and_overfitting","type":"supports","rationale":"The prediction-inference distinction explains why interpretability matters for some modeling goals and why a highly flexible black-box fit may be acceptable for prediction but problematic for inference.","weight":0.78,"curation_confidence":0.86},{"id":"edge_parametric_versus_non_parametric_methods_supports_model_flexibility_interpretability_and_overfitting","source":"parametric_versus_non_parametric_methods","target":"model_flexibility_interpretability_and_overfitting","type":"supports","rationale":"The contrast between parametric assumptions and non-parametric data-driven fitting provides a concrete basis for understanding how assumptions, flexibility, interpretability, and overfitting risk are related.","weight":0.78,"curation_confidence":0.84},{"id":"edge_model_flexibility_interpretability_and_overfitting_supports_training_mse_and_test_mse","source":"model_flexibility_interpretability_and_overfitting","target":"training_mse_and_test_mse","type":"supports","rationale":"Overfitting explains why a model can achieve low training MSE by following noise while failing to achieve low test MSE on unseen observations.","weight":0.82,"curation_confidence":0.88},{"id":"edge_training_mse_and_test_mse_prerequisite_for_bias_variance_trade_off","source":"training_mse_and_test_mse","target":"bias_variance_trade_off","type":"prerequisite_for","rationale":"The bias-variance trade-off decomposes expected test MSE, so the distinction between training MSE and test MSE is needed to understand what error quantity is being decomposed and optimized.","weight":0.92,"curation_confidence":0.96},{"id":"edge_reducible_and_irreducible_prediction_error_prerequisite_for_bias_variance_trade_off","source":"reducible_and_irreducible_prediction_error","target":"bias_variance_trade_off","type":"prerequisite_for","rationale":"The bias-variance decomposition includes irreducible error as a component that cannot be eliminated by model choice, making the reducible versus irreducible error distinction a foundation for the decomposition.","weight":0.88,"curation_confidence":0.93},{"id":"edge_model_flexibility_interpretability_and_overfitting_prerequisite_for_bias_variance_trade_off","source":"model_flexibility_interpretability_and_overfitting","target":"bias_variance_trade_off","type":"prerequisite_for","rationale":"The bias-variance trade-off explains how increasing flexibility generally lowers bias and raises variance, so the concept of model flexibility is necessary for stable understanding of the trade-off.","weight":0.9,"curation_confidence":0.94},{"id":"edge_bias_variance_trade_off_prerequisite_for_k_nearest_neighbors_flexibility","source":"bias_variance_trade_off","target":"k_nearest_neighbors_flexibility","type":"prerequisite_for","rationale":"Understanding how K in KNN controls bias and variance relies on the general bias-variance trade-off, including how flexibility changes these error components.","weight":0.86,"curation_confidence":0.9},{"id":"edge_model_flexibility_interpretability_and_overfitting_prerequisite_for_k_nearest_neighbors_flexibility","source":"model_flexibility_interpretability_and_overfitting","target":"k_nearest_neighbors_flexibility","type":"prerequisite_for","rationale":"KNN flexibility is a specific instance of model flexibility: smaller K produces more local, flexible fits, while larger K produces smoother, less flexible fits.","weight":0.84,"curation_confidence":0.9},{"id":"edge_regression_versus_classification_problems_prerequisite_for_training_mse_and_test_mse","source":"regression_versus_classification_problems","target":"training_mse_and_test_mse","type":"prerequisite_for","rationale":"MSE is defined for quantitative response prediction, so distinguishing regression problems with quantitative responses from classification problems supports correct interpretation of when MSE is the relevant error measure.","weight":0.78,"curation_confidence":0.84},{"id":"edge_regression_versus_classification_problems_prerequisite_for_k_nearest_neighbors_flexibility","source":"regression_versus_classification_problems","target":"k_nearest_neighbors_flexibility","type":"prerequisite_for","rationale":"KNN uses local averaging for regression and local voting for classification, so understanding the regression-classification distinction is needed to interpret the prediction mechanism in each setting.","weight":0.82,"curation_confidence":0.88},{"id":"edge_supervised_versus_unsupervised_learning_supports_regression_versus_classification_problems","source":"supervised_versus_unsupervised_learning","target":"regression_versus_classification_problems","type":"supports","rationale":"Regression and classification are distinctions based on the type of response, while supervised learning is defined by the presence of a response, so the supervised-learning distinction helps frame why response type is central.","weight":0.68,"curation_confidence":0.78},{"id":"edge_simple_linear_regression_and_least_squares_fitting_prerequisite_for_regression_coefficient_uncertainty_and_hypothesis_tests","source":"simple_linear_regression_and_least_squares_fitting","target":"regression_coefficient_uncertainty_and_hypothesis_tests","type":"prerequisite_for","rationale":"Coefficient uncertainty and hypothesis tests concern estimated regression coefficients, so understanding the fitted intercept and slope from least squares is needed before interpreting their standard errors, test statistics, and p-values.","weight":0.9,"curation_confidence":0.95},{"id":"edge_simple_linear_regression_and_least_squares_fitting_prerequisite_for_residual_standard_error","source":"simple_linear_regression_and_least_squares_fitting","target":"residual_standard_error","type":"prerequisite_for","rationale":"Residual standard error is computed from residuals around a regression fit, so understanding fitted values, residuals, and least-squares regression is needed to interpret RSE.","weight":0.88,"curation_confidence":0.93},{"id":"edge_simple_linear_regression_and_least_squares_fitting_prerequisite_for_r_squared_statistic","source":"simple_linear_regression_and_least_squares_fitting","target":"r_squared_statistic","type":"prerequisite_for","rationale":"R-squared measures response variability explained by a regression model and is defined using quantities such as RSS, so understanding the fitted regression model and residual variation is needed to interpret it.","weight":0.82,"curation_confidence":0.88},{"id":"edge_r_squared_statistic_contrasts_with_residual_standard_error","source":"r_squared_statistic","target":"residual_standard_error","type":"contrasts_with","rationale":"Residual standard error measures typical lack of fit in response units, whereas R-squared is a scale-free proportion of response variability explained by the regression model.","weight":0.85,"curation_confidence":0.94},{"id":"edge_simple_linear_regression_and_least_squares_fitting_prerequisite_for_multiple_linear_regression_coefficient_interpretation","source":"simple_linear_regression_and_least_squares_fitting","target":"multiple_linear_regression_coefficient_interpretation","type":"prerequisite_for","rationale":"Multiple linear regression extends the linear-regression coefficient framework from one predictor to several predictors, so the simple-regression ideas of slope, intercept, fitted values, and coefficient interpretation are foundational.","weight":0.84,"curation_confidence":0.9},{"id":"edge_multiple_linear_regression_coefficient_interpretation_prerequisite_for_collinearity_and_variance_inflation","source":"multiple_linear_regression_coefficient_interpretation","target":"collinearity_and_variance_inflation","type":"prerequisite_for","rationale":"Collinearity concerns difficulty separating individual predictor associations in a multiple regression model, so understanding coefficients as holding other predictors fixed is needed to understand the problem.","weight":0.88,"curation_confidence":0.93},{"id":"edge_regression_coefficient_uncertainty_and_hypothesis_tests_prerequisite_for_collinearity_and_variance_inflation","source":"regression_coefficient_uncertainty_and_hypothesis_tests","target":"collinearity_and_variance_inflation","type":"prerequisite_for","rationale":"Collinearity inflates uncertainty in coefficient estimates and affects standard errors, t-statistics, and evidence about individual predictors, so coefficient-uncertainty concepts are needed to understand its inferential consequences.","weight":0.86,"curation_confidence":0.92},{"id":"edge_multiple_linear_regression_coefficient_interpretation_prerequisite_for_interaction_effects_and_the_additive_assumption","source":"multiple_linear_regression_coefficient_interpretation","target":"interaction_effects_and_the_additive_assumption","type":"prerequisite_for","rationale":"Interaction effects alter how one predictor's association with the response depends on another predictor, so understanding multiple-regression coefficients under the additive holding-fixed interpretation is needed to see what interactions relax.","weight":0.84,"curation_confidence":0.9},{"id":"edge_simple_linear_regression_and_least_squares_fitting_prerequisite_for_residual_plot_diagnosis_of_non_linearity","source":"simple_linear_regression_and_least_squares_fitting","target":"residual_plot_diagnosis_of_non_linearity","type":"prerequisite_for","rationale":"Residual plots diagnose patterns in residuals from a fitted regression model, so understanding fitted values and residuals in linear regression is necessary to interpret such plots.","weight":0.88,"curation_confidence":0.94},{"id":"edge_residual_plot_diagnosis_of_non_linearity_supports_model_flexibility_interpretability_and_overfitting","source":"residual_plot_diagnosis_of_non_linearity","target":"model_flexibility_interpretability_and_overfitting","type":"supports","rationale":"Residual patterns such as curvature provide a concrete reason why a more flexible model form may be needed, while also illustrating that flexibility is a response to model inadequacy rather than an automatic improvement.","weight":0.7,"curation_confidence":0.8},{"id":"edge_simple_linear_regression_and_least_squares_fitting_prerequisite_for_outliers_and_high_leverage_observations","source":"simple_linear_regression_and_least_squares_fitting","target":"outliers_and_high_leverage_observations","type":"prerequisite_for","rationale":"Outliers and high-leverage observations are diagnosed relative to a fitted regression line or plane, using residuals and predictor values, so basic regression fitting and residual concepts are necessary.","weight":0.84,"curation_confidence":0.9},{"id":"edge_residual_standard_error_supports_confidence_intervals_versus_prediction_intervals","source":"residual_standard_error","target":"confidence_intervals_versus_prediction_intervals","type":"supports","rationale":"Residual standard error represents individual-error variation around the regression fit, which helps explain why prediction intervals for particular responses are wider than confidence intervals for average responses.","weight":0.76,"curation_confidence":0.84},{"id":"edge_regression_coefficient_uncertainty_and_hypothesis_tests_supports_confidence_intervals_versus_prediction_intervals","source":"regression_coefficient_uncertainty_and_hypothesis_tests","target":"confidence_intervals_versus_prediction_intervals","type":"supports","rationale":"Regression coefficient uncertainty provides the general idea that fitted regression quantities have sampling uncertainty, which supports understanding confidence intervals for mean response or regression function values.","weight":0.68,"curation_confidence":0.76},{"id":"edge_simple_linear_regression_and_least_squares_fitting_prerequisite_for_qualitative_predictors_and_dummy_variables","source":"simple_linear_regression_and_least_squares_fitting","target":"qualitative_predictors_and_dummy_variables","type":"prerequisite_for","rationale":"Dummy-variable coding is a way to include qualitative predictors in a linear regression model, so basic understanding of regression predictors, coefficients, and baseline prediction is needed to interpret the coded model.","weight":0.78,"curation_confidence":0.84}]}</script>
  <div class="app-shell">

    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="panel nav-panel">
          <div class="nav-title">评审导航</div>

      <main class="content">
        <section class="section active" id="section-overview"></section>
        <section class="section" id="section-nodes"></section>

        <section class="section" id="section-coverage"></section>
        <section class="section" id="section-submit"></section>
      </main>
    </div>
  </div>

  <script>
  (() => {
    "use strict";

    const packageData = JSON.parse(document.getElementById("review-package").textContent);
    const SUBMISSION_SCHEMA = "knowact.kg_review_submission.v3";
    const storageKey = `knowact:kg-review:${packageData.graph.graph_fingerprint}`;
    const sectionOrder = ["overview", "nodes", "edges", "coverage", "submit"];
    let activeSection = "overview";
    let state = loadState() || createBlankState();

    const nodeOptions = {
      scope_fit: ["in_scope", "boundary", "out_of_scope"],
      granularity: ["appropriate", "too_broad", "too_narrow", "mixed"],
      diagnostic_usefulness: ["adequate", "minor_issue", "major_issue"],
      rubric_quality: ["adequate", "minor_issue", "major_issue"],
      decision: ["accept", "edit", "reject"],
    };
    const edgeOptions = {
      relation_validity: ["valid", "uncertain", "invalid"],
      type_correct: ["yes", "no", "uncertain"],
      replacement_type: ["part_of", "prerequisite_for", "supports", "contrasts_with"],
      direction_correct: ["yes", "no", "not_applicable", "uncertain"],
      provenance_class: ["source_explicit", "source_entailed", "expert_pedagogical_extension", "unsupported"],
      decision: ["accept", "edit", "delete"],
    };

    function esc(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function blankNodeReview() {
      return {
        scope_fit: "", granularity: "",
        diagnostic_usefulness: "", rubric_quality: "", decision: "",
        proposed_change: "", rationale: "",
      };
    }

    function blankEdgeReview() {
      return {
        relation_validity: "", type_correct: "", replacement_type: "",
        direction_correct: "", provenance_class: "", decision: "",
        proposed_change: "", rationale: "",
      };
    }

    function blankCoverageReview() {
      return { task_coverage: "", missing_or_redundant_content: "", rationale: "" };
    }

    function createBlankState() {
      return {
        submissionId: "",
        reviewer: {
          reviewer_id: "",
          role: "",
          experience_band: "",
          introduction: "",
        },
        nodeReviews: Object.fromEntries(packageData.nodes.map(node => [node.id, blankNodeReview()])),
        edgeReviews: Object.fromEntries(packageData.edges.map(edge => [edge.id, blankEdgeReview()])),
        coverageReviews: Object.fromEntries(
          packageData.scope.representative_tasks.map((_, index) => [`task_${String(index + 1).padStart(3, "0")}`, blankCoverageReview()])
        ),
        overall: { decision: "", rationale: "" },
      };
    }

    function loadState() {
      try {
        const value = localStorage.getItem(storageKey);
        if (!value) return null;
        const parsed = JSON.parse(value);
        if (parsed.graphFingerprint !== packageData.graph.graph_fingerprint) return null;
        return parsed.state;
      } catch {
        return null;
      }
    }

    function saveState() {
      localStorage.setItem(storageKey, JSON.stringify({
        graphFingerprint: packageData.graph.graph_fingerprint,
        state,
      }));
      document.getElementById("save-state").textContent = `已在本机保存 · ${new Date().toLocaleTimeString()}`;
      updateProgress();
    }

    function ensureCompleteShape() {
      const reviewer = state.reviewer || {};
      state.reviewer = {
        reviewer_id: reviewer.reviewer_id || "",
        role: reviewer.role || "",
        experience_band: reviewer.experience_band || "",
        introduction: reviewer.introduction || "",
      };
      for (const node of packageData.nodes) {
        state.nodeReviews[node.id] ||= blankNodeReview();
      }
      for (const edge of packageData.edges) {
        state.edgeReviews[edge.id] ||= blankEdgeReview();
      }
      packageData.scope.representative_tasks.forEach((_, index) => {
        const id = `task_${String(index + 1).padStart(3, "0")}`;
        state.coverageReviews[id] ||= blankCoverageReview();
      });
      state.overall ||= { decision: "", rationale: "" };
    }

    function selectField(label, scope, id, field, value, options, hint = "", allowBlank = true) {
      const optionHtml = [
        allowBlank ? '<option value="">请选择 / Select</option>' : "",
        ...options.map(option => `<option value="${esc(option)}"${value === option ? " selected" : ""}>${esc(option)}</option>`),
      ].join("");
      return `<div class="field">
        <label class="required">${esc(label)}</label>
        <select data-scope="${esc(scope)}" data-id="${esc(id)}" data-field="${esc(field)}">${optionHtml}</select>
        ${hint ? `<span class="hint">${esc(hint)}</span>` : ""}
      </div>`;
    }

    function textField(label, scope, id, field, value, options = {}) {
      const full = options.full ? " full" : "";
      const required = options.required ? " required" : "";
      const hint = options.hint ? `<span class="hint">${esc(options.hint)}</span>` : "";
      const type = options.type || "textarea";
      const min = options.min !== undefined ? ` min="${esc(options.min)}"` : "";
      const step = options.step !== undefined ? ` step="${esc(options.step)}"` : "";
      if (type === "textarea") {
        return `<div class="field${full}">
          <label class="${required}">${esc(label)}</label>
          <textarea class="${options.compact ? "compact-textarea" : ""}" data-scope="${esc(scope)}" data-id="${esc(id)}" data-field="${esc(field)}">${esc(value)}</textarea>
          ${hint}
        </div>`;
      }
      return `<div class="field${full}">
        <label class="${required}">${esc(label)}</label>
        <input type="${esc(type)}" value="${esc(value)}" data-scope="${esc(scope)}" data-id="${esc(id)}" data-field="${esc(field)}"${min}${step}>
        ${hint}
      </div>`;
    }

    function renderLabelGuide(title, intro, items) {
      return `<aside class="panel card label-guide">
        <h3>${esc(title)}</h3>
        <p>${esc(intro)}</p>
        <div class="label-guide-grid">
          ${items.map(item => `<div class="label-guide-item">
            <strong>${esc(item.label)} <code>${esc(item.field)}</code></strong>
            <p>${esc(item.description)}</p>
          </div>`).join("")}
        </div>
      </aside>`;
    }

    function nodeIsComplete(review) {
      const base = Object.keys(nodeOptions).every(field => Boolean(review[field]));
      if (!base) return false;
      if (["edit", "reject"].includes(review.decision) && !review.rationale.trim()) return false;
      return review.decision !== "edit" || Boolean(review.proposed_change.trim());
    }

    function edgeIsComplete(review, edge) {
      const required = ["relation_validity", "type_correct", "direction_correct", "provenance_class", "decision"];
      if (!required.every(field => Boolean(review[field]))) return false;
      if (review.type_correct === "no" && !review.replacement_type) return false;
      if (edge.type === "contrasts_with" && review.direction_correct !== "not_applicable") return false;
      if (edge.type !== "contrasts_with" && review.direction_correct === "not_applicable") return false;
      if (["edit", "delete"].includes(review.decision) && !review.rationale.trim()) return false;
      return review.decision !== "edit" || Boolean(review.proposed_change.trim());
    }

    function coverageIsComplete(review) {
      if (!review.task_coverage) return false;
      if (review.task_coverage !== "sufficient") {
        return Boolean(review.rationale.trim() && review.missing_or_redundant_content.trim());
      }
      return true;
    }

    function metadataIssues() {
      const reviewer = state.reviewer;
      return ["reviewer_id", "role", "experience_band", "introduction"]
        .filter(field => !String(reviewer[field] || "").trim())
        .map(field => `评审者字段 ${field} 尚未填写。`);
    }

    function validationIssues() {
      const issues = metadataIssues().map(message => ({ section: "overview", message }));
      packageData.nodes.forEach((node, index) => {
        if (!nodeIsComplete(state.nodeReviews[node.id])) {
          issues.push({ section: "nodes", message: `节点 ${index + 1} (${node.id}) 未完成或条件字段不完整。` });
        }
      });
      packageData.edges.forEach((edge, index) => {
        if (!edgeIsComplete(state.edgeReviews[edge.id], edge)) {
          issues.push({ section: "edges", message: `边 ${index + 1} (${edge.id}) 未完成或条件字段不完整。` });
        }
      });
      packageData.scope.representative_tasks.forEach((_, index) => {
        const id = `task_${String(index + 1).padStart(3, "0")}`;
        if (!coverageIsComplete(state.coverageReviews[id])) {
          issues.push({ section: "coverage", message: `代表性任务 ${index + 1} 尚未完成；partial/insufficient 还需填写内容与理由。` });
        }
      });
      if (!state.overall.decision) {
        issues.push({ section: "coverage", message: "尚未填写总体图谱决定。" });
      } else if (state.overall.decision !== "approve" && !state.overall.rationale.trim()) {
        issues.push({ section: "coverage", message: "approve_after_edits / do_not_approve 必须填写总体理由。" });
      }
      return issues;
    }

    function updateProgress() {
      ensureCompleteShape();
      const nodeDone = packageData.nodes.filter(node => nodeIsComplete(state.nodeReviews[node.id])).length;
      const edgeDone = packageData.edges.filter(edge => edgeIsComplete(state.edgeReviews[edge.id], edge)).length;
      const coverageDone = packageData.scope.representative_tasks.filter((_, index) => {
        const id = `task_${String(index + 1).padStart(3, "0")}`;
        return coverageIsComplete(state.coverageReviews[id]);
      }).length;
      const overviewDone = metadataIssues().length === 0 ? 1 : 0;
      const overallDone = state.overall.decision ? 1 : 0;
      document.getElementById("nav-overview-count").textContent = `${overviewDone}/1`;
      document.getElementById("nav-nodes-count").textContent = `${nodeDone}/${packageData.nodes.length}`;
      document.getElementById("nav-edges-count").textContent = `${edgeDone}/${packageData.edges.length}`;
      document.getElementById("nav-coverage-count").textContent = `${coverageDone + overallDone}/${packageData.scope.representative_tasks.length + 1}`;
      document.getElementById("nav-submit-count").textContent = validationIssues().length ? "待校验" : "可导出";
      document.querySelectorAll("[data-progress-kind]").forEach(element => {
        const kind = element.dataset.progressKind;
        if (kind === "nodes") element.textContent = `${nodeDone} / ${packageData.nodes.length} 完成`;
        if (kind === "edges") element.textContent = `${edgeDone} / ${packageData.edges.length} 完成`;
        if (kind === "coverage") element.textContent = `${coverageDone} / ${packageData.scope.representative_tasks.length} 完成`;
      });
    }

    function renderSection(section) {
      if (section === "overview") renderOverview();
      if (section === "nodes") renderNodes();
      if (section === "edges") renderEdges();
      if (section === "coverage") renderCoverage();
      if (section === "submit") renderSubmit();
      bindFormEvents();
      updateProgress();
    }

    function switchSection(section) {
      activeSection = section;
      document.querySelectorAll(".section").forEach(element => element.classList.toggle("active", element.id === `section-${section}`));
      document.querySelectorAll(".nav-button").forEach(element => element.classList.toggle("active", element.dataset.sectionTarget === section));
      renderSection(section);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function bindFormEvents() {
      document.querySelectorAll("[data-scope][data-field]").forEach(element => {
        const eventName = element.tagName === "SELECT" || element.type === "checkbox" ? "change" : "input";
        element.addEventListener(eventName, event => {
          const input = event.currentTarget;
          const value = input.type === "checkbox" ? input.checked : input.value;
          const { scope, id, field } = input.dataset;
          if (scope === "reviewer") state.reviewer[field] = value;
          if (scope === "node") state.nodeReviews[id][field] = value;
          if (scope === "edge") state.edgeReviews[id][field] = value;
          if (scope === "coverage") state.coverageReviews[id][field] = value;
          if (scope === "overall") state.overall[field] = value;
          saveState();
          if (input.tagName === "SELECT") renderSection(activeSection);
        });
      });
    }

    function buildSubmission(status) {
      if (!state.submissionId) {
        const randomPart = globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        state.submissionId = `kg-review-${randomPart}`;
        saveState();
      }
      const issues = validationIssues();
      return {
        schema_version: SUBMISSION_SCHEMA,
        status,
        submission_id: state.submissionId,
        exported_at: new Date().toISOString(),
        graph: structuredClone(packageData.graph),
        reviewer: {
          reviewer_id: state.reviewer.reviewer_id.trim(),
          role: state.reviewer.role.trim(),
          experience_band: state.reviewer.experience_band,
          introduction: state.reviewer.introduction.trim(),
        },
        node_reviews: packageData.nodes.map((node, index) => ({
          item_order: index + 1,
          node_id: node.id,
          ...structuredClone(state.nodeReviews[node.id]),
        })),
        edge_reviews: packageData.edges.map((edge, index) => ({
          item_order: index + 1,
          edge_id: edge.id,
          ...structuredClone(state.edgeReviews[edge.id]),
        })),
        coverage_reviews: packageData.scope.representative_tasks.map((task, index) => {
          const taskId = `task_${String(index + 1).padStart(3, "0")}`;
          return {
            item_order: index + 1,
            task_id: taskId,
            task_text: task,
            ...structuredClone(state.coverageReviews[taskId]),
          };
        }),
        overall_graph_review: structuredClone(state.overall),
        validation: {
          complete: issues.length === 0,
          issue_count: issues.length,
          issues: issues.map(issue => ({ section: issue.section, message: issue.message })),
        },
      };
    }

    function downloadJson(documentValue, filename) {
      const blob = new Blob([JSON.stringify(documentValue, null, 2) + "\n"], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function safeFilename(value) {
      return String(value || "anonymous").replace(/[^A-Za-z0-9_-]+/g, "_").replace(/^_+|_+$/g, "") || "anonymous";
    }

    function exportSubmission(status) {
      const submission = buildSubmission(status);
      if (status === "complete" && !submission.validation.complete) {
        switchSection("submit");
        return;
      }
      const filename = `${packageData.graph.domain.toLowerCase()}_kg_review_${safeFilename(submission.reviewer.reviewer_id)}_${status}.json`;
      downloadJson(submission, filename);
    }

    function stateFromSubmission(documentValue) {
      const next = createBlankState();
      next.submissionId = documentValue.submission_id || "";
      const reviewer = documentValue.reviewer || {};
      next.reviewer = {
        reviewer_id: reviewer.reviewer_id || "",
        role: reviewer.role || "",
        experience_band: reviewer.experience_band || "",
        introduction: reviewer.introduction || "",
      };
      for (const review of documentValue.node_reviews || []) {
        if (next.nodeReviews[review.node_id]) {
          next.nodeReviews[review.node_id] = { ...blankNodeReview(), ...review };
        }
      }
      for (const review of documentValue.edge_reviews || []) {
        if (next.edgeReviews[review.edge_id]) {
          next.edgeReviews[review.edge_id] = { ...blankEdgeReview(), ...review };
        }
      }
      for (const review of documentValue.coverage_reviews || []) {
        if (next.coverageReviews[review.task_id]) {
          next.coverageReviews[review.task_id] = { ...blankCoverageReview(), ...review };
        }
      }
      next.overall = { decision: "", rationale: "", ...(documentValue.overall_graph_review || {}) };
      return next;
    }

    async function importSubmission(event) {
      const file = event.currentTarget.files?.[0];
      event.currentTarget.value = "";
      if (!file) return;
      try {
        const documentValue = JSON.parse(await file.text());
        if (documentValue.schema_version !== SUBMISSION_SCHEMA) throw new Error("schema_version 不匹配");
        if (documentValue.graph?.graph_fingerprint !== packageData.graph.graph_fingerprint) {
          throw new Error("JSON 绑定的是另一张图谱或另一版 candidate artifacts");
        }
        state = stateFromSubmission(documentValue);
        saveState();
        renderSection(activeSection);
        alert("JSON 已导入并恢复为本机草稿。");
      } catch (error) {
        alert(`无法导入：${error.message}`);
      }
    }

    function resetReview() {
      if (!confirm("确定清空此图谱在本浏览器中的全部评审草稿吗？请先导出需要保留的 JSON。")) return;
      localStorage.removeItem(storageKey);
      state = createBlankState();
      renderSection(activeSection);
    }

    document.querySelectorAll("[data-section-target]").forEach(button => {
      button.addEventListener("click", () => switchSection(button.dataset.sectionTarget));
    });

    ensureCompleteShape();
    renderHeader();
    sectionOrder.forEach(renderSection);
    switchSection("overview");
  })();
  </script>
</body>
</html>
