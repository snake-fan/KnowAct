<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OSTEP Candidate KG Expert Review</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211b;
      --muted: #637068;
      --paper: #f4f1e9;
      --panel: #fffdf7;
      --line: #d9d4c7;
      --accent: #176b51;
      --accent-soft: #e4f0e9;
      --warn: #9a5a14;
      --danger: #a13732;
      --shadow: 0 12px 36px rgba(38, 47, 40, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 15px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button, select, input, textarea { border-radius: 8px; }
    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
      padding: 9px 13px;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: white; }
    button.danger { color: var(--danger); }
    button:disabled { cursor: not-allowed; opacity: 0.52; }

    .app-shell { min-height: 100vh; }
    .masthead {
      background: #12251d;
      color: white;
      padding: 28px max(24px, calc((100vw - 1440px) / 2));
    }
    .eyebrow {
      color: #9ed7c0;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      margin: 0 0 7px;
      text-transform: uppercase;
    }
    h1 { font-size: clamp(24px, 4vw, 40px); line-height: 1.13; margin: 0; }
    .subtitle { color: #c8d5cf; margin: 10px 0 0; max-width: 900px; }
    .binding-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 18px;
    }
    .binding-pill {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 999px;
      font-size: 12px;
      padding: 6px 10px;
    }

    .layout {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      gap: 22px;
      margin: 0 auto;
      max-width: 1440px;
      padding: 22px;
    }
    .sidebar {
      align-self: start;
      position: sticky;
      top: 16px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }
    .nav-panel { overflow: hidden; }
    .nav-title {
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      padding: 14px 16px 10px;
      text-transform: uppercase;
    }
    .nav-button {
      align-items: center;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      display: flex;
      justify-content: space-between;
      padding: 13px 16px;
      text-align: left;
      width: 100%;
    }
    .nav-button.active { background: var(--accent-soft); color: var(--accent); font-weight: 750; }
    .count {
      background: #ece9df;
      border-radius: 999px;
      color: var(--muted);
      font-size: 11px;
      padding: 2px 7px;
    }
    .nav-button.active .count { background: white; color: var(--accent); }
    .save-state {
      color: var(--muted);
      font-size: 12px;
      padding: 12px 16px;
    }

    .content { min-width: 0; }
    .section { display: none; }
    .section.active { display: block; }
    .section-header {
      align-items: start;
      display: flex;
      justify-content: space-between;
      margin: 5px 0 16px;
    }
    .section-header h2 { font-size: 25px; line-height: 1.25; margin: 0 0 4px; }
    .section-header p { color: var(--muted); margin: 0; }
    .progress-badge {
      background: var(--accent-soft);
      border-radius: 999px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
      padding: 6px 10px;
      white-space: nowrap;
    }

    .card { margin-bottom: 15px; padding: 20px; }
    .card-title { align-items: start; display: flex; gap: 12px; justify-content: space-between; }
    .card h3 { font-size: 19px; line-height: 1.3; margin: 0; }
    .label-guide {
      background: #f8f6ef;
      border-color: #c9c4b7;
    }
    .label-guide > p { color: var(--muted); margin: 5px 0 14px; }
    .label-guide-grid {
      display: grid;
      gap: 9px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .label-guide-item {
      background: white;
      border: 1px solid #dfdbcf;
      border-radius: 9px;
      padding: 10px 12px;
    }
    .label-guide-item strong { display: block; font-size: 13px; margin-bottom: 3px; }
    .label-guide-item p { color: var(--muted); font-size: 12px; margin: 0; }
    .label-guide-item code { color: var(--accent); font-size: 11px; }
    .identifier {
      color: var(--muted);
      font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow-wrap: anywhere;
    }
    .item-number {
      background: #ece9df;
      border-radius: 7px;
      color: var(--muted);
      flex: 0 0 auto;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 7px;
    }
    .item-status {
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
    }
    .item-status.done { background: var(--accent-soft); color: var(--accent); }
    .item-status.todo { background: #f7e9d3; color: var(--warn); }
    details {
      border-top: 1px solid var(--line);
      margin-top: 15px;
      padding-top: 12px;
    }
    summary { color: var(--accent); cursor: pointer; font-weight: 750; }
    .detail-block { margin-top: 13px; }
    .detail-block h4 {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.08em;
      margin: 0 0 5px;
      text-transform: uppercase;
    }
    .detail-block p { margin: 0; white-space: pre-wrap; }
    .locator, .rubric-row {
      background: #f4f1e8;
      border-left: 3px solid #a9b9b1;
      margin: 7px 0;
      padding: 9px 11px;
    }
    .rubric-row strong { color: var(--accent); display: inline-block; min-width: 30px; }
    ul { margin: 7px 0; padding-left: 20px; }

    .review-grid {
      border-top: 1px solid var(--line);
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-top: 16px;
      padding-top: 16px;
    }
    .field { min-width: 0; }
    .field.full { grid-column: 1 / -1; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 5px;
    }
    .required::after { color: var(--danger); content: " *"; }
    .hint { color: var(--muted); display: block; font-size: 11px; margin-top: 4px; }
    input, select, textarea {
      background: white;
      border: 1px solid #bbb7aa;
      color: var(--ink);
      padding: 9px 10px;
      width: 100%;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(23, 107, 81, 0.12);
      outline: none;
    }
    textarea { min-height: 84px; resize: vertical; }
    .compact-textarea { min-height: 62px; }

    .scope-summary { font-size: 16px; line-height: 1.8; margin: 8px 0 0; }
    .callout {
      background: #fff7e8;
      border: 1px solid #ecd1a6;
      border-radius: 10px;
      color: #664216;
      margin: 14px 0;
      padding: 12px 14px;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .file-input { display: none; }
    .error-box {
      background: #fff0ef;
      border: 1px solid #e0aaa7;
      border-radius: 10px;
      color: #75211d;
      display: none;
      margin: 14px 0;
      padding: 13px 15px;
    }
    .error-box.visible { display: block; }
    .success-box {
      background: var(--accent-soft);
      border: 1px solid #a7cbbb;
      border-radius: 10px;
      color: #154f3e;
      margin: 14px 0;
      padding: 13px 15px;
    }
    .checkbox-line { align-items: flex-start; display: flex; gap: 9px; }
    .checkbox-line input { margin-top: 4px; width: auto; }
    .hash-list {
      background: #f0ede5;
      border-radius: 9px;
      font: 11px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow-wrap: anywhere;
      padding: 11px 13px;
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; padding: 14px; }
      .sidebar { position: static; }
      .nav-panel { display: grid; grid-template-columns: repeat(3, 1fr); }
      .nav-title, .save-state { grid-column: 1 / -1; }
      .nav-button { border-right: 1px solid var(--line); }
      .review-grid, .label-guide-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
    }
    @media print {
      .sidebar, .actions { display: none !important; }
      .layout { display: block; max-width: none; padding: 0; }
      .section { display: block !important; }
      .panel { box-shadow: none; break-inside: avoid; }
    }
  </style>
</head>

  <script id="review-package" type="application/json">{"schema_version":"knowact.kg_review_package.v1","review_input_kind":"candidate_graph","graph":{"domain":"OSTEP","candidate_run_id":"kg_metadata_v1_ostep_20260730_robust_v2","review_package_id":"OSTEP:kg_metadata_v1_ostep_20260730_robust_v2","graph_fingerprint":"sha256:b2856932f15866ae3156688ddc508377bf3eef5937b062265ce6d9752434a245","node_count":24,"edge_count":28,"representative_task_count":50,"artifact_binding":{"domain":"OSTEP","candidate_run_id":"kg_metadata_v1_ostep_20260730_robust_v2","candidate_nodes":{"repository_path":"benchmark/domains/OSTEP/candidate_graphs/kg_metadata_v1_ostep_20260730_robust_v2/candidate_nodes.json","sha256":"c39c48227a4b8b00e6d2ea844755bc961bd9a2b209bf158205d5aa47ae5fb8bb"},"candidate_edges":{"repository_path":"benchmark/domains/OSTEP/candidate_graphs/kg_metadata_v1_ostep_20260730_robust_v2/candidate_edges.json","sha256":"6ddcbdfa7eca7d49868512d37d61bc7064688c48b27e18f2fb3bac00bc2e6cf0"},"source_metadata":{"repository_path":"storage/source_materials/OSTEP/metadata.json","sha256":"ecb6c861993b62c81d214ac3f4138d4dbc4f6eddb0be3049842e9e98d1ae53f9"},"source_content_sha256":"0c23b9b82596fd10de0db88620d74ef2dbecccb9ebf77a905f88953d5f2331fd"}},"source":{"source_id":"OSTEP","title":"Operating Systems: Three Easy Pieces — CPU Virtualization Foundations","citation":"Arpaci-Dusseau and Arpaci-Dusseau, Operating Systems: Three Easy Pieces, Chapters 2 and 4-8.","storage_uri":"storage/source_materials/OSTEP/experiment_scope.md","content_sha256":"0c23b9b82596fd10de0db88620d74ef2dbecccb9ebf77a905f88953d5f2331fd"},"scope":{"aspect_name":"Operating systems and CPU virtualization foundations","aspect_description":"Diagnosable concepts from OSTEP Chapter 2 and Chapters 4-8: operating-system goals, process abstraction and API, limited direct execution, basic CPU scheduling metrics and policies, and multi-level feedback queues.","review_scope_summary":"这张图谱聚焦《Operating Systems: Three Easy Pieces》中操作系统与 CPU 虚拟化的基础内容，覆盖操作系统目标、进程抽象与进程 API、受限直接执行、上下文切换，以及周转时间和响应时间等调度指标、典型调度策略与多级反馈队列。评审重点是这些概念、机制和策略之间的关系是否准确，并能否用于诊断学习者对进程执行与 CPU 调度的理解。","representative_tasks":["Explain how an operating system turns physical resources into easier-to-use virtual abstractions.","Distinguish the operating system's roles as virtual machine, standard interface provider, and resource manager.","Explain why protection is necessary when multiple programs share CPU, memory, and devices.","Distinguish mechanism from policy using CPU virtualization as an example.","Explain why a running program is not the same thing as its executable file.","Identify the major components of a process's machine state.","Distinguish running, ready, and blocked process states in an execution trace.","Predict legal process-state transitions after dispatch, I/O initiation, I/O completion, and preemption.","Explain why a process list or process control block is needed by the operating system.","Use process identifiers and parent-child relationships to interpret a process tree.","Predict the possible outputs of a program that calls fork without assuming a fixed parent-child execution order.","Explain how fork creates a new process while preserving distinct return values in parent and child.","Explain how exec changes a process image without creating a new process identifier.","Explain how wait supports ordering and resource collection between parent and child processes.","Distinguish normal process termination from a zombie or orphan process situation.","Choose among fork, exec, wait, and exit for a stated process-management goal.","Explain how a shell uses fork, exec, and wait to launch a foreground command.","Explain why unrestricted direct execution would prevent the OS from retaining control.","Distinguish user mode from kernel mode and identify operations that require privileged execution.","Trace a system call through trap entry, kernel handling, and return to user mode.","Distinguish a system call trap from a hardware interrupt and from a program exception.","Explain why a timer interrupt is needed to regain control from a CPU-bound process.","Trace the steps of a context switch between two processes.","Identify which process state must be saved and restored across a context switch.","Explain the difference between cooperative and preemptive approaches to CPU sharing.","Diagnose why disabling interrupts is not a safe general solution for untrusted user programs.","Calculate turnaround time for a workload under a specified schedule.","Calculate response time and distinguish it from turnaround time.","Explain why a policy that minimizes turnaround time may provide poor interactive response.","Schedule a set of jobs under first-in-first-out and compute completion metrics.","Construct a convoy-effect example and explain why FIFO performs poorly on it.","Schedule known jobs under shortest-job-first and explain its optimality assumptions.","Explain why non-preemptive shortest-job-first struggles when job lengths are unknown or arrivals differ.","Schedule jobs under shortest-time-to-completion-first with staggered arrivals.","Explain how preemption changes shortest-job-first into shortest-time-to-completion-first.","Simulate round-robin scheduling for a given time slice and arrival sequence.","Predict how a smaller round-robin quantum affects response time and context-switch overhead.","Compare FIFO, SJF, STCF, and round robin for batch and interactive workloads.","Explain why an online scheduler cannot generally know a job's future CPU demand.","State the goals of a multi-level feedback queue when job behavior is not known in advance.","Apply MLFQ priority rules to select the next runnable job.","Trace how a CPU-bound job's priority changes as it consumes its time allotment.","Explain why an interactive or I/O-bound job may remain at high priority in MLFQ.","Diagnose starvation in an MLFQ workload containing a stream of interactive jobs.","Explain how periodic priority boosting addresses starvation.","Construct a gaming attack against a naive MLFQ rule and explain why it works.","Explain how cumulative allotment accounting reduces MLFQ gaming opportunities.","Predict the effect of changing queue allotments and time quanta on scheduler behavior.","Compare scheduler fairness with optimization of turnaround and response time.","Integrate process abstraction, protected execution, context switching, and scheduling into one CPU-virtualization trace."],"excluded_topics":["Virtual-memory address spaces, paging, segmentation, TLBs, and swapping","Threads, synchronization, locks, condition variables, semaphores, and concurrency bugs","I/O devices, disks, RAID, filesystems, persistence, and distributed systems","Security chapters and cryptographic mechanisms","Lottery scheduling and multiprocessor scheduling beyond brief contrast","Linux CFS and production-kernel implementation details not developed in Chapters 2 and 4-8","Architecture-specific register layouts and assembly details","Programming-project setup and simulator command-line memorization","Historical anecdotes that do not support a reusable operating-system concept","Performance claims that ignore the workload assumptions stated in the selected chapters"],"target_node_count":20,"max_node_count":24},"nodes":[{"id":"operating_system_virtualization","name":"Operating System Virtualization","type":"concept","definition":"The operating system transforms physical resources such as CPUs, memory, and disks into easier-to-use virtual resources and abstractions.","source_locators":[{"source_id":"OSTEP","locator":"Chapter 2, Introduction to Operating Systems, pp. 2-4","note":"Introduces virtualization as a central OS technique."}],"diagnostic_goal":"Diagnose whether the learner understands virtualization as a central operating-system technique for transforming physical machine resources into easier-to-use virtual resources and abstractions.","levels":{"L0":"Does not recognize operating-system virtualization in this sense, or treats it as unrelated to CPUs, memory, or disks; may confuse it with only running virtual machines or with any generic software feature.","L1":"Can recall that an operating system virtualizes resources, or can repeat examples such as CPU, memory, or disk, but cannot explain what is transformed or why the abstraction matters.","L2":"Can explain in basic terms that the OS makes physical resources easier for programs to use by presenting virtual resources, but gives only simple examples and may blur the difference between the physical resource and the virtual abstraction.","L3":"Can relate virtualization to the OS role of making shared hardware appear as usable abstractions, such as creating virtual CPUs from one physical CPU, and can distinguish this technique from merely exposing APIs or making allocation decisions.","L4":"Can apply the idea to new scenarios by identifying which physical resource is being virtualized and what virtual abstraction the OS provides, while recognizing limits such as virtualization being a technique rather than the entire purpose of an OS.","L5":"Can reflectively explain why virtualization is a powerful OS design technique, generate and analyze examples and counterexamples involving CPU, memory, and disk abstractions, and critique oversimplified claims such as equating OS virtualization only with full-machine virtual machines."},"diagnostic_signals":["Mentions transformation of physical resources into virtual resources or abstractions rather than only naming hardware components.","Correctly uses examples such as processor, memory, disk, or virtual CPUs to illustrate the concept.","Distinguishes virtualization from system calls, resource allocation policy, and protection, while recognizing they can be related OS concerns.","Explains the user-facing benefit as making resources easier to use or appear more convenient to programs.","Common misconception: treats virtualization only as cloud or hypervisor virtual machines, with no connection to ordinary OS abstractions."],"simulator_behavior":"When this concept is known, answers describe how the OS presents easier-to-use virtual abstractions over physical CPU, memory, or disk resources and can supply concrete examples; when weak, answers rely on vague hardware-management language or confuse the term with full-machine virtualization only."},{"id":"operating_system_as_standard_interface_provider","name":"Operating System as Standard Interface Provider","type":"concept","definition":"The operating system exposes interfaces, including system calls, through which applications request OS services and use machine resources indirectly.","source_locators":[{"source_id":"OSTEP","locator":"Chapter 2, Introduction to Operating Systems, p. 2","note":"Describes OS APIs and system calls."}],"diagnostic_goal":"Diagnose whether the learner understands that an operating system provides standard interfaces, especially system calls, through which applications request services and use machine resources indirectly.","levels":{"L0":"Does not recognize the OS as an interface provider; may claim applications directly control hardware without OS mediation or confuse system calls with ordinary function calls unrelated to the OS.","L1":"Can recall terms such as API or system call and may state that the OS provides them, but cannot explain how applications use these interfaces to request OS services.","L2":"Can explain that applications ask the OS to do things through system calls or APIs, but may give only simple examples and may not clearly distinguish this interface role from the OS internally managing resources.","L3":"Can connect system calls to the idea that applications use virtual-machine features and machine resources indirectly through OS-provided interfaces, and can contrast interface provision with resource virtualization or allocation decisions.","L4":"Can apply the concept by identifying when an application must use an OS interface rather than directly manipulating a protected resource, and can reason about why a standard interface is useful across many OS services.","L5":"Can reflectively analyze the OS interface role, generate examples of service requests that would go through system calls, and critique misconceptions such as treating system calls as merely library conveniences with no privileged OS mediation."},"diagnostic_signals":["Explicitly identifies system calls or OS APIs as the path by which applications request OS services.","Describes indirect use of machine resources through the OS rather than direct unrestricted hardware access by applications.","Recognizes that a typical OS exposes many such calls or interfaces without needing an exact count.","Distinguishes the interface-provider role from the OS deciding allocation policies or creating virtual resources.","Common misconception: describes system calls as normal application subroutines only, with no special role in crossing to OS services."],"simulator_behavior":"When this concept is known, answers explain that programs invoke OS-provided interfaces such as system calls to request services and access resources indirectly; when weak, answers omit the application-OS boundary or portray applications as directly controlling hardware."},{"id":"operating_system_as_resource_manager","name":"Operating System as Resource Manager","type":"concept","definition":"The operating system manages shared resources such as CPU, memory, and disk by deciding how to allocate them according to goals such as efficiency and fairness.","source_locators":[{"source_id":"OSTEP","locator":"Chapter 2, Introduction to Operating Systems, pp. 2-4","note":"Connects sharing and allocation decisions to the resource manager role."}],"diagnostic_goal":"Diagnose whether the learner understands the operating system as a manager of shared CPU, memory, and disk resources that decides how to allocate them according to goals such as efficiency and fairness.","levels":{"L0":"Does not recognize the OS as a resource manager; may view it only as a program launcher or user interface and cannot connect it to allocating CPU, memory, or disk resources.","L1":"Can recall the phrase resource manager or list resources such as CPU, memory, and disk, but cannot explain that the OS makes allocation decisions among competing programs.","L2":"Can state that the OS manages resources for programs, but gives a broad or one-sided explanation and may not mention sharing, decision-making, efficiency, or fairness.","L3":"Can explain that virtualization and sharing create the need for the OS to decide which programs receive resources, and can relate those decisions to goals such as efficient use and fair treatment.","L4":"Can apply the resource-manager idea to scenarios involving multiple programs competing for CPU, memory, or disk, identifying the allocation choice the OS must make and the possible efficiency or fairness tradeoff.","L5":"Can reflectively analyze resource management as an objective OS role, generate examples of competing allocation goals, and critique simplistic claims such as 'the OS just gives every program whatever it asks for'."},"diagnostic_signals":["Mentions shared resources and allocation decisions, not just hardware ownership.","Uses examples such as CPU time, memory, or disk to explain what is managed.","Connects the role to goals such as efficiency and fairness where appropriate.","Distinguishes resource management from merely providing a system-call interface or merely virtualizing a single resource.","Common misconception: claims resource management means only monitoring resources, with no decisions about which program gets what."],"simulator_behavior":"When this concept is known, answers frame the OS as deciding how to allocate shared CPU, memory, and disk resources among programs, often noting efficiency and fairness; when weak, answers list hardware components without explaining allocation or sharing."},{"id":"protection_and_isolation","name":"Protection and Isolation","type":"concept","definition":"Protection is the OS goal of preventing a program's accidental or malicious behavior from harming other programs or the operating system, with isolation as a central principle.","source_locators":[{"source_id":"OSTEP","locator":"Chapter 2, section 2.5 Design Goals, p. 11","note":"Discusses protection as an OS design goal."}],"diagnostic_goal":"Diagnose whether the learner understands protection as an OS design goal that uses isolation to prevent one program's accidental or malicious behavior from harming other programs or the operating system.","levels":{"L0":"Does not recognize protection or isolation as an OS concern; may think any running program can freely affect other programs or the OS without restriction.","L1":"Can recall words such as protection, isolation, or security, but cannot explain what is being protected from what or why multiple programs make this necessary.","L2":"Can explain that the OS keeps programs from interfering with each other, but may describe only accidental bugs or only malicious attacks and may not include protection of the OS itself.","L3":"Can articulate that protection applies both between applications and between applications and the operating system, and that isolation is a central principle for containing accidental or malicious bad behavior.","L4":"Can apply the idea to scenarios by identifying when one program's actions should be isolated to prevent harm to other programs or the OS, and can distinguish protection from resource allocation or interface provision.","L5":"Can reflectively reason about protection as an OS design goal, generate examples and counterexamples of isolation failures, and critique overly broad claims such as equating protection only with passwords or user authentication."},"diagnostic_signals":["States that one program's bad behavior should not harm other programs or the operating system.","Includes both accidental and malicious behavior as relevant sources of harm.","Uses isolation as the principle for separating applications from each other and from the OS.","Distinguishes OS protection from general user authentication or from fairness in resource allocation.","Common misconception: treats protection as only antivirus, login security, or encryption, without program isolation."],"simulator_behavior":"When this concept is known, answers emphasize isolating programs so accidental or malicious behavior cannot damage other programs or the OS; when weak, answers use generic security terms without explaining isolation or the protected parties."},{"id":"mechanism_and_policy_separation","name":"Mechanism and Policy Separation","type":"concept","definition":"A mechanism is low-level machinery for how an OS function is performed, while a policy is the algorithm or rule for deciding which action to take.","source_locators":[{"source_id":"OSTEP","locator":"Chapter 4, The Abstraction: The Process, pp. 1-3","note":"Contrasts context switching as mechanism with scheduling as policy."}],"diagnostic_goal":"Diagnose whether the learner understands the distinction between OS mechanisms as low-level 'how' machinery and policies as rules or algorithms deciding 'which' action to take.","levels":{"L0":"Does not distinguish mechanism from policy and may use the terms interchangeably or assign them to unrelated concepts.","L1":"Can recall that mechanism answers 'how' and policy answers 'which' or 'what decision,' but cannot explain the distinction using an OS example.","L2":"Can give a basic explanation that mechanisms perform actions while policies decide among actions, but may misclassify examples or fail to connect the distinction to operating-system design.","L3":"Can correctly contrast context switching as a mechanism with scheduling as a policy, and can explain why separating how an action is performed from which action is chosen matters conceptually.","L4":"Can apply the separation to new OS situations by identifying the low-level machinery and the decision rule or algorithm, while recognizing that a policy may rely on mechanisms to be carried out.","L5":"Can reflectively analyze the benefits and limits of separating mechanism from policy, generate examples and counterexamples, and critique designs or explanations that entangle implementation machinery with decision rules."},"diagnostic_signals":["Uses the how-versus-which distinction accurately.","Correctly identifies context switching as a mechanism and scheduling as a policy when those examples arise.","Explains policy as a rule or algorithm for deciding among possible actions, not as a general political rule.","Explains mechanism as low-level machinery for carrying out an OS function, not as the reason for choosing it.","Common misconception: says scheduling is the mechanism and context switching is the policy, or treats both as synonyms for OS behavior."],"simulator_behavior":"When this concept is known, answers separate the machinery that performs an operation from the decision rule selecting an action, often using context switching and scheduling correctly; when weak, answers conflate the two or rely only on memorized slogans."},{"id":"process_abstraction","name":"Process Abstraction","type":"concept","definition":"A process is the operating system abstraction of a running program, distinct from the inactive program code and data stored on disk before execution.","source_locators":[{"source_id":"OSTEP","locator":"Chapter 4, The Abstraction: The Process, p. 1","note":"Defines a process as a running program."}],"diagnostic_goal":"Diagnose whether the learner understands a process as the operating-system abstraction of a running program, distinct from inactive program code and data stored on disk.","levels":{"L0":"Does not recognize what a process is; may confuse a process with any file, source code, CPU, or generic program concept without the idea of execution.","L1":"Can recall that a process is a running program, but cannot explain the contrast with an executable or program stored on disk.","L2":"Can explain that a process is a program in execution, but may give a simple description that omits the OS abstraction aspect or still blurs process with static program contents.","L3":"Can clearly distinguish the living execution abstraction from the lifeless on-disk program and can explain that the OS uses the process abstraction to reason about running programs.","L4":"Can apply the distinction to examples, identifying when a stored executable becomes a process and when multiple running instances should count as distinct processes rather than one static program.","L5":"Can reflectively explain why the process abstraction is fundamental for the OS, generate edge cases involving programs versus running instances, and critique definitions that omit execution state or OS abstraction."},"diagnostic_signals":["States that a process is a running program or program in execution.","Contrasts a process with inactive program code and data stored on disk.","Recognizes the process as an OS abstraction rather than merely a filename or executable file.","Can reason that starting an executable creates a running process, while the file itself remains just a program.","Common misconception: treats 'program' and 'process' as exact synonyms in all contexts."],"simulator_behavior":"When this concept is known, answers define a process as the OS abstraction of a running program and contrast it with a static program on disk; when weak, answers equate processes with files or use 'program' without the execution distinction."},{"id":"process_machine_state","name":"Process Machine State","type":"concept","definition":"A process's machine state consists of the execution state the OS must understand or preserve, including addressable memory, registers such as program counter and stack pointer, and I/O-related state such as open files.","source_locators":[{"source_id":"OSTEP","locator":"Chapter 4, section 4.1 The Abstraction: A Process, pp. 2-3","note":"Lists major pieces of process state."}],"diagnostic_goal":"Diagnose whether the learner understands a process's machine state as the execution state the OS must understand or preserve, including memory, registers, and I/O-related state such as open files.","levels":{"L0":"Does not recognize process machine state or treats it as only the program's source code, the CPU hardware itself, or unrelated user data.","L1":"Can recall one or two components such as memory or registers, but cannot explain that these are the state a running process can read or update and that the OS must track or preserve.","L2":"Can describe process state as information needed to run a process, but gives an incomplete list or omits important categories such as addressable memory, registers, or open-file information.","L3":"Can organize the major pieces of process machine state, including address space or memory, registers such as program counter and stack pointer, and I/O-related state such as open files, and explain why they matter during execution.","L4":"Can apply the concept to scenarios such as stopping and resuming a process by identifying which state must be preserved or restored for execution to continue correctly.","L5":"Can reflectively analyze the boundaries of process machine state, generate examples across memory, register, and I/O categories, and critique incomplete accounts that reduce a process only to its code or only to CPU registers."},"diagnostic_signals":["Mentions addressable memory or address space as part of process state.","Mentions registers, especially program counter or stack pointer, as execution state.","Mentions I/O-related state such as open files when describing what the OS tracks.","Explains that the OS must understand or preserve what the program can read or update during execution.","Common misconception: lists only the executable code and ignores dynamic execution state."],"simulator_behavior":"When this concept is known, answers describe process machine state as the memory, register, and I/O-related information needed to represent and preserve a running process; when weak, answers give a partial list or confuse state with static program files."},{"id":"process_creation_and_loading","name":"Process Creation and Loading","type":"concept","definition":"Process creation turns an executable into a running process by loading program code and data, allocating runtime structures such as stack and heap, initializing I/O-related state, and starting execution at the entry point.","source_locators":[{"source_id":"OSTEP","locator":"Chapter 4, section 4.3 Process Creation: A Little More Detail, pp. 4-5","note":"Describes loading and initialization steps for starting a process."}],"diagnostic_goal":"Diagnose whether the learner understands process creation as the OS transformation of an executable into a running process by loading code and data, setting up runtime state, initializing I/O-related state, and starting execution at the entry point.","levels":{"L0":"Does not recognize process creation as an OS activity; may think a program runs directly from disk without loading or setup, or confuse creation with merely writing source code.","L1":"Can recall that the OS loads a program to run it, but cannot describe the major setup steps that turn an executable into a process.","L2":"Can give a basic account that the OS loads code and starts the program, but may omit data, stack, heap, I/O state, or the entry point and may not distinguish the executable from the resulting process.","L3":"Can describe the sequence at a structured level: load program code and data into memory, allocate or initialize runtime structures such as stack and heap, set up I/O-related state, and begin execution at the entry point such as main().","L4":"Can apply the concept to new examples by explaining what must happen before an on-disk executable can execute as a process and identifying which missing setup step would prevent correct execution.","L5":"Can reflectively analyze process creation as a transformation from static executable to running process, generate detailed examples or counterexamples, and critique oversimplified accounts that say the OS merely 'opens' a program."},"diagnostic_signals":["Describes loading program code from an executable into memory as an OS step.","Includes program data and runtime structures such as stack or heap in the setup when giving a fuller answer.","Mentions initialization of I/O-related state such as open-file defaults or related process state.","Identifies starting execution at an entry point, such as main(), after setup.","Common misconception: says the CPU simply executes the file directly from disk with no OS loading or initialization."],"simulator_behavior":"When this concept is known, answers explain that the OS creates a process by loading executable contents, preparing runtime and I/O state, and starting execution at the entry point; when weak, answers reduce creation to clicking a program or vaguely 'starting it' without transformation or setup steps."},{"id":"process_states_and_transitions","name":"Process States and Transitions","type":"concept","definition":"A process may be running, ready, or blocked, and events such as dispatch, descheduling, I/O initiation, and I/O completion move it among these states.","source_locators":[{"source_id":"OSTEP","locator":"Chapter 4, section 4.4 Process States, pp. 5-7","note":"Defines simplified process states and legal transitions."}],"diagnostic_goal":"Diagnose whether the learner understands the simplified running, ready, and blocked process states and the events that legally move a process among them.","levels":{"L0":"Cannot identify the three simplified process states or confuses process states with unrelated ideas such as files, programs on disk, or CPU hardware components; gives transitions that do not reflect execution or waiting behavior.","L1":"Can recall the labels running, ready, and blocked, and may repeat that processes move between states, but cannot reliably say what each state means or what events cause movement among them.","L2":"Can explain in basic terms that running means executing, ready means able to run but not currently on the CPU, and blocked means waiting for something such as I/O; recognizes simple transitions but has weak boundaries between ready and blocked.","L3":"Can accurately relate each state to CPU availability and waiting conditions, and can describe source-grounded transitions such as ready-to-running by dispatch, running-to-ready by descheduling, running-to-blocked on I/O initiation, and blocked-to-ready on I/O completion; avoids common illegal or vague transitions.","L4":"Can apply the state model to new execution traces, deciding which state a process enters after scheduling decisions or I/O events and explaining why a process cannot run while blocked even if the CPU is free.","L5":"Can teach or critique the simplified three-state model, generate valid and invalid transition examples, explain what assumptions the simplification makes, and use the model to reason clearly about process behavior without treating it as a user-specific state record."},"diagnostic_signals":["Correctly distinguishes ready from blocked by whether the process could run if scheduled versus whether it is waiting for an event such as I/O completion.","Names events that cause transitions, including dispatch, descheduling, I/O initiation, and I/O completion.","Avoids saying that I/O completion moves a process directly to running unless scheduling also occurs.","Explains running-to-ready as removal from the CPU rather than process termination or failure.","Can trace a short sequence of events and assign a state after each step.","Common misconception: treats blocked as simply lower priority or paused by the scheduler rather than waiting for an external event."],"simulator_behavior":"When answering about this node, responses should reflect the learner's ability to name the three states, define their execution or waiting conditions, and reason about legal transitions caused by scheduling and I/O events."},{"id":"process_list_and_process_control_block","name":"Process List and Process Control Block","type":"concept","definition":"The operating system records per-process information in structures such as a process list and process control blocks, including state, saved context, process identifiers, parent relationships, open files, and other metadata.","source_locators":[{"source_id":"OSTEP","locator":"Chapter 4, section 4.5 Data Structures, pp. 7-9","note":"Explains OS data structures for tracking processes."}],"diagnostic_goal":"Diagnose whether the learner understands that the operating system tracks per-process information in process lists and process control blocks, including state, saved context, identifiers, relationships, open files, and metadata.","levels":{"L0":"Does not recognize that the OS maintains per-process data structures, or confuses a process control block with the process's executable code, memory image, or user-visible command.","L1":"Can recall terms such as process list or process control block but gives only a memorized phrase and cannot describe what information is stored or why the OS needs it.","L2":"Can explain that the OS keeps a record for each process and that this record includes information such as process state or identifiers, but omits important categories such as saved context or open files and has unclear separation between the list and the per-process record.","L3":"Can describe that the OS uses a process list to track all processes and per-process structures such as PCBs to hold state, saved register or context information, process identifiers, parent relationships, open files, and other metadata needed to manage running, ready, and blocked processes.","L4":"Can apply the idea to operational scenarios, explaining what PCB or process-list information the OS would consult or update during a state change, context save, process relationship query, or open-file management task.","L5":"Can abstractly explain why explicit OS data structures are necessary for process management, critique incomplete PCB descriptions, and generate examples of metadata needed to resume, identify, relate, or account for processes while keeping the structure objective and not user-specific."},"diagnostic_signals":["Mentions that the process list contains information about all processes in the system.","Identifies the process control block as a per-process OS structure rather than the process itself.","Lists source-grounded examples of stored information: state, saved context, process identifiers, parent relationships, open files, and metadata.","Connects PCB contents to management of running, ready, and blocked processes.","Avoids claiming that a PCB stores only program instructions or only memory contents.","Can explain why saved context is needed for stopping and later resuming a process."],"simulator_behavior":"When answering about this node, responses should show whether the learner can identify process-tracking structures, name representative fields, and explain how those fields support OS process management."},{"id":"fork_process_creation","name":"fork Process Creation","type":"concept","definition":"fork() creates a new child process that is almost an exact copy of the calling parent, with parent and child continuing from the fork call but receiving distinct return values.","source_locators":[{"source_id":"OSTEP","locator":"Chapter 5, section 5.1 The fork() System Call, pp. 1-3","note":"Explains fork behavior and parent-child return values."}],"diagnostic_goal":"Diagnose whether the learner understands fork() as creating an almost exact child copy of the calling process, with both parent and child continuing from the fork call and receiving different return values.","levels":{"L0":"Does not recognize fork() as process creation or confuses it with replacing a program, waiting for a child, or starting an unrelated program without parent-child continuity.","L1":"Can state that fork() creates a child process, but cannot explain what is copied, where execution resumes, or how parent and child are distinguished after the call.","L2":"Can explain that fork() makes a new process similar to the parent and that both keep running, but is uncertain about the return values or may think only the child continues after the call.","L3":"Can accurately describe that fork() creates an almost exact copy of the calling process, that both parent and child continue from the fork call, and that the parent receives the child PID while the child receives zero.","L4":"Can apply fork() semantics to short code or execution traces, predicting which statements can run in both processes and using the distinct return values to distinguish parent and child behavior.","L5":"Can generate and analyze fork() examples, explain why the return-value asymmetry is useful for process-control logic, and critique misconceptions such as fork() immediately loading a different program or returning only once globally."},"diagnostic_signals":["States that the child is an almost exact copy of the calling process.","Recognizes that execution continues in both parent and child from the fork call.","Correctly identifies the parent return value as the child's PID and the child return value as zero.","Avoids conflating fork() with exec() image replacement.","Can predict that code after fork() may execute in both processes.","Common misconception: says fork() creates a new thread rather than a new child process."],"simulator_behavior":"When answering about this node, responses should reveal whether the learner can reason about fork-created parent and child processes, continuation point, copying behavior, and distinct return values."},{"id":"unix_fork_exec_and_wait_process_api","name":"UNIX fork, exec, and wait Process API","type":"concept","definition":"UNIX process control combines fork() to create a process, exec() to run a different program in a process, and wait() to let a parent order itself with a child process's completion.","source_locators":[{"source_id":"OSTEP","locator":"Chapter 5, Interlude: Process API, pp. 1-5","note":"Introduces the core process-management calls together."}],"diagnostic_goal":"Diagnose whether the learner understands the combined role of fork(), exec(), and wait() in UNIX process control: creating a process, running a different program, and ordering a parent with a child's completion.","levels":{"L0":"Cannot distinguish fork(), exec(), and wait(), or treats them as interchangeable commands for simply starting or ending a program.","L1":"Can recall the names fork, exec, and wait as UNIX process API calls, but cannot assign their separate roles or explain why they are used together.","L2":"Can give a basic role for one or two calls, such as fork creates a process or wait pauses a parent, but has incomplete or confused understanding of exec() or the parent-child ordering purpose.","L3":"Can explain the combined API: fork() creates a child process, exec() runs a different program within a process, and wait() lets a parent order itself with the completion of a child process.","L4":"Can apply the combined API to scenarios such as a parent launching a child program and needing to continue only after the child finishes, selecting which call is responsible for creation, image change, and ordering.","L5":"Can explain why separating these calls provides flexible process control, generate correct sequences using fork, exec, and wait, and critique designs or explanations that collapse creation, program replacement, and synchronization into one indistinct operation."},"diagnostic_signals":["Correctly assigns fork() to creating a child process.","Correctly assigns exec() to running a different program in an existing process rather than creating the process.","Correctly assigns wait() to a parent ordering itself with a child's completion.","Describes how the calls work together rather than as isolated vocabulary.","Avoids saying wait() creates or replaces a process.","Can identify which call would be missing if a parent launches a child but does not wait for foreground-style completion."],"simulator_behavior":"When answering about this node, responses should reflect the learner's ability to separate and combine the roles of fork(), exec(), and wait() in UNIX process management."},{"id":"exec_process_image_replacement","name":"exec Process Image Replacement","type":"concept","definition":"exec() replaces the current program image by loading code and static data from an executable into the existing process, without creating a new process identifier.","source_locators":[{"source_id":"OSTEP","locator":"Experiment Scope: Operating Systems Foundations (part 2), Chapter 5, Section 5.4","note":"Describes exec as transforming the current process image."}],"diagnostic_goal":"Diagnose whether the learner understands exec() as replacing the current program image by loading a different executable into the same process, without creating a new process identifier, and that successful exec() does not return.","levels":{"L0":"Does not recognize exec() as program image replacement, or confuses it with fork() creating a new child process or wait() ordering a parent with a child.","L1":"Can recall that exec() runs a program, but cannot explain that it transforms the currently running process rather than making a new process.","L2":"Can explain that exec() starts or loads another program, but may still think it creates a new process identifier or returns normally to the old program after success.","L3":"Can accurately state that exec() replaces the current program image by loading code and static data from an executable into the existing process, keeps the process identity rather than creating a new PID, and does not return if successful.","L4":"Can apply exec() semantics to examples, predicting that code after a successful exec() in the old program will not run and that the process continues as a different program under the same process identity.","L5":"Can teach or critique exec() behavior, generate examples showing failure versus successful replacement, and clearly distinguish image replacement from process creation when reasoning about process-control designs."},"diagnostic_signals":["States that exec() does not create a new process.","Describes replacement or transformation of the current program image.","Mentions loading code and static data from an executable into the existing process.","Recognizes that the process identifier is not newly created by exec().","Recognizes that a successful exec() does not return to the old program.","Common misconception: says exec() is the call that creates the child process."],"simulator_behavior":"When answering about this node, responses should show whether the learner can reason about exec() as same-process program-image replacement and distinguish it from process creation and waiting."},{"id":"fork_and_exec_separation_in_a_shell","name":"fork and exec Separation in a Shell","type":"concept","definition":"The separation of fork() and exec() enables a shell to create a child, adjust the child's execution context, run the requested command, and use wait() for foreground command ordering.","source_locators":[{"source_id":"OSTEP","locator":"Experiment Scope: Operating Systems Foundations (part 2), Chapter 5, Section 5.4","note":"Uses the shell as the motivating application for separating fork and exec."}],"diagnostic_goal":"Diagnose whether the learner understands why a UNIX shell benefits from separating fork() and exec(): the shell can create a child, modify the child's execution context, run the requested command, and use wait() for foreground ordering.","levels":{"L0":"Does not connect fork(), exec(), and wait() to shell command execution, or thinks the shell simply replaces itself with every command without preserving control.","L1":"Can recall that shells use fork() and exec(), but cannot explain why the separation matters or what happens between the two calls.","L2":"Can explain that a shell creates a child and runs a command, but has only a vague idea of how fork and exec divide responsibilities or why wait() is used for foreground commands.","L3":"Can explain that the shell uses fork() to create a child, can adjust the child's execution context before exec(), then uses exec() to run the requested command and wait() when the foreground shell must order itself after child completion; recognizes redirection as an example enabled by the gap between fork and exec.","L4":"Can apply the separation to shell scenarios, such as explaining where redirection setup belongs, why the parent shell remains available after the child command completes, and when wait() is needed for foreground command ordering.","L5":"Can critique alternative shell designs that combine creation and replacement too tightly, generate examples of context changes between fork and exec, and explain the flexibility gained by the separated API while distinguishing it from general fork or exec semantics alone."},"diagnostic_signals":["Explains that the shell forks a child rather than replacing the shell process directly for ordinary command execution.","Identifies code between fork() and exec() as the place where the child's execution context can be adjusted.","Uses redirection as a source-grounded example of a feature enabled between fork and exec.","States that exec() runs the requested command in the child after setup.","States that wait() is used by the parent shell for foreground command ordering.","Common misconception: says the parent shell calls exec() directly and therefore continues normally afterward."],"simulator_behavior":"When answering about this node, responses should reveal whether the learner can use the shell example to explain the practical value of separating process creation, context adjustment, command execution, and foreground waiting."},{"id":"limited_direct_execution","name":"Limited Direct Execution","type":"concept","definition":"Limited direct execution virtualizes the CPU by running a program directly on the processor while using OS and hardware support to restrict the program and preserve OS control.","source_locators":[{"source_id":"OSTEP","locator":"Experiment Scope: Operating Systems Foundations (part 2), Chapter 6, Sections 6.1 and 6.5","note":"Introduces the efficient-but-controlled approach to CPU virtualization."}],"diagnostic_goal":"Diagnose whether the learner understands limited direct execution as CPU virtualization that runs programs directly on the processor for efficiency while using OS and hardware support to restrict execution and preserve OS control.","levels":{"L0":"Does not recognize limited direct execution as a CPU virtualization technique, or treats it as either unrestricted direct hardware access by programs or complete interpretation by the OS.","L1":"Can recall the phrase limited direct execution or that programs run on the CPU, but cannot explain the tension between efficiency and control.","L2":"Can explain that the program runs directly on the processor and that some restrictions exist, but has an incomplete account of why hardware and OS support are needed or how OS control is preserved.","L3":"Can describe limited direct execution as running the program directly on the CPU while setting up hardware and OS mechanisms to limit what the program can do, enabling efficient CPU virtualization without reducing the OS to a mere library.","L4":"Can apply the idea to scenarios involving protected execution, explaining why direct execution is fast and why limits are necessary for restricted operations, control transfer, or safe sharing of the CPU.","L5":"Can critique the design tradeoff of efficiency versus control, generate examples of what could go wrong with no limits, and explain how limited direct execution supports virtualization while preserving objective OS authority over resources."},"diagnostic_signals":["Mentions both parts of the idea: direct CPU execution and limits or restrictions.","Explains that hardware setup or support is needed before running the program directly.","Connects the approach to efficient CPU virtualization.","Recognizes the need to preserve OS control rather than letting applications fully control hardware.","Avoids describing the OS as merely a library that the program may ignore.","Common misconception: equates limited direct execution with emulating every instruction in software."],"simulator_behavior":"When answering about this node, responses should show whether the learner can balance the efficiency of direct execution with the control provided by OS and hardware limits."},{"id":"user_mode_and_kernel_mode","name":"User Mode and Kernel Mode","type":"concept","definition":"User mode restricts application code from privileged operations, while kernel mode gives the operating system authority to access hardware resources and execute restricted instructions.","source_locators":[{"source_id":"OSTEP","locator":"Experiment Scope: Operating Systems Foundations (part 2), Chapter 6, Section 6.2","note":"Contrasts restricted user execution with privileged kernel execution."}],"diagnostic_goal":"Diagnose whether the learner understands the distinction between user mode and kernel mode as a hardware-supported privilege boundary that restricts applications while allowing the operating system to perform privileged operations and access hardware resources.","levels":{"L0":"Cannot distinguish user mode from kernel mode, or reverses their privileges by saying applications have full hardware authority while the OS is restricted.","L1":"Can recall the terms user mode and kernel mode, but gives only a memorized contrast such as user versus OS without explaining privileges, restricted instructions, or hardware access.","L2":"Can explain that user programs are more restricted and the OS has more privilege, but gives vague examples and may not connect the distinction to protected I/O or restricted operations.","L3":"Can accurately describe that applications in user mode lack full access to hardware resources and privileged instructions, while the operating system in kernel mode can access hardware resources and execute restricted instructions to provide protected services.","L4":"Can apply the mode distinction to scenarios, deciding whether an operation such as direct I/O or privileged resource access must occur in kernel mode and explaining why applications must use OS services instead of directly performing it.","L5":"Can critique explanations of protection mechanisms, generate valid examples of user-mode and kernel-mode responsibilities, and explain how the distinction supports limited direct execution by combining application execution with OS-controlled access to hardware."},"diagnostic_signals":["States that user mode restricts application access to hardware resources.","States that kernel mode gives the OS authority to execute privileged or restricted instructions.","Uses I/O or hardware access as an example of a protected operation.","Avoids saying user mode and kernel mode are merely different programming languages or user accounts.","Explains why OS services are needed for restricted operations by applications.","Connects the privilege distinction to controlled execution rather than only naming two modes."],"simulator_behavior":"When answering about this node, responses should reveal whether the learner can distinguish application-level restricted execution from OS-level privileged execution and reason about protected hardware operations."},{"id":"system_call_trap_and_return_from_trap","name":"System Call Trap and Return From Trap","type":"concept","definition":"A system call uses a trap instruction to enter the kernel with raised privilege, and a return-from-trap resumes the user program while lowering privilege back to user mode.","source_locators":[{"source_id":"OSTEP","locator":"Experiment Scope: Operating Systems Foundations (part 2), Chapter 6, Section 6.2","note":"Describes controlled privilege transfer for system calls."}],"diagnostic_goal":"Diagnose whether the user understands how a system call uses a trap to enter the kernel under controlled higher privilege and how return-from-trap resumes the user program with privilege lowered back to user mode.","levels":{"L0":"Cannot identify the role of trap or return-from-trap in a system call, or treats a system call as an ordinary function call with no privilege change or controlled kernel entry.","L1":"Can recall that a trap is involved in system calls and that the kernel runs them, but gives a memorized or vague account of privilege changes and return behavior.","L2":"Can explain that a trap transfers execution from user code into the kernel and raises privilege, and that return-from-trap goes back to the user program, but may be unclear about why the transfer is controlled or that privilege is lowered on return.","L3":"Can describe the full two-way control flow: user program executes a trap for a system call, hardware enters the kernel with raised privilege, the OS performs the requested work, and return-from-trap resumes the user program in user mode; can distinguish this from an unrestricted jump into kernel code.","L4":"Can apply the concept to reason about new system-call scenarios, identifying when execution should trap, what privilege mode the CPU should be in before, during, and after the call, and why return-from-trap is necessary for safe resumption.","L5":"Can critique and teach the mechanism as a controlled privilege transition, generate examples and counterexamples, and explain the security and control consequences of omitting either trap-mediated entry or privilege-lowering return."},"diagnostic_signals":["States that a trap both jumps into the kernel and raises privilege to kernel mode.","States that return-from-trap resumes the calling user program and lowers privilege back to user mode.","Distinguishes a system call trap from an ordinary user-level function call or arbitrary jump.","Correctly tracks CPU mode before the trap, during kernel execution, and after return-from-trap.","Explains that the transition is controlled so user programs can request OS services without directly running arbitrary privileged code.","Common misconception: says the user program remains in user mode while executing kernel code.","Common misconception: says return-from-trap only returns a value and does not affect privilege or execution mode."],"simulator_behavior":"When answering, reflect the user state by varying whether responses merely name traps, explain the trap and return path, track privilege changes accurately, and reason about why controlled entry and privilege-lowering return are required."},{"id":"trap_table_controlled_kernel_entry","name":"Trap Table Controlled Kernel Entry","type":"concept","definition":"A trap table is initialized by the kernel so hardware invokes approved OS handlers for system calls, interrupts, and exceptional events instead of letting user code choose arbitrary kernel entry points.","source_locators":[{"source_id":"OSTEP","locator":"Experiment Scope: Operating Systems Foundations (part 2), Chapter 6, Section 6.2","note":"Explains boot-time setup of controlled trap destinations."}],"diagnostic_goal":"Diagnose whether the user understands that the kernel initializes a trap table at boot so hardware dispatches system calls, interrupts, and exceptions only to approved OS handler locations.","levels":{"L0":"Does not recognize what a trap table is, or believes user programs directly choose arbitrary kernel addresses for system calls, interrupts, or exceptions.","L1":"Can recall the term trap table and associate it with traps or handlers, but cannot explain who sets it up, when it is set up, or how it constrains kernel entry.","L2":"Can explain that a trap table maps trap-like events to OS handlers, but may be vague about boot-time kernel initialization or why user code cannot freely choose the target.","L3":"Can describe that the kernel sets up the trap table at boot, hardware uses it to invoke approved handlers for system calls, interrupts, and exceptional events, and this preserves kernel control over entry points.","L4":"Can apply the concept to scenarios by deciding whether a proposed kernel entry path is safe, identifying which component chooses handler addresses, and explaining how the trap table prevents arbitrary user-selected kernel jumps.","L5":"Can critique and generalize the trap table mechanism as an indirection that balances controlled access to OS services with protection, and can generate examples showing what would go wrong without kernel-controlled handler registration."},"diagnostic_signals":["Mentions that the kernel initializes the trap table at boot time.","Identifies the trap table as containing approved OS handler locations for system calls, interrupts, and exceptional events.","Explains that hardware consults the table on trap-like events rather than trusting a user-supplied arbitrary destination.","Connects the trap table to controlled kernel entry and protection of kernel control flow.","Distinguishes trap table setup from the user program invoking a system call.","Common misconception: says each user process installs its own kernel trap destinations.","Common misconception: treats the trap table as merely a list of system call names with no control-flow or protection function."],"simulator_behavior":"When answering, reflect the user state by varying whether responses confuse the trap table with user-chosen jumps, merely recall the term, or accurately explain boot-time kernel setup and hardware dispatch to approved OS handlers."},{"id":"timer_interrupt_for_preemptive_control","name":"Timer Interrupt for Preemptive Control","type":"concept","definition":"A timer interrupt periodically transfers control from the running process back to the operating system, allowing the OS to preempt non-cooperative or CPU-bound code.","source_locators":[{"source_id":"OSTEP","locator":"Experiment Scope: Operating Systems Foundations (part 2), Chapter 6, Section 6.3","note":"Shows how the OS regains control without process cooperation."}],"diagnostic_goal":"Diagnose whether the user understands how a timer interrupt lets the operating system regain control from a running process without relying on that process to cooperate.","levels":{"L0":"Does not recognize timer interrupts as a mechanism for OS control, or thinks a CPU-bound process can run indefinitely unless it voluntarily calls the OS.","L1":"Can recall that timer interrupts are related to scheduling or preemption, but cannot explain how they transfer control back to the operating system.","L2":"Can explain that a timer interrupt periodically stops the current process and lets the OS run, but may be unclear about the contrast with cooperative system calls or about why this matters for CPU-bound code.","L3":"Can describe that the OS programs a timer so an interrupt periodically transfers control from the running process to the OS, enabling preemption of non-cooperative or CPU-bound processes and possible scheduling of another process.","L4":"Can apply the concept to scheduling scenarios by identifying when a timer interrupt is needed, predicting that the OS regains control even if the process makes no system calls, and reasoning about preemptive control over CPU use.","L5":"Can critique and teach timer interrupts as the foundation for non-cooperative preemptive control, generate examples contrasting cooperative and preemptive behavior, and explain consequences if the timer mechanism were absent or disabled."},"diagnostic_signals":["States that a timer interrupt periodically transfers control from the running process to the OS.","Contrasts preemptive control with waiting for a process to make a system call or otherwise cooperate.","Explains that the OS can stop or preempt CPU-bound or non-cooperative code.","Mentions that after the OS regains control it may choose to run another process.","Correctly avoids describing timer interrupts as ordinary function calls made by the process.","Common misconception: says the timer interrupt is requested voluntarily by the running program.","Common misconception: says preemption requires the process to finish or block first."],"simulator_behavior":"When answering, reflect the user state by varying whether responses rely on cooperative process behavior, merely mention scheduling, or accurately explain periodic timer-driven transfer of control back to the OS for preemption."},{"id":"context_switch","name":"Context Switch","type":"concept","definition":"A context switch saves the execution state of the currently running process and restores the saved state of another process so the CPU resumes execution in the new process.","source_locators":[{"source_id":"OSTEP","locator":"Experiment Scope: Operating Systems Foundations (part 2), Chapter 6, Section 6.3","note":"Describes saving and restoring register and kernel context."}],"diagnostic_goal":"Diagnose whether the user understands that a context switch saves the current process execution state and restores another process state so the CPU resumes the other process correctly.","levels":{"L0":"Does not recognize context switching as saving and restoring process execution state, or confuses it with simply starting a new program or changing a variable.","L1":"Can recall that a context switch changes from one process to another, but gives little detail about saved and restored state.","L2":"Can explain that the OS saves the current process state and loads another process state, but may omit key state such as registers, program counter, or kernel stack context, or may be imprecise about resumption.","L3":"Can describe a scheduler-triggered switch in which the OS saves register values and related execution context for the currently running process and restores the saved registers, program counter, and kernel stack context of another process so it resumes where it left off.","L4":"Can apply the concept to trace what happens during a switch between processes, identify which saved state determines where execution resumes, and reason about errors that would occur if state were not saved or restored correctly.","L5":"Can critique and teach context switching as a state-preservation mechanism underlying multiprogramming, generate examples of correct and incorrect switch behavior, and abstract the need to preserve enough CPU and kernel context for transparent resumption."},"diagnostic_signals":["Says the current process's execution state is saved before another process runs.","Mentions restoring a previously saved state for the next process.","Identifies relevant state such as registers, program counter, and kernel stack context.","Explains that the new process resumes execution from its saved point, not from the beginning unless that is its saved state.","Connects the context switch to a scheduler decision without reducing it to scheduling policy alone.","Common misconception: says a context switch only changes memory ownership or process priority.","Common misconception: omits restoration and describes only saving the old process."],"simulator_behavior":"When answering, reflect the user state by varying whether responses merely say processes switch, include partial saved-state details, or accurately track saving and restoring CPU and kernel context for resumption."},{"id":"scheduling_turnaround_time_and_response_time","name":"Scheduling Turnaround Time and Response Time","type":"concept","definition":"Turnaround time measures completion time minus arrival time, while response time measures the time from a job's arrival until its first scheduled execution.","source_locators":[{"source_id":"OSTEP","locator":"Experiment Scope: Operating Systems Foundations (part 2), Chapter 7, Sections 7.2 and 7.6","note":"Defines the core scheduling metrics for batch and interactive workloads."}],"diagnostic_goal":"Diagnose whether the user can distinguish and compute scheduling turnaround time and response time from job arrival, first scheduled execution, and completion times.","levels":{"L0":"Cannot identify turnaround time or response time, or confuses both with unrelated quantities such as total CPU burst length regardless of arrival or first run time.","L1":"Can recall the names of the two metrics or one formula fragment, but often swaps them or cannot apply them to a job timeline.","L2":"Can explain that turnaround concerns completion and response concerns first scheduling, and may compute simple cases, but may still make boundary errors with arrival time or with jobs that wait before first running.","L3":"Can state and use the definitions: turnaround time is completion time minus arrival time, while response time is first scheduled execution time minus arrival time; can explain why response time is important for interactive time-shared systems.","L4":"Can apply both metrics across new schedules with multiple arrivals, waiting periods, and preemption, correctly identifying completion and first-run times and comparing how policies affect batch versus interactive goals.","L5":"Can critique and teach the distinction between completion-oriented and first-response-oriented scheduling metrics, generate schedules that separate the two, and explain why optimizing one metric may not optimize the other."},"diagnostic_signals":["Correctly defines turnaround time as completion time minus arrival time.","Correctly defines response time as time from arrival until first scheduled execution.","Uses first run time, not completion time, when computing response time.","Uses arrival time as the baseline for both metrics.","Can explain that turnaround was introduced as a performance metric and response time matters for interactive time-shared systems.","Common misconception: computes response time as completion time minus arrival time.","Common misconception: ignores arrival time and uses only service or run duration."],"simulator_behavior":"When answering, reflect the user state by varying whether responses swap the metrics, recite formulas without applying them, or accurately compute and interpret turnaround and response times from scheduling timelines."},{"id":"fifo_scheduling_and_convoy_effect","name":"FIFO Scheduling and Convoy Effect","type":"concept","definition":"FIFO scheduling runs jobs in arrival order; if a long job precedes short jobs, the short jobs can wait behind it and experience the convoy effect and poor turnaround time.","source_locators":[{"source_id":"OSTEP","locator":"Experiment Scope: Operating Systems Foundations (part 2), Chapter 7, Section 7.3","note":"Introduces FIFO and its convoy-effect weakness."}],"diagnostic_goal":"Diagnose whether the user understands FIFO scheduling by arrival order and how a long job ahead of short jobs can create the convoy effect and poor turnaround time.","levels":{"L0":"Does not recognize FIFO scheduling or believes it selects jobs by shortest length, priority, or response needs rather than arrival order.","L1":"Can recall that FIFO means first-in-first-out or arrival order, but cannot explain the convoy effect or its impact on waiting and turnaround.","L2":"Can explain that FIFO runs jobs in arrival order and that short jobs may wait behind a long job, but may not clearly connect this to poor turnaround time or the convoy-effect pattern.","L3":"Can describe FIFO as simple non-reordering by arrival order and explain the convoy effect: relatively short jobs queue behind a heavyweight resource consumer, causing unnecessary waiting and poor turnaround when job lengths differ.","L4":"Can apply the concept to scheduling examples by constructing FIFO order, calculating or comparing waiting and turnaround effects, and identifying when a long leading job will produce a convoy effect.","L5":"Can critique FIFO's simplicity versus its weakness under mixed job lengths, teach the convoy effect with examples and counterexamples, and reason about why alternative policies may improve turnaround in such cases."},"diagnostic_signals":["States that FIFO runs jobs in the order they arrive.","Identifies a long or heavyweight job at the front as the cause of short jobs waiting behind it.","Uses the term or concept of convoy effect for short jobs queued behind a long resource consumer.","Connects the convoy effect to poor waiting time or turnaround time for short jobs.","Can trace a simple FIFO schedule without reordering by job length.","Common misconception: says FIFO automatically gives good turnaround because it is fair by arrival order.","Common misconception: describes FIFO as selecting the shortest job first."],"simulator_behavior":"When answering, reflect the user state by varying whether responses only name arrival order, miss the convoy effect, or accurately explain and apply how long leading jobs degrade turnaround for short jobs."},{"id":"shortest_job_scheduling_policies","name":"Shortest-Job Scheduling Policies","type":"concept","definition":"SJF chooses the shortest known job in a non-preemptive setting, while STCF preempts when appropriate by always choosing the job with the least remaining time.","source_locators":[{"source_id":"OSTEP","locator":"Experiment Scope: Operating Systems Foundations (part 2), Chapter 7, Sections 7.4 and 7.5","note":"Covers SJF and its preemptive STCF variant."}],"diagnostic_goal":"Diagnose whether the user understands the relationship between SJF and STCF, including non-preemptive shortest-job choice versus preemptive least-remaining-time choice.","levels":{"L0":"Does not recognize SJF or STCF, or confuses them with FIFO, round-robin, or priority scheduling without reference to job length or remaining time.","L1":"Can recall that shortest-job policies choose short jobs, but cannot distinguish SJF from STCF or explain preemption.","L
